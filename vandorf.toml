# vcc: the vandorf compiler, written in vandorf.
#
# Control flow is .sys (src/); leaves are pure Rust funcs, in *_leaf.rs next
# to the .sys using them; I/O goes through interfaces (src/io.rs,
# src/ide/ide_io.rs). rs/ is the crate: generated code (rs/src/vcc,
# rs/src/bin) and lib.rs. vcc builds itself (see the README for the first
# vcc):
#
#   rs/target/release/vcc build         # regenerates rs/src/vcc, then builds
#   rs/target/release/vcc check | doc
[project]
name = "vcc"
sources = ["src"]

[rust]
out = "rs/src/vcc"
post = ["cargo build --manifest-path rs/Cargo.toml"]
test = ["cargo test --manifest-path rs/Cargo.toml"]

[bin.vcc]
entry = "Vcc"

# The IDE, on the working directory:
#   (cd rs && cargo build --release) && rs/target/release/ide
# Each route runs its own proc (src/ide); the pages share PageRoute.
[http.ide]
addr = "127.0.0.1:8080"
raw = { "GET /" = "PageRoute", "GET /project" = "PageRoute", "GET /explorer" = "PageRoute", "GET /viewer" = "PageRoute", "GET /terminal" = "PageRoute", "GET /workbench" = "PageRoute", "GET /viz" = "PageRoute", "GET /viz/" = "PageRoute", "GET /ui.css" = "CssRoute", "GET /api/project" = "ProjectRoute", "GET /api/sources" = "SourcesRoute", "GET /api/tree" = "TreeRoute", "GET /api/source" = "SourceRoute", "POST /api/compile" = "CompileRoute", "POST /api/save" = "SaveRoute", "POST /api/term" = "TermNewRoute", "GET /api/term/list" = "TermListRoute", "GET /api/term/read" = "TermReadRoute", "POST /api/term/input" = "TermInputRoute", "POST /api/term/resize" = "TermResizeRoute", "POST /api/term/kill" = "TermKillRoute" }

# grove, the idea tree (#17), on the git repository it's started in:
#   (cd rs && cargo build --release) && rs/target/release/grove
# Each route runs its own proc (src/grove); the terminal routes are the IDE's.
# With a command (grove branch, grove help, ...) it runs GroveCli instead.
[http.grove]
addr = "127.0.0.1:8090"
cli = "GroveCli"
raw = { "GET /" = "GrovePageRoute", "GET /api/ideas/wait" = "WaitRoute", "POST /api/agent/notify" = "NotifyRoute", "POST /api/agent/run" = "RunRoute", "POST /api/agent/status" = "StatusRoute", "POST /api/ideas/merge" = "MergeRoute", "POST /api/ideas/rebase" = "RebaseRoute", "POST /api/ideas/seen" = "SeenRoute", "GET /terminal" = "GrovePageRoute", "GET /ui.css" = "CssRoute", "GET /api/ideas" = "IdeasRoute", "POST /api/ideas/branch" = "BranchRoute", "POST /api/ideas/discard" = "DiscardRoute", "POST /api/ideas/delete" = "DeleteRoute", "POST /api/ideas/restore" = "RestoreRoute", "POST /api/ideas/rename" = "RenameRoute", "POST /api/ideas/layout" = "LayoutRoute", "POST /api/interior/open" = "OpenRoute", "POST /api/term" = "GroveTermRoute", "GET /api/term/list" = "TermListRoute", "GET /api/term/read" = "TermReadRoute", "POST /api/term/input" = "TermInputRoute", "POST /api/term/resize" = "TermResizeRoute", "POST /api/term/kill" = "TermKillRoute" }
