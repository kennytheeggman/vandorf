# vcc: the vandorf compiler, written in vandorf.
#
# Control flow is .sys; leaves are pure Rust funcs (rs/src/leaf.rs); I/O
# goes through interfaces (rs/src/io.rs). Build with `vandorf build` here,
# then `cd rs && cargo run --bin vcc -- <file.sys>`.
[project]
name = "vcc"
sources = ["sys"]

[rust]
out = "rs/src/vcc"

[bin.vcc]
entry = "Vcc"
