<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vandorf Workbench</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --ink:#0f172a; --mut:#64748b; --line:#dde3ec;
  --accent:#1f6feb; --accent-ink:#ffffff; --err:#c62828; --err-bg:#fdecec; --ok:#1b7f3b;
  --code-bg:#fbfcfe; --kw:#7c3aed; --str:#b45309; --com:#94a3b8; --type:#0e7490;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b111c; --surface:#111a29; --ink:#dbe6f4; --mut:#8aa2bf; --line:#22324a;
    --accent:#3b82f6; --accent-ink:#ffffff; --err:#ff8a80; --err-bg:#3a1618; --ok:#5fd38d;
    --code-bg:#0e1624; --kw:#c4b5fd; --str:#fbbf24; --com:#5b6f8a; --type:#67e8f9;
  }
}
*{ box-sizing:border-box }
html,body{ height:100%; margin:0 }
body{ background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; flex-direction:column }
header{ display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--surface);
  border-bottom:1px solid var(--line); flex-wrap:wrap }
header h1{ font-size:15px; margin:0 8px 0 0; font-weight:650 }
select,button{ font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
  border-radius:6px; padding:5px 10px }
button{ cursor:pointer }
button.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600 }
button.primary:hover{ filter:brightness(1.08) }
#status{ color:var(--mut); font-size:13px }
#status.ok{ color:var(--ok) } #status.bad{ color:var(--err) }
header .spacer{ flex:1 }
header a{ color:var(--accent); font-size:13px; text-decoration:none }
kbd{ font:11px ui-monospace,monospace; border:1px solid var(--line); border-radius:4px; padding:0 4px; color:var(--mut) }

main{ flex:1; display:grid; grid-template-columns:minmax(320px,42%) 1fr; min-height:0 }
#left{ display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line) }
#editorWrap{ flex:1; min-height:0; position:relative }
#editorWrap textarea{ width:100%; height:100%; border:0; resize:none; padding:10px;
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--code-bg); color:var(--ink) }
.CodeMirror{ height:100%; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--code-bg); color:var(--ink) }
.CodeMirror-gutters{ background:var(--surface); border-right:1px solid var(--line) }
.CodeMirror-linenumber{ color:var(--mut) }
.CodeMirror-cursor{ border-left-color:var(--ink) }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected{ background:rgba(59,130,246,.22) }
/* Scoped under .CodeMirror to win over its default theme (.cm-s-default). */
.CodeMirror .cm-keyword{ color:var(--kw); font-weight:600 } .CodeMirror .cm-string, .CodeMirror .cm-number{ color:var(--str) }
.CodeMirror .cm-comment{ color:var(--com); font-style:italic } .CodeMirror .cm-type{ color:var(--tyc) }
.cm-errmark{ text-decoration:wavy underline var(--err); background:var(--err-bg) }

#diags{ max-height:34%; overflow:auto; border-top:1px solid var(--line); background:var(--surface); display:none }
#diags.on{ display:block }
#diags .d{ padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; color:var(--err); font-size:13px }
#diags .d:hover{ background:var(--err-bg) }
#diags .d b{ font-family:ui-monospace,monospace; font-weight:600; margin-right:8px }
#diags pre{ margin:0; padding:8px 12px; font:12px/1.45 ui-monospace,monospace; color:var(--mut); white-space:pre-wrap }

#right{ display:flex; flex-direction:column; min-height:0; min-width:0 }
.tabs{ display:flex; gap:2px; padding:6px 10px 0; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap }
.tabs button{ border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--mut); padding:6px 10px }
.tabs button.on{ color:var(--ink); border-bottom-color:var(--accent) }
.pane{ flex:1; min-height:0; display:none }
.pane.on{ display:flex; flex-direction:column }
iframe{ flex:1; border:0; width:100%; background:var(--surface) }
.files{ display:flex; gap:6px; padding:8px 10px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line) }
.files button.on{ border-color:var(--accent); color:var(--accent) }
.files .kind{ font-size:11px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:var(--mut); margin-left:6px }
.files .kind:first-child{ margin-left:0 }
.code, #implPane{ flex:1; overflow:auto; margin:0; padding:12px 14px; background:var(--code-bg);
  font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre; tab-size:4 }
#implPane{ white-space:normal; font-family:inherit }
#implPane h3{ font-size:13px; margin:18px 0 6px } #implPane h3:first-child{ margin-top:0 }
table{ border-collapse:collapse; width:100% }
th,td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px }
td code{ font:12px ui-monospace,monospace; white-space:pre-wrap; word-break:break-word }
.empty{ color:var(--mut); padding:16px }
@media (max-width: 800px){
  main{ grid-template-columns:1fr; grid-template-rows:45% 55% }
  #left{ border-right:0; border-bottom:1px solid var(--line) }
}
</style>
</head>
<body>
<header>
  <h1>Vandorf workbench</h1>
  <select id="file" title="Load a .sys file from the source directory"><option value="">Load file…</option></select>
  <button class="primary" id="compile" title="Compile (Ctrl/Cmd+Enter)">Compile ▸</button>
  <kbd>Ctrl/⌘+Enter</kbd>
  <label style="font-size:13px;color:var(--mut)"><input type="checkbox" id="auto" checked> auto</label>
  <span id="status"></span>
  <span class="spacer"></span>
  <a href="/viz" target="_blank" rel="noopener">Open visualizer in a new tab ↗</a>
</header>
<main>
  <section id="left">
    <div id="editorWrap"><textarea id="src" spellcheck="false"></textarea></div>
    <div id="diags"></div>
  </section>
  <section id="right">
    <nav class="tabs" id="tabs">
      <button data-pane="vizPane" class="on">Diagram</button>
      <button data-pane="goPane">Go</button>
      <button data-pane="rustPane">Rust</button>
      <button data-pane="implPane">Implementations</button>
    </nav>
    <div class="pane on" id="vizPane"><iframe id="viz" src="/viz" title="Visualizer"></iframe></div>
    <div class="pane" id="goPane"><div class="files"></div><pre class="code empty">Compile to see generated Go.</pre></div>
    <div class="pane" id="rustPane"><div class="files"></div><pre class="code empty">Compile to see generated Rust.</pre></div>
    <div class="pane" id="implPane"><div class="empty">Compile to see implementation references.</div></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<script>
(function(){
var $ = function(id){ return document.getElementById(id); };
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

/* ---------- editor (CodeMirror if the CDN loaded, else the textarea) ---------- */
var cm = null, marks = [];
if (window.CodeMirror && CodeMirror.defineSimpleMode){
  CodeMirror.defineSimpleMode('vandorf', { start: [
    { regex: /\/\/.*/, token: 'comment' },
    { regex: /"(?:[^\\"]|\\.)*"/, token: 'string' },
    { regex: /\b(?:interface|func|proc|enum|switch|collect|for|each|as|type|else|map|in|id)\b/, token: 'keyword' },
    { regex: /\b(?:true|false)\b|-?\b\d+(?:\.\d+)?\b/, token: 'number' },
    { regex: /\b(?:int|float|bool|string|void)\b/, token: 'type' },
    { regex: /\bthis\b/, token: 'keyword' },
  ]});
  cm = CodeMirror.fromTextArea($('src'), {
    mode: 'vandorf', lineNumbers: true, indentWithTabs: true, tabSize: 4, indentUnit: 4,
    extraKeys: { 'Ctrl-Enter': compile, 'Cmd-Enter': compile },
  });
}
var editor = {
  get: function(){ return cm ? cm.getValue() : $('src').value; },
  set: function(s){ if (cm) cm.setValue(s); else $('src').value = s; },
  onChange: function(f){ if (cm) cm.on('change', f); else $('src').addEventListener('input', f); },
  clearMarks: function(){ marks.forEach(function(m){ m.clear(); }); marks = []; },
  mark: function(from, to){
    if (!cm) return;
    if (from.line === to.line && from.ch === to.ch) to = { line: to.line, ch: to.ch + 1 };
    marks.push(cm.markText(from, to, { className: 'cm-errmark' }));
  },
  jump: function(pos){
    if (cm){ cm.focus(); cm.setCursor(pos); cm.scrollIntoView(pos, 80); }
  },
};
if (!cm){
  $('src').addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); compile(); }
  });
}

/* ---------- tabs ---------- */
$('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  Array.prototype.forEach.call($('tabs').children, function(x){ x.classList.toggle('on', x === b); });
  Array.prototype.forEach.call(document.querySelectorAll('.pane'), function(p){ p.classList.toggle('on', p.id === b.dataset.pane); });
  store('vandorf.wb.tab', b.dataset.pane);
});
var savedTab = store('vandorf.wb.tab');
if (savedTab){ var tb = document.querySelector('[data-pane="' + savedTab + '"]'); if (tb) tb.click(); }

/* ---------- visualizer iframe ---------- */
var lastDoc = null, vizReady = false;
function pushDoc(){
  if (!lastDoc || !vizReady) return;
  $('viz').contentWindow.postMessage({ type: 'vandorf-document', document: lastDoc.document, name: lastDoc.name }, location.origin);
}
window.addEventListener('message', function(e){
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === 'vandorf-viz-ready'){ vizReady = true; pushDoc(); }
});

/* ---------- compile ---------- */
function setStatus(text, cls){ var s = $('status'); s.textContent = text; s.className = cls || ''; }
var seq = 0;
function compile(){
  var my = ++seq;
  setStatus('Compiling…');
  fetch('/api/compile', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: editor.get(), path: $('file').value || undefined, name: $('file').value || '<editor>' }) })
    .then(function(r){ return r.json(); })
    .then(function(res){ if (my === seq) show(res); })
    .catch(function(e){ if (my === seq) setStatus('Network error: ' + e, 'bad'); });
}

function show(res){
  editor.clearMarks();
  var d = $('diags');
  if (!res.ok){
    var list = res.diagnostics || [];
    setStatus(list.length ? list.length + ' error' + (list.length === 1 ? '' : 's') : 'error', 'bad');
    d.innerHTML = list.map(function(x, i){
      // Errors in other files of the project are listed, not marked.
      var where = (x.here ? '' : x.file + ' ') + (x.from.line + 1) + ':' + (x.from.ch + 1);
      return '<div class="d" data-i="' + i + '"><b>' + esc(where) + '</b>' + esc(x.msg) + '</div>';
    }).join('') + (res.error ? '<pre>' + esc(res.error) + '</pre>' : '');
    d.classList.add('on');
    list.forEach(function(x){ if (x.here) editor.mark(x.from, x.to); });
    d.onclick = function(e){ var el = e.target.closest('.d'); if (el && list[+el.dataset.i].here) editor.jump(list[+el.dataset.i].from); };
    return;
  }
  d.classList.remove('on'); d.innerHTML = '';
  var go = res.go || {}, rust = res.rust || {};
  var failed = [go.ok ? null : 'Go', rust.ok ? null : 'Rust'].filter(Boolean);
  setStatus('OK — ' + res.grids + ' proc grid' + (res.grids === 1 ? '' : 's') +
    (failed.length ? ' · ' + failed.join(', ') + ' codegen failed' : ''), failed.length ? 'bad' : 'ok');
  lastDoc = res; pushDoc();
  showCode('goPane', 'go', go);
  showCode('rustPane', 'rust', rust);
  showImpls(go, rust);
}

/* Each backend output has two artifacts, types and code; files are listed as
   <artifact dir>/<file> under a heading per artifact. */
function showCode(paneId, lang, out){
  var pane = $(paneId), files = pane.querySelector('.files'), code = pane.querySelector('.code');
  code.className = 'code';
  if (!out.ok){ files.innerHTML = ''; code.textContent = lang + ' codegen error:\n' + out.error; return; }
  var all = {};
  var html = out.artifacts.map(function(a){
    var names = Object.keys(a.files).map(function(f){
      var path = a.dir ? a.dir + '/' + f : f;
      all[path] = a.files[f];
      return path;
    });
    return '<span class="kind">' + esc(a.kind) + '</span>' + names.map(function(n){
      return '<button data-f="' + esc(n) + '">' + esc(n) + '</button>';
    }).join('');
  }).join('');
  var key = 'vandorf.wb.file.' + lang, cur = store(key);
  if (!(cur in all)) cur = Object.keys(all).filter(function(n){ return !/types/.test(n); })[0] || Object.keys(all)[0];
  files.innerHTML = html;
  function select(n){
    cur = n; store(key, n);
    Array.prototype.forEach.call(files.querySelectorAll('button'), function(b){ b.classList.toggle('on', b.dataset.f === n); });
    code.textContent = all[n];
  }
  files.onclick = function(e){ var b = e.target.closest('button'); if (b) select(b.dataset.f); };
  select(cur);
}

function showImpls(go, rust){
  var p = $('implPane');
  function section(title, out, stubRe, note){
    if (!out.ok) return '<h3>' + title + '</h3><div class="empty">' + esc(out.error) + '</div>';
    var src = '', s, stubbed = [];
    out.artifacts.forEach(function(a){ Object.keys(a.files).forEach(function(f){ src += a.files[f]; }); });
    while ((s = stubRe.exec(src))) stubbed.push(s[1]);
    var rows = (out.impls || []).map(function(i){
      return '<tr><td>' + esc(i.node) + '</td><td><code>' + esc(i.file + ':' + i.function) + '</code></td><td><code>' + esc(i.signature) + '</code></td></tr>';
    }).join('');
    return '<h3>' + title + '</h3><p style="margin:0 0 8px;color:var(--mut);font-size:13px">' + note + '</p>' +
      '<table><thead><tr><th>Node</th><th>Implementation</th><th>Required signature</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="3" class="empty">No funcs name an implementation for this backend.</td></tr>') + '</tbody></table>' +
      (stubbed.length ? '<p style="color:var(--mut);font-size:13px;margin-top:10px">Stubbed (no implementation): <code>' + stubbed.map(esc).join(', ') + '</code></p>' : '');
  }
  p.innerHTML =
    section('Go', go, /^func (unimplemented\w+)/gm,
      'Paths are relative to the code package. Preview assumes package <code>app</code> at <code>example.com/app</code>, types at <code>example.com/app/types</code>; <code>vcc build</code> resolves the real paths from go.mod.') +
    section('Rust', rust, /^fn (unimplemented_\w+)/gm,
      'Paths are relative to the generated module. Preview assumes it is <code>src/app</code> (<code>crate::app</code>); <code>vcc build</code> resolves it from Cargo.toml.');
}

$('compile').addEventListener('click', compile);
var timer = null;
editor.onChange(function(){
  store('vandorf.wb.src', editor.get());
  if (!$('auto').checked) return;
  clearTimeout(timer); timer = setTimeout(compile, 400);
});
$('auto').checked = store('vandorf.wb.auto') !== '0';
$('auto').addEventListener('change', function(){ store('vandorf.wb.auto', this.checked ? '1' : '0'); });

/* ---------- files ---------- */
function load(path){
  fetch('/api/source?path=' + encodeURIComponent(path)).then(function(r){ return r.json(); }).then(function(res){
    if (!res.ok){ setStatus(res.error, 'bad'); return; }
    editor.set(res.source); store('vandorf.wb.file', path); compile();
  });
}
$('file').addEventListener('change', function(){ if (this.value) load(this.value); });

fetch('/api/sources').then(function(r){ return r.json(); }).then(function(res){
  (res.files || []).forEach(function(f){
    var o = document.createElement('option'); o.value = o.textContent = f; $('file').appendChild(o);
  });
  var savedSrc = store('vandorf.wb.src'), savedFile = store('vandorf.wb.file');
  if (savedFile && res.files.indexOf(savedFile) >= 0) $('file').value = savedFile;
  if (savedSrc){ editor.set(savedSrc); compile(); return; }
  var first = res.files.indexOf('examples/demo/demo.sys') >= 0 ? 'examples/demo/demo.sys' : res.files[0];
  if (first){ $('file').value = first; load(first); }
}).catch(function(){ setStatus('could not list sources', 'bad'); });
})();
</script>
</body>
</html>
