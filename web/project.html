<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="/ui.css">
<style>
body{ display:flex; flex-direction:column }
.crumb{ color:var(--mut); overflow:hidden; text-overflow:ellipsis; font-size:12px; padding:0 4px; min-width:0 }
#main{ flex:1; overflow:auto; min-height:0 }
#overview, #manifest{ display:none } #overview.on, #manifest.on{ display:block }
.wrap{ max-width:980px; margin:0 auto; padding:20px 20px 40px }
.msg{ padding:20px; color:var(--mut) } .msg.bad{ color:var(--err) }

.head{ display:flex; align-items:center; gap:10px; margin-bottom:6px }
.head .badge{ transform:scale(1.4); margin:0 4px }
.head h1{ font-size:20px; margin:0; font-weight:700 }
.head .dir{ color:var(--mut); font-size:12.5px }
.stats{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px }
.stat{ border:1px solid var(--line); border-radius:0; padding:2px 8px; font-size:12px; color:var(--mut); background:var(--bar) }
.stat b{ color:var(--ink); font-weight:600 }
.warn{ color:var(--err); font-size:12.5px; margin-top:8px }

h2{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin:26px 0 8px;
  display:flex; align-items:center; gap:8px }
h2::after{ content:""; flex:1; height:1px; background:var(--line) }
h3{ font-size:13px; margin:0; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:10px }
.card{ border:1px solid var(--line); border-radius:0; background:var(--bg); padding:10px 12px }
.card.wide{ grid-column:1 / -1 }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin-top:8px; font-size:12.5px }
.kv .k{ color:var(--mut) }
.kv code, code{ font:12px/1.5 var(--mono) }
.dflt{ color:var(--mut); font-style:italic; font-family:inherit }
.tag{ font-size:11px; color:var(--mut); border:1px solid var(--line); border-radius:0; padding:0 5px; font-weight:500 }

/* An entry point: badge, proc name, where it's declared. */
.eref{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; color:var(--ink); text-decoration:none; font-weight:600 }
.eref:hover .nm{ text-decoration:underline; color:var(--accent) }
.eref.missing{ color:var(--err); cursor:default }
.loc{ font-size:11.5px; color:var(--accent); cursor:pointer; font-weight:400 }
.edoc{ font-size:12px; color:var(--mut); font-weight:400; margin-top:2px }
.loc:hover{ text-decoration:underline }

table{ border-collapse:collapse; width:100%; margin-top:8px; font-size:12.5px }
td{ padding:5px 8px; border-top:1px solid var(--line); vertical-align:middle }
tr:hover td{ background:var(--hover) }
td.m{ width:1%; white-space:nowrap }
td.p{ font:12px/1.5 var(--mono); word-break:break-all }
td.a{ width:1%; color:var(--mut) }
.method{ display:inline-block; min-width:44px; text-align:center; font:700 10px/16px var(--mono); border-radius:0; color:#fff; background:var(--b-file) }
.method.GET{ background:#0e7490 } .method.POST{ background:#1d6fd8 } .method.PUT, .method.PATCH{ background:#a16207 } .method.DELETE{ background:#c62828 }
.files{ columns:2 260px; column-gap:20px; font-size:12.5px; margin-top:4px }
.files div{ break-inside:avoid; padding:1px 0 }
.files a{ cursor:pointer; color:var(--ink) } .files a:hover{ color:var(--accent); text-decoration:underline }

/* manifest */
/* manifest: an editor that saves as you type (valid manifests only) */
#manifest{ height:100% } #manifest.on{ display:flex; flex-direction:column }
#medit{ flex:1; min-height:0; width:100%; box-sizing:border-box; margin:0; border:0; outline:0; resize:none; padding:14px 18px;
  font:13px/1.6 var(--mono); background:var(--code-bg); color:var(--ink); tab-size:4 }
#manifest .CodeMirror{ flex:1; min-height:0; height:auto; font:13px/1.6 var(--mono); background:var(--code-bg); color:var(--ink) }
.CodeMirror-gutters{ background:var(--bar); border-right:1px solid var(--line) }
.CodeMirror-linenumber{ color:var(--mut) }
.CodeMirror-cursor{ border-left-color:var(--ink) }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected{ background:rgba(59,130,246,.22) }
/* Over CodeMirror's default theme: keys, [sections], strings as the IDE colors them. */
.CodeMirror .cm-comment{ color:var(--com); font-style:italic } .CodeMirror .cm-atom{ color:var(--kw); font-weight:600 }
.CodeMirror .cm-property{ color:var(--fn) } .CodeMirror .cm-string, .CodeMirror .cm-number{ color:var(--str) }
.CodeMirror .cm-property.cm-string{ color:var(--fn) } .CodeMirror .cm-bracket{ color:var(--mut) }
.mtool{ display:none } body.manifest .mtool{ display:inline-flex }
.mstat{ font-size:12px; color:var(--mut); padding:0 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0 }
.mstat.bad{ color:var(--err) } .mstat.ok{ color:var(--ok, var(--mut)) }
</style>
</head>
<body>
<div class="bar">
  <div class="seg"><button id="mOverview" class="on">Overview</button><button id="mManifest">Manifest</button></div>
  <span class="crumb" id="crumb"></span>
  <span class="sp"></span>
  <span class="mtool mstat" id="mStat"></span>
  <button class="icon" id="bRefresh" title="Reload"><svg viewBox="0 0 16 16"><path d="M13.2 8A5.2 5.2 0 1 1 11.7 4.3M13.2 2.3v3.4H9.8"/></svg></button>
</div>
<div id="main">
  <section id="overview" class="on"><div class="msg">Loading&hellip;</div></section>
  <section id="manifest"><textarea id="medit" spellcheck="false" autocomplete="off"></textarea></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/toml/toml.min.js"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
var host = new URLSearchParams(location.search).has('popout') ? window.parent.opener || window.parent : window.parent;
function up(m){ if (host !== window) host.postMessage(m, location.origin); }
function focusTab(){ up({ type: 'ide-focus' }); }
window.addEventListener('focus', focusTab);
document.addEventListener('pointerdown', focusTab, true);
var TOKEN = '__VANDORF_TOKEN__';
var dir = new URLSearchParams(location.search).get('dir') || '';
var P = null;

function setMode(m){
  $('mOverview').classList.toggle('on', m === 'overview'); $('mManifest').classList.toggle('on', m === 'manifest');
  $('overview').classList.toggle('on', m === 'overview'); $('manifest').classList.toggle('on', m === 'manifest');
  document.body.classList.toggle('manifest', m === 'manifest');
  if (m === 'manifest' && cm) setTimeout(function(){ cm.refresh(); }, 0);
}

/* The manifest, edited in place and saved on Ctrl/⌘+S, like .sys files.
   The server refuses text that isn't a valid manifest; it stays here,
   marked unsaved, until it is. */
var cm = null, quiet = false, saved = null, saving = false, again = false;
if (window.CodeMirror){
  cm = CodeMirror.fromTextArea($('medit'), {
    mode: 'toml', lineNumbers: true, indentWithTabs: true, tabSize: 4, indentUnit: 4,
    extraKeys: { 'Ctrl-S': save, 'Cmd-S': save },
  });
}
var editor = {
  get: function(){ return cm ? cm.getValue() : $('medit').value; },
  set: function(s){
    quiet = true;
    if (cm){ var c = cm.getCursor(), sc = cm.getScrollInfo(); cm.setValue(s); cm.setCursor(c); cm.scrollTo(sc.left, sc.top); cm.clearHistory(); }
    else $('medit').value = s;
    quiet = false;
  },
};
function mstat(text, cls){ var s = $('mStat'); s.textContent = text || ''; s.title = text || ''; s.className = 'mtool mstat' + (cls ? ' ' + cls : ''); }
function dirty(){ return saved != null && editor.get() !== saved; }
/* The manifest as it is on disk; the editor follows it unless it has
   changes of its own. */
function showManifest(text){
  if (!dirty()){ saved = text; if (editor.get() !== text) editor.set(text); }
  else saved = text;
}
function changed(){
  if (quiet) return;
  var d = dirty();
  mstat(d ? 'Unsaved changes (Ctrl/⌘+S to save)' : 'Saved', d ? '' : 'ok');
}
if (cm) cm.on('change', changed); else $('medit').addEventListener('input', changed);
$('medit').addEventListener('keydown', function(e){
  if (e.key === 'Tab' && !e.shiftKey){ e.preventDefault(); document.execCommand('insertText', false, '\t'); }
});
document.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); save(); }
});
window.addEventListener('beforeunload', function(e){ if (dirty()){ e.preventDefault(); e.returnValue = ''; } });
function save(){
  if (!P || !dirty()) return;
  if (saving){ again = true; return; }
  var text = editor.get();
  saving = true; mstat('Saving…');
  fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vandorf-Token': TOKEN },
    body: JSON.stringify({ path: P.manifest, source: text }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok){ if (editor.get() === text) mstat(res.error, 'bad'); return; }
      saved = text; P.text = text;
      if (!dirty()) mstat('Saved', 'ok');
      up({ type: 'ide-saved', path: P.manifest, text: text });
      load();
    })
    .catch(function(e){ mstat('Not saved: ' + e, 'bad'); })
    .then(function(){ saving = false; if (again){ again = false; save(); } });
}
$('mOverview').onclick = function(){ setMode('overview'); };
$('mManifest').onclick = function(){ setMode('manifest'); };
$('bRefresh').onclick = function(){
  if (dirty() && !confirm('Discard the unsaved changes to the manifest?')) return;
  if (dirty()){ editor.set(saved); mstat(''); }
  load();
};

function load(){
  fetch('/api/project?dir=' + encodeURIComponent(dir)).then(function(r){ return r.json(); }).then(function(p){
    if (!p.ok){ broken(p.error); return; }
    P = p; render();
    up({ type: 'ide-status', text: 'Project ' + p.name, cls: '' });
  }).catch(function(e){ $('overview').innerHTML = '<div class="msg bad">Cannot load the project: ' + esc(e) + '</div>'; });
}

/* A project that doesn't load (say, its sources don't exist): the error,
   and its manifest as text, still editable to fix it. */
function broken(error){
  $('overview').innerHTML = '<div class="msg bad">' + esc(error) + '</div>';
  up({ type: 'ide-status', text: error, cls: 'bad' });
  var path = (dir && dir !== '.' ? dir + '/' : '') + 'vandorf.toml';
  fetch('/api/source?path=' + encodeURIComponent(path)).then(function(r){ return r.json(); }).then(function(r){
    if (!r.ok){ P = null; return; }
    P = { manifest: path, text: r.source };
    $('crumb').textContent = path; showManifest(r.source);
    $('overview').innerHTML = '<div class="msg bad">' + esc(error) + '<br><br>Fix it in the <a href="#" id="toManifest">manifest</a>.</div>';
    $('toManifest').onclick = function(e){ e.preventDefault(); setMode('manifest'); };
  });
}

function val(v, dflt){ return v != null && v !== '' ? '<code>' + esc(v) + '</code>' : '<span class="dflt">' + esc(dflt) + '</span>'; }
function procRef(name, at){
  if (!at) return '<span class="eref missing" title="No top-level proc ' + esc(name) + ' in the project"><span class="badge proc entry">P</span><span class="nm">' + esc(name) + '</span> <span class="tag">missing</span></span>';
  return '<a class="eref" data-proc="' + esc(name) + '" data-path="' + esc(at.path) + '" title="' + esc((at.doc ? at.doc + '\n\n' : '') + 'Open the diagram (Ctrl/⌘+click: new tab)') + '">' +
    '<span class="badge proc entry">P</span><span class="nm">' + esc(name) + '</span></a>' +
    ' <span class="loc" data-path="' + esc(at.path) + '" data-line="' + at.line + '">' + esc(at.path.split('/').pop() + ':' + (at.line + 1)) + '</span>' +
    (at.doc ? '<div class="edoc">' + esc(at.doc.split('\n')[0]) + '</div>' : '');
}

function render(){
  var p = P, h = [];
  $('crumb').textContent = p.manifest;
  showManifest(p.text);
  h.push('<div class="wrap">');
  h.push('<div class="head"><span class="badge project"></span><h1>' + esc(p.name) + '</h1><span class="dir">' + esc(p.dir || '.') + '/</span></div>');
  var c = p.counts;
  h.push('<div class="stats">' + [['files', c.files], ['procs', c.procs], ['funcs', c.funcs], ['types', c.types],
    ['bins', p.bins.length], ['servers', p.servers.length]].map(function(x){
      return '<span class="stat"><b>' + x[1] + '</b> ' + x[0] + '</span>'; }).join('') + '</div>');
  if (p.unparsed.length) h.push('<div class="warn">Not parsed (syntax errors): ' + p.unparsed.map(esc).join(', ') + '</div>');

  // Entry points.
  h.push('<h2>Entry points</h2>');
  if (!p.bins.length && !p.servers.length) h.push('<p class="dflt">No [bin.*] or [http.*] sections: nothing runs this project directly.</p>');
  if (p.bins.length){
    h.push('<div class="cards">');
    p.bins.forEach(function(b){
      h.push('<div class="card"><h3><span class="tag">bin</span>' + esc(b.name) + '</h3>' +
        '<div class="kv"><span class="k">runs</span><span>' + procRef(b.entry, b.at) + '</span>' +
        (b.go ? '<span class="k">Go</span><span><code>' + esc(b.go) + '</code></span>' : '') +
        (b.rust ? '<span class="k">Rust</span><span><code>src/' + esc(b.rust) + '</code></span>' : '') +
        (!b.go && !b.rust ? '<span class="k">built</span><span class="dflt">no backend configured</span>' : '') +
        '</div></div>');
    });
    h.push('</div>');
  }
  p.servers.forEach(function(s){
    h.push('<div class="card wide" style="margin-top:10px"><h3><span class="tag">http</span>' + esc(s.name) +
      ' <code style="font-weight:400;color:var(--mut)">' + esc(s.addr) + '</code></h3>' +
      '<div class="kv">' +
      // How the command line starts it: the executable serves, on --addr
      // if given; with a cli, a command (not a flag) runs that proc instead.
      '<span class="k">command</span><span><code title="Serves on ' + esc(s.addr) + ' unless given --addr">' +
        esc(s.exe) + ' [--addr host:port]</code></span>' +
      (s.cli ? '<span class="k">commands</span><span><code title="A first argument that is a command, -h or --help runs the proc instead of serving">' +
        esc(s.exe) + ' &lt;command&gt; [args&hellip;]</code> &rarr; ' + procRef(s.cli, s.cli_at) + '</span>' : '') +
      (s.go ? '<span class="k">Go</span><span><code>' + esc(s.go) + '</code></span>' : '') +
      (s.rust ? '<span class="k">Rust</span><span><code>src/' + esc(s.rust) + '</code></span>' : '') +
      (!s.go && !s.rust ? '<span class="k">built</span><span class="dflt">no backend configured</span>' : '') +
      '</div>');
    var rows = s.routes.map(function(r){
      return '<tr><td class="m"><span class="method ' + esc(r.method) + '">' + esc(r.method || '*') + '</span></td>' +
        '<td class="p">' + esc(r.path) + '</td><td class="a">→</td><td>' + procRef(r.proc, r.at) +
        (r.raw ? ' <span class="tag" title="The proc takes the request and returns the response">raw</span>'
               : ' <span class="tag" title="Parameters and result as JSON">json</span>') + '</td></tr>';
    }).concat(s.statics.map(function(f){
      return '<tr><td class="m"><span class="method GET">GET</span></td><td class="p">' + esc(f.path) + '</td><td class="a">→</td>' +
        '<td><code>' + esc(f.file) + '</code> <span class="tag" title="Served as it is, embedded in the executable">static</span></td></tr>';
    }));
    if (rows.length) h.push('<table>' + rows.join('') + '</table>');
    h.push('</div>');
  });

  // Build settings.
  h.push('<h2>Backends</h2><div class="cards">');
  h.push('<div class="card"><h3>Go</h3>' + (p.go
    ? '<div class="kv"><span class="k">out</span><span>' + val(p.go.out) + '</span>' +
      '<span class="k">package</span><span>' + val(p.go.package, p.go.out.split('/').pop() + ' (from out)') + '</span>' +
      '<span class="k">module</span><span>' + val(p.go.module, 'from go.mod') + '</span>' +
      '<span class="k">types</span><span>' + val(p.go.types_dir, 'types') + '</span></div>'
    : '<div class="kv"><span class="dflt">not configured</span></div>') + '</div>');
  h.push('<div class="card"><h3>Rust</h3>' + (p.rust
    ? '<div class="kv"><span class="k">out</span><span>' + val(p.rust.out) + '</span>' +
      '<span class="k">module</span><span>' + val(p.rust.module_dir, 'from Cargo.toml') + '</span></div>'
    : '<div class="kv"><span class="dflt">not configured</span></div>') + '</div>');
  h.push('</div>');

  // Sources.
  h.push('<h2>Sources</h2><div class="kv" style="margin-top:0"><span class="k">directories</span><span>' +
    p.sources.map(function(s){ return '<code>' + esc(s) + '</code>'; }).join(', ') + '</span></div>');
  h.push('<div class="files">' + p.files.map(function(f){
    var short = p.dir && f.indexOf(p.dir + '/') === 0 ? f.slice(p.dir.length + 1) : f;
    return '<div><a data-file="' + esc(f) + '">' + esc(short) + '</a></div>';
  }).join('') + '</div>');
  h.push('</div>');
  $('overview').innerHTML = h.join('');
}

$('overview').addEventListener('click', function(e){
  var a = e.target.closest('a.eref');
  if (a){ up({ type: 'ide-open', path: a.dataset.path, proc: a.dataset.proc, mode: 'diagram', newTab: e.ctrlKey || e.metaKey }); return; }
  var l = e.target.closest('.loc');
  if (l){ up({ type: 'ide-open', path: l.dataset.path, line: +l.dataset.line, mode: 'text', newTab: e.ctrlKey || e.metaKey }); return; }
  var f = e.target.closest('a[data-file]');
  if (f) up({ type: 'ide-open', path: f.dataset.file, mode: 'text', newTab: e.ctrlKey || e.metaKey });
});

window.addEventListener('message', function(e){
  if (e.origin !== location.origin || e.source !== host || !e.data) return;
  var m = e.data;
  if (m.type === 'vandorf-theme') document.documentElement.setAttribute('data-theme', m.theme);
  if (m.type === 'ide-activate' && P && P.name) up({ type: 'ide-status', text: 'Project ' + P.name, cls: '' });
  if (m.type === 'ide-refresh') load();
});
up({ type: 'project-ready' });
load();
})();
</script>
</body>
</html>
