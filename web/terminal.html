<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<link rel="stylesheet" href="/ui.css">
<style>
body{ font-size:12px; display:flex; flex-direction:column }
.bar{ gap:2px; overflow-x:auto }
.bar .tt{ display:inline-flex; align-items:center; gap:2px; height:var(--h); padding:0 2px 0 8px; border-radius:var(--r); cursor:pointer; flex:none }
.bar .tt:hover{ background:var(--hover) }
.bar .tt.on{ background:none; box-shadow:inset 0 -2px var(--accent) }
.bar .tt.dead .l{ text-decoration:line-through }
.bar .tt .x{ width:18px; height:18px; padding:0; font-size:14px; color:var(--mut) }
.bar .tt .x:hover{ background:var(--line); color:var(--ink) }
#terms{ flex:1; position:relative; min-height:0 }
.panes{ position:absolute; inset:0; display:flex; visibility:hidden }
.panes.on{ visibility:visible }
.term{ flex:1 1 0; min-width:0; overflow:hidden; padding:4px 0 0 8px }
.term + .term{ border-left:1px solid var(--line) }
.tt .l{ max-width:22ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.tt .l:hover{ background:transparent }
#menu{ position:fixed; z-index:2; padding:4px; background:var(--bg); border:1px solid var(--line); border-radius:var(--r) }
#menu button{ display:block; width:100%; text-align:left }
#rename{ color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:var(--r) }
#notice{ position:absolute; z-index:1; bottom:0; right:0; background:var(--bg) }
.msg{ padding:14px; color:var(--mut) } .msg.bad{ color:var(--err) }
.xterm .xterm-viewport{ scrollbar-width:thin }
</style>
</head>
<body>
<div class="bar">
  <span class="ttl">Terminal</span>
  <span id="list" style="display:flex;gap:2px;flex:none"></span>
  <button class="icon" id="bNew" title="New terminal" disabled><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
  <span class="sp"></span>
  <button class="icon" data-cmd="check" title="vcc check, in the active file's project"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></button>
  <button class="icon" data-cmd="build" title="vcc build, in the active file's project"><svg viewBox="0 0 16 16"><path d="M8.6 2.4l1.4-.6 4.2 4.2-.6 1.4-1.8 1.8-5-5zM8.4 7.6l-5.6 5.6"/></svg></button>
  <button class="icon" data-cmd="test" title="vcc test, in the active file's project"><svg viewBox="0 0 16 16"><path d="M6 2.5h4M6.8 2.5v4L3 13a.8.8 0 0 0 .7 1.2h8.6A.8.8 0 0 0 13 13L9.2 6.5v-4M4.6 10.2h6.8"/></svg></button>
</div>
<div id="terms"><div id="notice" class="msg bad" role="status" hidden></div></div>
<div id="menu" hidden>
  <button type="button" data-action="rename">Rename</button>
  <button type="button" data-action="close">Close</button>
  <button type="button" data-action="others">Close Others</button>
  <button type="button" data-action="kill">Kill</button>
  <button type="button" data-action="split">Split</button>
</div>
<dialog id="rename">
  <form method="dialog">
    <label>Terminal name <input id="name" maxlength="80" autocomplete="off"></label>
    <button value="save">Save</button>
    <button value="cancel" formnovalidate>Cancel</button>
  </form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
(function(){
'use strict';
var TOKEN = '__VANDORF_TOKEN__';
var $ = function(id){ return document.getElementById(id); };
function post(m){ if (window.parent !== window) window.parent.postMessage(m, location.origin); }
function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Vandorf-Token': TOKEN }, opts.headers || {});
  return fetch(path, opts);
}
var ctx = { dir: '', file: null, project: false };
var terms = [], cur = null;
var instance = '';
var stateKey = 'vandorf.term.tabs';
var menuTerm = null, renameTerm = null, dragged = null;
var dark = false;

function palette(){
  return dark
    ? { background: '#0b111c', foreground: '#dbe6f4', cursor: '#dbe6f4', selectionBackground: 'rgba(59,130,246,.35)' }
    : { background: '#ffffff', foreground: '#0f172a', cursor: '#0f172a', selectionBackground: 'rgba(31,111,235,.25)',
        // Light-friendly ANSI colors: the defaults are tuned for dark backgrounds.
        black: '#0f172a', red: '#c62828', green: '#1b7f3b', yellow: '#a16207', blue: '#1d4ed8', magenta: '#a21caf', cyan: '#0e7490', white: '#64748b',
        brightBlack: '#475569', brightRed: '#dc2626', brightGreen: '#16a34a', brightYellow: '#ca8a04', brightBlue: '#2563eb', brightMagenta: '#c026d3', brightCyan: '#0891b2', brightWhite: '#334155' };
}
function setTheme(t){
  dark = t === 'dark';
  document.documentElement.setAttribute('data-theme', t);
  terms.forEach(function(x){ if (x.xt) x.xt.options.theme = palette(); });
}

function saveTabs(){
  if (!instance) return;
  try {
    sessionStorage.setItem(stateKey, JSON.stringify({
      instance: instance, active: cur && cur.id,
      tabs: terms.map(function(t){ return { id: t.id, name: t.name, group: t.group }; })
    }));
  } catch (e) {}
}
function loadTabs(){
  try {
    var state = JSON.parse(sessionStorage.getItem(stateKey));
    if (state && instance && state.instance === instance && Array.isArray(state.tabs)) return state;
  } catch (e) {}
  return null;
}
function label(t){
  var cwd = t.oscCwd || t.cwd;
  var base = cwd.replace(/[\\/]+$/, '').split(/[\\/]/).pop();
  var name = t.name || base || cwd || 'shell ' + t.id;
  t.tab.querySelector('.l').textContent = name;
  t.tab.title = name + (cwd && cwd !== name ? '\n' + cwd : '') + (t.alive ? '' : '\n' + (t.ended || 'Process exited'));
}
function attach(id, saved, panes){
  var t = { id: id, from: 0, alive: true, name: saved.name || '', group: saved.group || id, cwd: '' };
  t.panes = panes || document.createElement('div');
  if (!panes){
    t.panes.className = 'panes';
    $('terms').appendChild(t.panes);
  }
  t.el = document.createElement('div');
  t.el.className = 'term';
  t.panes.appendChild(t.el);
  t.tab = document.createElement('span');
  t.tab.className = 'tt';
  t.tab.draggable = true;
  t.tab.innerHTML = '<button type="button" class="l"></button><button type="button" class="x" aria-label="Close terminal" title="Close terminal">&times;</button>';
  var select = t.tab.querySelector('.l');
  label(t);
  t.tab.onclick = function(e){ if (e.target.closest('.x')) stop(t, false); else show(t); };
  select.ondblclick = function(){ rename(t); };
  select.onkeydown = function(e){
    if (e.key === 'F2'){ e.preventDefault(); rename(t); }
    if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')){
      e.preventDefault();
      var rect = select.getBoundingClientRect();
      openMenu(t, rect.left, rect.bottom);
    }
  };
  t.tab.oncontextmenu = function(e){ e.preventDefault(); openMenu(t, e.clientX, e.clientY); };
  t.tab.ondragstart = function(e){
    dragged = t;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(t.id));
  };
  t.tab.ondragend = function(){ dragged = null; };
  t.tab.ondragover = function(e){
    if (dragged && dragged !== t){ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
  };
  t.tab.ondrop = function(e){
    if (!dragged || dragged === t) return;
    e.preventDefault();
    var rect = t.tab.getBoundingClientRect();
    var after = e.clientX >= rect.left + rect.width / 2;
    var moved = dragged;
    dragged = null;
    terms.splice(terms.indexOf(moved), 1);
    terms.splice(terms.indexOf(t) + Number(after), 0, moved);
    $('list').insertBefore(moved.tab, after ? t.tab.nextSibling : t.tab);
    var sibling = terms.slice(terms.indexOf(moved) + 1).find(function(x){ return x.panes === moved.panes; });
    moved.panes.insertBefore(moved.el, sibling ? sibling.el : null);
    saveTabs();
  };
  $('list').appendChild(t.tab);
  terms.push(t);
  if (!window.Terminal){
    t.el.innerHTML = '<div class="msg bad">xterm.js did not load (offline?). The terminal needs cdn.jsdelivr.net.</div>';
    return t;
  }
  t.xt = new Terminal({ fontFamily: 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace', fontSize: 12.5, cursorBlink: true,
                        scrollback: 5000, theme: palette(), allowProposedApi: false });
  if (window.FitAddon){ t.fit = new FitAddon.FitAddon(); t.xt.loadAddon(t.fit); }
  t.xt.open(t.el);
  t.el.addEventListener('focusin', function(){ if (cur !== t) show(t, false); });
  t.xt.parser.registerOscHandler(7, function(data){
    try {
      var url = new URL(data);
      if (url.protocol === 'file:'){
        t.oscCwd = decodeURIComponent(url.pathname);
        label(t);
      }
    } catch (e) {}
    return true;
  });
  t.xt.onData(function(d){ send(t, d); });
  t.xt.onBinary(function(d){ send(t, d); });
  t.xt.onResize(function(s){ if (t.alive) api('/api/term/resize?id=' + t.id + '&cols=' + s.cols + '&rows=' + s.rows, { method: 'POST' }); });
  pump(t);
  return t;
}
/* Keystrokes go out in order, one request at a time; whatever piles up
   meanwhile is sent together. */
function send(t, d){
  if (!t.alive) return;
  t.pending = (t.pending || '') + d;
  if (t.sending) return;
  t.sending = true;
  (function flush(){
    var body = t.pending; t.pending = '';
    api('/api/term/input?id=' + t.id, { method: 'POST', body: body })
      .catch(function(){})
      .then(function(){ if (t.pending) flush(); else t.sending = false; });
  })();
}
/* Long polling: each read waits on the server until there's output. */
function pump(t){
  if (!t.alive) return;
  api('/api/term/read?id=' + t.id + '&from=' + t.from).then(function(r){
    if (!r.ok) throw new Error('gone');
    var next = +r.headers.get('X-Next'), closed = r.headers.get('X-Closed') === '1';
    return r.arrayBuffer().then(function(b){
      if (!t.alive) return;
      var cwd = decodeURIComponent(r.headers.get('X-Term-Cwd') || '');
      if (cwd && cwd !== t.cwd){
        if (t.cwd) t.oscCwd = '';
        t.cwd = cwd;
        label(t);
      }
      if (b.byteLength) t.xt.write(new Uint8Array(b));
      t.from = next;
      if (closed && !b.byteLength){ dead(t, 'process exited'); return; }
      pump(t);
    });
  }).catch(function(){
    if (!t.alive) return;
    // The server restarted or the shell is gone.
    api('/api/term/list').then(function(r){ return r.json(); }).then(function(l){
      if (l.ids && l.ids.indexOf(t.id) >= 0) setTimeout(function(){ pump(t); }, 500);
      else dead(t, 'disconnected');
    }).catch(function(){ setTimeout(function(){ pump(t); }, 2000); });
  });
}
function dead(t, why){
  t.alive = false; t.ended = why; t.tab.classList.add('dead');
  label(t);
  if (t.xt) t.xt.write('\r\n\x1b[2m[' + why + ']\x1b[0m\r\n');
}
function show(t, focus){
  cur = t || null;
  terms.forEach(function(x){
    x.panes.classList.toggle('on', !!t && x.panes === t.panes);
    x.tab.classList.toggle('on', x === t);
    if (x === t) x.tab.querySelector('.l').setAttribute('aria-current', 'true');
    else x.tab.querySelector('.l').removeAttribute('aria-current');
  });
  saveTabs();
  fit();
  if (focus !== false && t && t.xt) t.xt.focus();
}
function fit(){
  if (!cur) return;
  terms.forEach(function(t){
    if (t.panes === cur.panes && t.fit && t.el.offsetWidth){
      try { t.fit.fit(); } catch (e) {}
    }
  });
}
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe($('terms'));

function splitDir(t){
  var cwd = t.oscCwd || t.cwd;
  var prefix = root.replace(/[\\/]$/, '') + '/';
  var path = cwd.replace(/\\/g, '/');
  prefix = prefix.replace(/\\/g, '/');
  if (cwd && cwd === root) return '';
  return root && path.startsWith(prefix) ? path.slice(prefix.length) : ctx.dir;
}
function create(split){
  if (split && split.splitting) return Promise.resolve(null);
  if (split) split.splitting = true;
  fail('');
  var dir = split ? splitDir(split) : ctx.dir;
  return api('/api/term?cwd=' + encodeURIComponent(dir || ''), { method: 'POST' }).then(function(r){ return r.json(); }).then(function(res){
    if (!res.ok){ fail(res.error); return null; }
    var sibling = split && terms.find(function(t){ return t.panes === split.panes; });
    var t = attach(res.id, { group: sibling && sibling.group }, sibling && sibling.panes);
    if (sibling){
      var last = terms.findLast(function(x){ return x !== t && x.panes === sibling.panes; });
      terms.pop();
      terms.splice(terms.indexOf(last) + 1, 0, t);
      $('list').insertBefore(t.tab, last.tab.nextSibling);
    }
    show(t);
    return t;
  }).catch(function(e){ fail(String(e)); return null; }).finally(function(){
    if (split) split.splitting = false;
  });
}
function fail(msg){
  $('notice').textContent = msg;
  $('notice').hidden = !msg;
}
function run(cmd){
  var go = function(t){ if (t && t.alive){ show(t); send(t, cmd + '\r'); } };
  if (cur && cur.alive) go(cur); else create().then(go);
}
/* `vcc <sub> -C <dir>`: the active file's directory (its project is
   found from there), absolute, so it works wherever the shell has cd'd to. */
var root = '';
api('/api/sources').then(function(r){ return r.json(); }).then(function(r){ if (r.ok) root = r.root; }).catch(function(){});
function sh(s){ return /^[\w.\/-]+$/.test(s) ? s : "'" + s.replace(/'/g, "'\\''") + "'"; }
/* The compiler the IDE's settings pick: vcc, or a path to one. */
var compiler = 'vcc';
function tool(){ return /^~\//.test(compiler) ? '~/' + sh(compiler.slice(2)) : sh(compiler); }
function vandorf(sub){
  var dir = (ctx.dir || '').replace(/\/$/, '');
  if (dir === '.') dir = '';
  var at = root ? root + (dir ? '/' + dir : '') : (dir || '.');
  return tool() + ' ' + sub + ' -C ' + sh(at);
}

$('bNew').onclick = function(){ create(); };
function stop(t, keep){
  if (t.stopping || (keep && !t.alive)) return;
  t.stopping = true;
  fail('');
  api('/api/term/kill?id=' + t.id + (keep ? '&keep=1' : ''), { method: 'POST' })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok && (keep || res.error !== 'no such terminal')) throw new Error(res.error);
      if (keep) return;
      var index = terms.indexOf(t);
      terms.splice(index, 1);
      t.alive = false;
      if (t.xt) t.xt.dispose();
      t.el.remove(); t.tab.remove();
      if (!t.panes.childElementCount) t.panes.remove();
      var sibling = terms.find(function(x){ return x.panes === t.panes; });
      show(cur === t ? sibling || terms[index] || terms[index - 1] : cur, cur === t);
    })
    .catch(function(e){ fail(String(e)); })
    .finally(function(){ t.stopping = false; });
}
function rename(t){
  renameTerm = t;
  $('name').value = t.name;
  $('rename').returnValue = '';
  $('rename').showModal();
  $('name').select();
}
$('rename').addEventListener('close', function(){
  if ($('rename').returnValue === 'save' && terms.includes(renameTerm)){
    renameTerm.name = $('name').value.trim();
    label(renameTerm);
    saveTabs();
  }
  renameTerm = null;
});
function openMenu(t, x, y){
  menuTerm = t;
  var menu = $('menu');
  menu.querySelector('[data-action="kill"]').disabled = !t.alive;
  menu.querySelector('[data-action="others"]').disabled = terms.length < 2;
  menu.hidden = false;
  menu.style.left = Math.max(0, Math.min(x, innerWidth - menu.offsetWidth)) + 'px';
  menu.style.top = Math.max(0, Math.min(y, innerHeight - menu.offsetHeight)) + 'px';
  menu.querySelector('button').focus();
}
function hideMenu(){
  $('menu').hidden = true;
  menuTerm = null;
}
$('menu').onclick = function(e){
  var t = menuTerm;
  if (!t || !e.target.dataset.action) return;
  hideMenu();
  t.tab.querySelector('.l').focus();
  switch (e.target.dataset.action){
    case 'rename': rename(t); break;
    case 'close': stop(t, false); break;
    case 'others': terms.filter(function(x){ return x !== t; }).forEach(function(x){ stop(x, false); }); break;
    case 'kill': stop(t, true); break;
    case 'split': create(t); break;
  }
};
document.addEventListener('pointerdown', function(e){ if (!$('menu').contains(e.target)) hideMenu(); });
window.addEventListener('blur', hideMenu);
function shortcut(action){
  if ($('bNew').disabled) return;
  if (action === 'new') create();
  else if (cur && action === 'close') stop(cur, false);
  else if (cur && (action === 'next' || action === 'previous')){
    var step = action === 'next' ? 1 : -1;
    show(terms[(terms.indexOf(cur) + step + terms.length) % terms.length]);
  }
}
window.addEventListener('keydown', function(e){
  if (menuTerm && e.key === 'Escape'){
    menuTerm.tab.querySelector('.l').focus();
    hideMenu();
    e.preventDefault();
    return;
  }
  if ($('rename').open || !e.ctrlKey || !e.shiftKey || e.altKey || e.metaKey) return;
  var action = { Backquote: 'new', ArrowRight: 'next', ArrowLeft: 'previous', Backspace: 'close' }[e.code];
  if (!action) return;
  e.preventDefault();
  e.stopPropagation();
  if (!e.repeat || action === 'next' || action === 'previous') shortcut(action);
}, true);
Array.prototype.forEach.call(document.querySelectorAll('[data-cmd]'), function(b){
  b.onclick = function(){ run(vandorf(b.dataset.cmd)); };
});

window.addEventListener('message', function(e){
  if (e.origin !== location.origin || !e.data) return;
  var m = e.data;
  if (m.type === 'vandorf-theme') setTheme(m.theme);
  if (m.type === 'term-context') ctx = { dir: m.dir || '', file: m.file, project: m.project };
  if (m.type === 'term-shortcut') shortcut(m.action);
  if (m.type === 'term-run') run(m.cmd);
  if (m.type === 'term-vandorf') run(vandorf(m.sub));
  if (m.type === 'term-compiler'){
    compiler = m.cmd || 'vcc';
    Array.prototype.forEach.call(document.querySelectorAll('[data-cmd]'), function(b){
      b.title = compiler.split('/').pop() + ' ' + b.dataset.cmd + ", in the active file's project";
    });
  }
  if (m.type === 'term-compiler-test') run(tool() + ' --help');
  if (m.type === 'term-focus'){ fit(); if (cur && cur.xt) cur.xt.focus(); }
});

/* Reattach to the server's shells (a reload keeps them), else start one. */
var identify = window.crypto && crypto.subtle
  ? crypto.subtle.digest('SHA-256', new TextEncoder().encode(TOKEN)).then(function(hash){
    instance = Array.from(new Uint8Array(hash)).join('.');
  }).catch(function(){})
  : Promise.resolve();
Promise.all([identify, api('/api/term/list').then(function(r){ return r.json(); })]).then(function(results){
  var l = results[1];
  if (!l.ok){ fail(l.error); return; }
  var state = loadTabs(), remaining = new Set(l.ids), groups = new Map();
  (state ? state.tabs : []).forEach(function(tab){
    if (!remaining.delete(tab.id)) return;
    var t = attach(tab.id, tab, groups.get(tab.group));
    groups.set(t.group, t.panes);
  });
  remaining.forEach(function(id){ attach(id, {}); });
  if (terms.length) show(terms.find(function(t){ return state && t.id === state.active; }) || terms[terms.length - 1]);
  else if (!state) return create();
  else show(null);
}).catch(function(e){ fail('Terminal unavailable: ' + e); }).finally(function(){ $('bNew').disabled = false; });
post({ type: 'term-ready' });
})();
</script>
</body>
</html>
