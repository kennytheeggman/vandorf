<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vandorf &mdash; dataflow viewer</title>
<script>try{if(/[?&]embed=1(&|$)/.test(location.search)||window.parent!==window)document.documentElement.classList.add('embed')}catch(e){}</script>
<style>
:root{
  --ink:#0f172a; --mut:#475569; --line:#cbd5e1; --bg:#eef2f7;
  --call:#64748b; --match:#c026d3; --loop:#d32f2f;
  --expand:#00897b; --cont:#7e57c2; --collect:#00838f;
  --func-bd:#1d6fd8; --func-bg:#eef4ff;
  --proc-bd:#e07b00; --proc-bg:#fff4e2;

  --cbg:#ffffff;         --dot:#cbd5e1;
  --bar-bg:#ffffff;      --bar-tx:#0f172a; --bar-mut:#64748b; --bar-bd:#e2e8f0;
  --surf-bg:#ffffff;     --surf-tx:#0f172a; --surf-mut:#64748b; --surf-bd:#cbd5e1;
  --in-bg:#ffffff;       --in-tx:#0f172a; --in-bd:#cbd5e1;
  --menu-bg:#ffffff;     --menu-tx:#0f172a; --menu-hl:#eaf1fb;
  --accent:#1f6feb;      --accent-tx:#ffffff; --accent-dk:#1c63d2;
  --btn-bg:#f1f5f9;      --btn-bd:#cbd5e1; --btn-tx:#0f172a; --btn-hover:#e2e8f0;
}
html.dark{
  --cbg:#0e1420;         --dot:rgba(148,163,184,.38);
  --bar-bg:#0b1526;      --bar-tx:#ffffff; --bar-mut:#8aa2bf; --bar-bd:#22324a;
  --surf-bg:#0e1a2f;     --surf-tx:#dbe6f4; --surf-mut:#8aa2bf; --surf-bd:#2c4a6e;
  --in-bg:#0e1a2f;       --in-tx:#dbe6f4; --in-bd:#2c4a6e;
  --menu-bg:#0e1a2f;     --menu-tx:#dbe6f4; --menu-hl:#122442;
  --accent:#1f6feb;      --accent-tx:#ffffff; --accent-dk:#1c63d2;
  --btn-bg:#122442;      --btn-bd:#2c4a6e; --btn-tx:#e6effb; --btn-hover:#183256;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink); background:var(--bg);
}
.brand{font-size:19px; font-weight:800; letter-spacing:.5px; color:var(--bar-tx); margin-bottom:2px}
.brand .logo{color:#6fb6ff}
.brand .sub{font-size:12px; font-weight:600; color:var(--bar-mut); margin-left:6px; letter-spacing:0}
.lbl{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--surf-mut); margin:16px 0 6px}
.seg{display:flex; gap:6px; margin-bottom:8px}
.seg button{
  flex:1; padding:7px; border-radius:7px; border:1px solid var(--btn-bd); background:var(--btn-bg);
  color:var(--surf-mut); font-size:12px; font-weight:600; cursor:pointer;
}
.seg button.on{background:var(--accent); border-color:var(--accent); color:var(--accent-tx)}
.panel{display:none}
.panel.on{display:block}
input#path{
  width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--in-bd); background:var(--in-bg);
  color:var(--in-tx); font-size:13px;
}
textarea#srcText{
  width:100%; height:150px; resize:vertical; background:var(--in-bg); color:var(--in-tx);
  border:1px solid var(--in-bd); border-radius:8px; padding:10px;
  font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.row{display:flex; gap:8px; margin-top:10px; align-items:center}
.row > *{flex:1 1 auto}
.btn{
  padding:9px 12px; border-radius:8px; border:1px solid var(--btn-bd); background:var(--btn-bg);
  color:var(--btn-tx); font-size:13px; font-weight:600; cursor:pointer;
}
.btn:hover{background:var(--btn-hover)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-tx)}
.btn.primary:hover{background:var(--accent-dk)}
#status{font-size:12px; color:var(--surf-mut); margin-top:10px; min-height:14px; word-break:break-all}
#err{
  font-size:12px; color:#ffb4a8; background:#3a1520; border:1px solid #6d2b38;
  padding:8px 10px; border-radius:8px; margin-top:12px; display:none; white-space:pre-wrap;
}
body{overflow:hidden}
.topbar{
  position:fixed; top:0; left:0; right:0; height:56px; z-index:50;
  display:flex; align-items:center; gap:14px; padding:0 18px;
  background:var(--bar-bg); color:var(--bar-tx); border-bottom:1px solid var(--bar-bd);
  box-shadow:0 2px 10px rgba(15,23,42,.12);
}
.brand{display:flex; align-items:baseline; gap:8px; white-space:nowrap}
.sel{position:relative}
.sel input{
  width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--in-bd);
  background:var(--in-bg); color:var(--in-tx); font-size:13px; outline:none;
}
.sel input:focus{border-color:var(--accent)}
.menu{
  position:absolute; top:calc(100% + 6px); left:0; right:0; max-height:264px; overflow:auto;
  background:var(--menu-bg); border:1px solid var(--surf-bd); border-radius:10px; margin:0; padding:4px 0;
  list-style:none; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:70; display:none;
}
.menu li{padding:8px 12px; font-size:13px; color:var(--menu-tx); cursor:pointer; border-radius:6px; margin:1px 4px}
.menu li:hover{background:var(--menu-hl)}
.menu li.hid{display:none}
.menu li.hl{background:var(--accent); color:var(--accent-tx)}
.spacer{flex:1}
.sbtn{
  padding:8px 14px; border-radius:8px; border:1px solid var(--btn-bd); background:var(--btn-bg);
  color:var(--btn-tx); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.sbtn:hover,.sbtn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-tx)}
.hidden{display:none!important}
#fg{position:fixed; top:56px; left:0; right:0; bottom:0}
#procPanel{
  position:absolute; top:14px; left:14px; z-index:48; width:300px;
  background:var(--surf-bg); border:1px solid var(--surf-bd); border-radius:12px;
  padding:10px 12px 8px; box-shadow:0 10px 30px rgba(0,0,0,.25);
}
#procPanel .flbl{
  display:block; font-size:10px; text-transform:uppercase; letter-spacing:.8px;
  color:var(--surf-mut); margin:0 2px 6px;
}
main#main{position:absolute; inset:0; overflow:hidden; padding:0; min-width:0}
#viewport{
  position:absolute; inset:0; overflow:hidden; touch-action:none; user-select:none; cursor:grab;
  background-color:var(--cbg);
}
#viewport.panning{cursor:grabbing}
#stage{position:absolute; top:0; left:0; transform-origin:0 0}
#stage svg{display:block}
#stage .notice{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); min-width:360px}
#zoomctl{
  position:absolute; right:18px; bottom:18px; display:flex; align-items:center; gap:6px;
  background:var(--bar-bg); color:var(--bar-tx); border:1px solid var(--bar-bd); border-radius:10px;
  padding:5px 8px; z-index:40; box-shadow:0 6px 20px rgba(0,0,0,.2);
}
#zLevel{font-size:11px; min-width:42px; text-align:center; color:var(--bar-mut)}
.zbtn{
  width:28px; height:28px; border-radius:7px; border:1px solid var(--btn-bd); background:var(--btn-bg);
  color:var(--btn-tx); font-size:15px; font-weight:700; cursor:pointer; line-height:1;
}
.zbtn:hover{background:var(--accent); border-color:var(--accent); color:var(--accent-tx)}
.settings{
  position:absolute; top:12px; right:12px; width:370px; max-height:calc(100% - 24px); overflow:auto;
  background:var(--surf-bg); color:var(--surf-tx); border:1px solid var(--surf-bd); border-radius:14px;
  padding:16px; box-shadow:0 14px 44px rgba(0,0,0,.4); z-index:45;
}
.notice{
  background:var(--surf-bg); border:1px dashed var(--surf-bd); border-radius:12px; padding:22px;
  color:var(--surf-mut); font-size:14px;
}
svg text{font-family:Arial,Helvetica,sans-serif}
.node{cursor:default}
.node rect{fill:#fff; stroke-width:1.4}
.node-func rect{fill:var(--func-bg); stroke:var(--func-bd)}
.node.node-proc > rect{fill:var(--proc-bg); stroke:var(--proc-bd); cursor:pointer}
.node.node-proc > rect:hover{filter:brightness(.97); stroke-width:2}
.node-ell rect{fill:#f1f5f9; stroke:#94a3b8; stroke-dasharray:5 4}
.node text.lab{font-size:12.5px; font-weight:600; fill:var(--ink)}
.node text.sub{font-size:10.5px; fill:#64748b}
.node text.sub.ell{font-size:16px; font-weight:700; fill:#94a3b8}
.hdiam{fill:#fce9fb; stroke:var(--match); stroke-width:1.4; stroke-linejoin:round}
.proc-chip{font-size:8.5px; font-weight:800; fill:#fff}
.proc-chip rect{fill:var(--proc-bd); stroke:none}
.node.node-proc rect.wpanel{fill:transparent; stroke:var(--proc-bd); stroke-width:1.6}
.panel-hd{cursor:pointer}
.panel-bg{fill:var(--proc-bg)}
.pt{font-size:12px; font-weight:700; fill:var(--ink)}
.pn-min rect{fill:#fff; stroke:var(--proc-bd); stroke-width:1}
.pn-min text{font-size:13px; font-weight:800; fill:var(--proc-bd)}
.e{fill:none; stroke-linejoin:round; stroke-linecap:round; stroke-width:1.8}
.e-call{stroke:var(--call)}
.e-match{stroke:var(--match); stroke-dasharray:6 5}
.e-expand{stroke:var(--expand)}
.e-cont{stroke:var(--cont); stroke-dasharray:2 5}
.e-collect{stroke:var(--collect)}
.elabel rect{fill:#fff; fill-opacity:.92; stroke:#d7dee8; stroke-width:1}
.elabel text{font-size:11px; font-weight:600; fill:#7c3f00; text-anchor:middle}
/* Edge hover: a wide invisible stroke makes thin edges easy to hit. */
.ehit{fill:none; stroke:transparent; stroke-width:14; pointer-events:stroke; cursor:pointer}
.eg .elabel{cursor:pointer}
.eg.hot .e{stroke-width:3}
.node.node-func, .node.node-proc{cursor:pointer}
.node.sel > rect{stroke-width:3.4; filter:drop-shadow(0 0 4px rgba(31,111,235,.55))}
.node.selbox > rect.wpanel{stroke-width:3.4; filter:drop-shadow(0 0 5px rgba(31,111,235,.5))}
.node.node-proc.nogrid > rect{cursor:default; stroke-dasharray:4 3}
.eg.sel .e{stroke-width:3.4}
.eg.sel .elabel rect{stroke:var(--accent); stroke-width:1.6}
html.embed .topbar, html.embed #settings, html.embed #procPanel{display:none!important}
html.embed #fg{top:0}
#etip{
  position:fixed; z-index:60; pointer-events:none; display:none; max-width:420px;
  background:var(--surf-bg); color:var(--surf-tx); border:1px solid var(--surf-bd); border-radius:10px;
  padding:8px 10px; font-size:12px; line-height:1.45; box-shadow:0 8px 24px rgba(0,0,0,.25);
}
#etip .k{color:var(--surf-mut); font-size:10px; text-transform:uppercase; letter-spacing:.6px; margin-right:6px}
#etip code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; word-break:break-word}
#etip .row + .row{margin-top:3px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">Vandorf</span><span class="sub">dataflow viewer</span></div>
  <div class="spacer"></div>
  <button id="settingsBtn" class="sbtn" title="Source / compile settings">&#9881;&nbsp;Settings</button>
</header>

<div id="fg">
  <div id="procPanel">
    <span class="flbl">Procedure</span>
    <div class="sel">
      <input id="procSel" placeholder="Search procedure…" autocomplete="off" spellcheck="false">
      <ul class="menu" id="procMenu"></ul>
    </div>
  </div>

  <main id="main">
    <div id="viewport">
      <div id="stage"><div class="notice">No document yet. Open <b>Settings</b> (top right) to compile a source file.</div></div>
    </div>
    <div id="zoomctl">
      <button id="zMinus" class="zbtn" title="Zoom out">&minus;</button>
      <span id="zLevel">100%</span>
      <button id="zPlus" class="zbtn" title="Zoom in">+</button>
      <button id="zFit" class="zbtn" title="Fit to window">&#128470;</button>
    </div>
  </main>

  <div id="settings" class="settings hidden">
    <span class="lbl">Source</span>
    <div class="seg">
      <button id="modeFile" class="on">File</button>
      <button id="modeText">Text</button>
    </div>
    <div class="panel on" id="panelFile">
      <input id="path" list="srcList" placeholder="test/fixtures/test1.sys" spellcheck="false">
      <datalist id="srcList"></datalist>
    </div>
    <div class="panel" id="panelText">
      <textarea id="srcText" placeholder="interface Foo {&#10;  func Call(s: string): int;&#10;}&#10;&#10;proc Bar(Start): string {&#10;  func Start(): string;&#10;  ...&#10;}"></textarea>
    </div>
    <div class="row">
      <button class="btn" id="refresh" title="Refresh file list">&#8635;</button>
      <button class="btn primary" id="compile">Compile &#9656;</button>
    </div>
    <div id="status"></div>
    <div id="err"></div>

    <span class="lbl">Theme</span>
    <div class="seg">
      <button id="themeLight" class="on">Light</button>
      <button id="themeDark">Dark</button>
    </div>
  </div>
</div>

<script>
'use strict';
var FONT = 'Arial,Helvetica,sans-serif';
var EMBEDDED = window.parent !== window;
var EMBED = EMBEDDED || /[?&]embed=1(&|$)/.test(location.search);
if (EMBED) document.documentElement.classList.add('embed');
var pathInput = document.getElementById('path');
var srcText = document.getElementById('srcText');
var statusEl = document.getElementById('status');
var errEl = document.getElementById('err');
var main = document.getElementById('main');
var stageEl = document.getElementById('stage');
var viewport = document.getElementById('viewport');
var procSel = document.getElementById('procSel');
var procMenu = document.getElementById('procMenu');
var settingsBtn = document.getElementById('settingsBtn');
var settingsEl = document.getElementById('settings');
var zoomctl = document.getElementById('zoomctl');
var zPlus = document.getElementById('zPlus');
var zMinus = document.getElementById('zMinus');
var zFit = document.getElementById('zFit');
var zLevel = document.getElementById('zLevel');
var currentProc = '';
var pendingProc = null;     // a proc asked for before the document holding it arrived
var rendered = false;       // the stage shows currentProc's grid

if (EMBED) stageEl.innerHTML = '<div class="notice">Waiting for the editor\u2026</div>';

function storeGet(key){
  try { if (typeof localStorage !== 'undefined') return localStorage.getItem(key); } catch (e) {}
  return null;
}
function storeSet(key, val){
  try { if (typeof localStorage !== 'undefined') localStorage.setItem(key, val); } catch (e) {}
}

var measure = (function(){
  var c = document.createElement('canvas').getContext('2d');
  return function(t, size, weight){
    c.font = (weight || 400) + ' ' + size + 'px ' + FONT;
    return c.measureText(t || '').width;
  };
})();

function esc(s){ return String(s).replace(/[&<>"']/g, function(ch){
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
});}

function setErr(msg){
  if (msg){ errEl.style.display = 'block'; errEl.textContent = msg; }
  else { errEl.style.display = 'none'; errEl.textContent = ''; }
}
function setStatus(msg){ statusEl.textContent = msg; }

/* ---------- messages to the embedding IDE ---------- */
function post(msg){
  if (!EMBEDDED) return;
  try { window.parent.postMessage(msg, location.origin); } catch (e) {}
}

/* ---------- mode switching ---------- */
function setMode(m){
  document.getElementById('modeFile').classList.toggle('on', m === 'file');
  document.getElementById('modeText').classList.toggle('on', m === 'text');
  document.getElementById('panelFile').classList.toggle('on', m === 'file');
  document.getElementById('panelText').classList.toggle('on', m === 'text');
}
document.getElementById('modeFile').addEventListener('click', function(){ setMode('file'); });
document.getElementById('modeText').addEventListener('click', function(){ setMode('text'); });

pathInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') compile(); });
document.getElementById('compile').addEventListener('click', compile);

/* ---------- theme ---------- */
function applyTheme(m, persist){
  document.documentElement.classList.toggle('dark', m === 'dark');
  document.getElementById('themeLight').classList.toggle('on', m !== 'dark');
  document.getElementById('themeDark').classList.toggle('on', m === 'dark');
  if (persist) storeSet('vandorf.theme', m);
  applyGrid();
}
document.getElementById('themeLight').addEventListener('click', function(){ applyTheme('light', true); });
document.getElementById('themeDark').addEventListener('click', function(){ applyTheme('dark', true); });

/* ---------- source list (standalone only: embedded, the IDE pushes documents) ---------- */
if (!EMBED){
  fetch('/api/sources').then(function(r){ return r.json(); }).then(function(res){
    var root = res.root || '';
    (res.files || []).forEach(function(f){
      var o = document.createElement('option');
      o.value = f; o.label = root.replace(/\/?$/, '/') + f;
      document.getElementById('srcList').appendChild(o);
    });
    if (res.files && res.files.length){
      var saved = storeGet('vandorf.source');
      if (saved && res.files.indexOf(saved) >= 0 && DOC === null){
        pathInput.value = saved;
        compile();
      } else if (!pathInput.value){
        pathInput.value = res.files[0];
      }
    }
  }).catch(function(){});
}

document.getElementById('refresh').addEventListener('click', function(){ location.reload(); });

/* ---------- compile ---------- */
function compile(){
  setErr(null);
  var fileMode = document.getElementById('panelFile').classList.contains('on');
  var body;
  if (fileMode){
    if (!pathInput.value.trim()){ setErr('Enter a source file path.'); return; }
    body = JSON.stringify({ path: pathInput.value.trim() });
  } else {
    if (!srcText.value.trim()){ setErr('Paste some source text.'); return; }
    body = JSON.stringify({ source: srcText.value });
  }
  setStatus('Compiling\u2026');
  fetch('/api/compile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok){ setErr(res.error || 'compilation failed'); setStatus(''); return; }
      setStatus('compiled ' + res.name + ' \u2014 ' + res.grids + ' proc grid' + (res.grids === 1 ? '' : 's'));
      if (fileMode && pathInput.value.trim()) storeSet('vandorf.source', pathInput.value.trim());
      renderDoc(res.document);
    })
    .catch(function(e){ setErr('Network error: ' + e); setStatus(''); });
}

/* =====================================================================
   LAYOUT (pure: no DOM; needs measure(), DOC and expanded)
   ===================================================================== */
/* LAYOUT-BEGIN */
var DOC = null;
// Expanded proc panels of the current root proc, keyed by node path from the
// root grid: "3,1" is row 3 col 1 of the root, "3,1/0,2" is row 0 col 2 of
// the grid shown in that panel.
var expanded = {};
var MAXDEPTH = 5;
var GAP_H = 48, GAP_V = 84, PAD_X = 46, PAD_Y = 44, NODE_W = 160, PANEL_HD = 30;
var T_AIR = 22;       // forward lane: this far above the target row's top
var BACK_AIR = 34;    // back-edge lane above the target row
var BACK_DROP = 18;   // straight run below a back edge's tail before it turns
var RAIL_GAP = 30;    // back-edge rail: this far right of the rows it spans
var RAIL_STEP = 14;   // spacing between neighbouring rails
var FAN_OFF = 10;     // fan stroke spacing unit from the center line

var ETYPE = { CALL: 0, MATCH: 1, EXPAND: 2, CONTINUE: 3, COLLECT: 4 };
function isFan(t){ return t === ETYPE.EXPAND || t === ETYPE.CONTINUE || t === ETYPE.COLLECT; }
// An edge whose target lies not below its source (self-reference, or target
// above source) is rendered as a loop back.
function isBackEdge(e){
  if (!e || !e.source || !e.target) return false;
  return e.target[0] < e.source[0] ||
    (e.target[0] === e.source[0] && e.target[1] === e.source[1]);
}
function hasOwn(o, k){ return !!o && Object.prototype.hasOwnProperty.call(o, k); }
function getGrid(name){ return DOC && DOC.grids && hasOwn(DOC.grids, name) ? DOC.grids[name] : null; }
function rc(r, c){ return r + ',' + c; }

// Truncate a text to fit maxW px, appending an ellipsis when it overflows.
function truncate(t, fs, maxW, weight){
  if (!t) return '';
  weight = weight || 600;
  if (measure(t, fs, weight) <= maxW) return t;
  var e = '\u2026', ew = measure(e, fs, weight), budget = maxW - ew;
  var lo = 0, hi = t.length;
  while (lo < hi){
    var mid = (lo + hi + 1) >> 1;
    if (measure(t.slice(0, mid), fs, weight) <= budget) lo = mid; else hi = mid - 1;
  }
  return t.slice(0, lo) + e;
}

/* ---- proc node -> grid key ----
   A proc node's label is its grid key, except for an `as` alias: label `UA`,
   sublabel `instance of Unfold`, where Unfold is written as seen from the
   enclosing proc. Try the name as is, then qualified by the enclosing grid
   and each of its ancestors, then a unique grid ending in `.Name`. */
var RESOLVED = {};
function resolveProc(n, owner){
  if (!n || n.type !== 1 || !DOC || !DOC.grids) return null;
  var ck = owner + '\u0001' + (n.label || '') + '\u0001' + (n.sublabel || '');
  if (hasOwn(RESOLVED, ck)) return RESOLVED[ck];
  return (RESOLVED[ck] = resolveName(n, owner || ''));
}
function resolveName(n, owner){
  var G = DOC.grids;
  if (n.label && hasOwn(G, n.label)) return n.label;
  var cands = [];
  var m = /^instance of (.+)$/.exec(n.sublabel || '');
  if (m) cands.push(m[1].trim());
  if (n.label) cands.push(n.label);
  var parts = owner ? owner.split('.') : [];
  for (var a = 0; a < cands.length; a++){
    var x = cands[a];
    if (hasOwn(G, x)) return x;
    for (var i = parts.length; i > 0; i--){
      var q = parts.slice(0, i).join('.') + '.' + x;
      if (hasOwn(G, q)) return q;
    }
    var hit = null, cnt = 0, suf = '.' + x;
    for (var k in G){
      if (hasOwn(G, k) && k.length > suf.length && k.slice(-suf.length) === suf){ hit = k; cnt++; }
    }
    if (cnt === 1) return hit;
  }
  return null;
}

/* ---- column assignment (topology only, cached per grid) ----
   1. Top down: each node hangs under its parent (the forward predecessor in
      the nearest row above); a parent's k children spread around its column.
      Each row's desired columns, ordered by parent, are made distinct with
      the least total displacement (isotonic regression).
   2. Bottom up: a node whose forward successors all lie in one column (or,
      with several successors, their median column) moves there if that slot
      of its row is free. Chains thus line up with the node they flow into.
   3. Unused columns are dropped. */
var COLS = {};
function columnsOf(name, grid){
  if (hasOwn(COLS, name)) return COLS[name];
  return (COLS[name] = assignColumns(grid));
}

// x[i] integers with x[i+1] >= x[i] + 1 minimising sum |x[i] - d[i]|.
function spread(d){
  var blocks = [];
  for (var i = 0; i < d.length; i++){
    blocks.push({ vals: [d[i] - i], m: d[i] - i, n: 1 });
    while (blocks.length > 1 && blocks[blocks.length - 2].m > blocks[blocks.length - 1].m){
      var b = blocks.pop(), a = blocks.pop();
      var vals = a.vals.concat(b.vals).sort(function(p, q){ return p - q; });
      var lo = vals[(vals.length - 1) >> 1], hi = vals[vals.length >> 1];
      blocks.push({ vals: vals, m: Math.round((lo + hi) / 2), n: vals.length });
    }
  }
  var x = [], idx = 0;
  blocks.forEach(function(b){
    for (var j = 0; j < b.n; j++, idx++) x.push(b.m + idx);
  });
  for (var t = 1; t < x.length; t++) if (x[t] <= x[t - 1]) x[t] = x[t - 1] + 1;
  return x;
}

function assignColumns(grid){
  var rows = (grid && grid.rows) || [];
  var R = rows.length, col = [], succ = {}, pred = {};
  rows.forEach(function(row, r){ col[r] = []; (row.nodes || []).forEach(function(n, c){ col[r][c] = c; }); });
  function exists(p){ return p && rows[p[0]] && (rows[p[0]].nodes || [])[p[1]] !== undefined; }
  ((grid && grid.edges) || []).forEach(function(e){
    if (!exists(e.source) || !exists(e.target) || e.target[0] <= e.source[0]) return;
    var sk = rc(e.source[0], e.source[1]), tk = rc(e.target[0], e.target[1]);
    var s = succ[sk] = succ[sk] || [];
    if (s.indexOf(tk) < 0) s.push(tk);
    var p = pred[tk] = pred[tk] || [];
    if (p.indexOf(sk) < 0) p.push(sk);
  });
  function at(k){ var a = k.split(','); return [+a[0], +a[1]]; }

  for (var r = 1; r < R; r++){
    var items = [], groups = {}, order = [];
    col[r].forEach(function(_, c){
      var best = null;
      (pred[rc(r, c)] || []).forEach(function(pk){
        var p = at(pk);
        if (!best || p[0] > best[0]) best = p;
      });
      var it = { c: c, parent: best };
      items.push(it);
      if (best){
        var bk = rc(best[0], best[1]);
        if (!groups[bk]){ groups[bk] = []; order.push(bk); }
        groups[bk].push(it);
      }
    });
    order.forEach(function(bk){
      var g = groups[bk], k = g.length, p = at(bk), pc = col[p[0]][p[1]];
      g.forEach(function(it, i){ it.pc = pc; it.pr = p[0]; it.i = i; it.d = pc + i - ((k - 1) >> 1); });
    });
    var maxD = -Infinity;
    items.forEach(function(it){ if (it.parent && it.d > maxD) maxD = it.d; });
    items.forEach(function(it){ if (!it.parent){ it.pc = Infinity; it.pr = 0; it.i = it.c; it.d = (maxD === -Infinity ? 0 : maxD + 1) + it.c; } });
    items.sort(function(a, b){ return (a.pc - b.pc) || (b.pr - a.pr) || (a.i - b.i) || (a.c - b.c); });
    var xs = spread(items.map(function(it){ return it.d; }));
    items.forEach(function(it, i){ col[r][it.c] = xs[i]; });
  }

  function taken(r, x, except){
    for (var j = 0; j < col[r].length; j++) if (j !== except && col[r][j] === x) return true;
    return false;
  }
  for (var pass = 0; pass < 4; pass++){
    var moved = false;
    for (var r2 = R - 2; r2 >= 0; r2--){
      for (var c2 = 0; c2 < col[r2].length; c2++){
        var ss = succ[rc(r2, c2)];
        if (!ss || !ss.length) continue;
        var cs = ss.map(function(k){ var p = at(k); return col[p[0]][p[1]]; }).sort(function(a, b){ return a - b; });
        var want = cs[(cs.length - 1) >> 1];
        if (want === col[r2][c2] || taken(r2, want, c2)) continue;
        col[r2][c2] = want; moved = true;
      }
    }
    if (!moved) break;
  }

  var used = {};
  col.forEach(function(row){ row.forEach(function(x){ used[x] = true; }); });
  var keys = Object.keys(used).map(Number).sort(function(a, b){ return a - b; });
  var remap = {};
  keys.forEach(function(x, i){ remap[x] = i; });
  return { col: col.map(function(row){ return row.map(function(x){ return remap[x]; }); }), n: keys.length };
}

/* ---- geometry ----
   Column width = widest thing in the column (a compact node or an expanded
   panel), row height = tallest thing in the row; everything is centered in
   its column and top-aligned in its row. Panels lay out recursively. */
function nodeH(n){ return 44 + (n && n.sublabel ? 18 : 0); }

function layoutGrid(name, prefix, depth){
  var grid = getGrid(name) || { rows: [], edges: [] };
  var rows = grid.rows || [], edges = grid.edges || [];
  var C = columnsOf(name, grid);
  var colW = [], rowH = [], items = {};
  for (var c0 = 0; c0 < C.n; c0++) colW[c0] = 0;
  rows.forEach(function(row, r){
    rowH[r] = 0;
    (row.nodes || []).forEach(function(n, c){
      var k = rc(r, c), path = prefix + k, w = NODE_W, h = nodeH(n), lay = null;
      var gk = n.type === 1 ? resolveProc(n, name) : null;
      if (gk && depth < MAXDEPTH && expanded[path]){
        lay = layoutGrid(gk, path + '/', depth + 1);
        w = lay.w; h = lay.h + PANEL_HD;
      }
      var cc = C.col[r][c];
      items[k] = { n: n, w: w, h: h, lay: lay, grid: gk, col: cc, row: r };
      if (w > colW[cc]) colW[cc] = w;
      if (h > rowH[r]) rowH[r] = h;
    });
  });
  var colX = [], rowY = [], x = PAD_X, y = PAD_Y;
  for (var c1 = 0; c1 < C.n; c1++){ colX[c1] = x; x += colW[c1] + GAP_H; }
  var right = C.n ? x - GAP_H : PAD_X;
  rows.forEach(function(_, r){ rowY[r] = y; y += rowH[r] + GAP_V; });
  var bottom = rows.length ? y - GAP_V : PAD_Y;

  var pos = {}, byRow = [];
  rows.forEach(function(_, r){ byRow[r] = []; });
  Object.keys(items).forEach(function(k){
    var it = items[k];
    var px = colX[it.col] + (colW[it.col] - it.w) / 2, py = rowY[it.row];
    var p = { x: px, y: py, w: it.w, h: it.h, cx: px + it.w / 2, cy: py + it.h / 2,
              row: it.row, col: it.col, grid: it.grid, lay: it.lay, path: prefix + k };
    if (it.lay){
      p.panel = it.grid;
      var e0 = it.lay.pos['0,0'];
      p.in = e0 ? { x: px + e0.cx, y: py + PANEL_HD + e0.y } : null;
    }
    pos[k] = p;
    byRow[it.row].push(p);
  });

  var L = { name: name, prefix: prefix, depth: depth, grid: grid, pos: pos, byRow: byRow,
            colX: colX, colW: colW, rowY: rowY, rowH: rowH, nc: C.n,
            rails: {}, backTop: {}, backBot: {}, gutUse: {}, matchSrc: {} };
  edges.forEach(function(e){
    if (e.type === ETYPE.MATCH && e.source) L.matchSrc[rc(e.source[0], e.source[1])] = true;
  });

  // Back edges: rails to the right of everything in the rows they span,
  // inner (shorter) loops first so outer ones go around them.
  var backs = [], topCnt = {}, botCnt = {};
  edges.forEach(function(e, i){
    if (!isBackEdge(e)) return;
    var s = pos[rc(e.source[0], e.source[1])], t = pos[rc(e.target[0], e.target[1])];
    if (!s || !t) return;
    backs.push({ i: i, e: e, s: s, lo: e.target[0], hi: e.source[0] });
  });
  backs.sort(function(a, b){ return (a.hi - a.lo) - (b.hi - b.lo) || a.hi - b.hi || a.i - b.i; });
  var placed = [], maxX = right;
  backs.forEach(function(b){
    var mr = 0;
    for (var r = b.lo; r <= b.hi; r++) byRow[r].forEach(function(p){ if (p.x + p.w > mr) mr = p.x + p.w; });
    var rx = mr + RAIL_GAP;
    var lw = b.e.label ? measure(truncate(b.e.label, 11, 200), 11, 600) + 16 : 0;
    placed.forEach(function(q){
      if (q.lo <= b.hi && b.lo <= q.hi) rx = Math.max(rx, q.x + Math.max(RAIL_STEP, q.lw / 2 + lw / 2 + 6));
    });
    placed.push({ lo: b.lo, hi: b.hi, x: rx, lw: lw });
    L.rails[b.i] = rx;
    maxX = Math.max(maxX, rx + lw / 2 + 4);
    var tc = topCnt[b.lo] = (topCnt[b.lo] || 0) + 1;
    L.backTop[b.i] = Math.max(6, rowY[b.lo] - BACK_AIR - 6 * Math.min(tc - 1, 4));
    var bc = botCnt[b.hi] = (botCnt[b.hi] || 0) + 1;
    var tail = tailY(b.s, b.e, L.matchSrc);
    L.backBot[b.i] = Math.max(tail + BACK_DROP, rowY[b.hi] + rowH[b.hi] + 16) + 6 * Math.min(bc - 1, 3);
  });

  L.w = Math.max(right, maxX) + PAD_X;
  L.h = bottom + PAD_Y;
  return L;
}

function diamondH(p){ return Math.min(p.w, 32) / 2; }

// Vertical origin of an edge's tail: the node's bottom center, or the tip of
// the match half-diamond for match edges leaving a match-source node.
function tailY(s, e, matchSrc){
  if (e.type === ETYPE.MATCH && matchSrc && matchSrc[rc(e.source[0], e.source[1])]) return s.y + s.h + 1 + diamondH(s);
  return s.y + s.h;
}

// Is the vertical line at x clear of every element in rows r0..r1?
function colFree(L, r0, r1, x, margin){
  for (var r = r0; r <= r1; r++){
    var ps = L.byRow[r] || [];
    for (var i = 0; i < ps.length; i++){
      if (x > ps[i].x - margin && x < ps[i].x + ps[i].w + margin) return false;
    }
  }
  return true;
}

// The gutter between columns closest to both ends; gutters never hold nodes.
function gutterX(L, ox, ux, fan){
  var best = null, bc = 0;
  for (var c = 0; c <= L.nc; c++){
    var g = (c < L.nc ? L.colX[c] : (L.nc ? L.colX[L.nc - 1] + L.colW[L.nc - 1] + GAP_H : PAD_X)) - GAP_H / 2;
    var cost = Math.abs(g - ox) + Math.abs(g - ux);
    if (best === null || cost < best - 0.5 || (Math.abs(cost - best) <= 0.5 && Math.abs(g - ux) < Math.abs(gutterAt(L, bc) - ux))){ best = cost; bc = c; }
  }
  var n = L.gutUse[bc] = (L.gutUse[bc] || 0) + 1;
  var off = fan ? 0 : [0, -8, 8, -16, 16][(n - 1) % 5];
  return gutterAt(L, bc) + off;
}
function gutterAt(L, c){
  return (c < L.nc ? L.colX[c] : (L.nc ? L.colX[L.nc - 1] + L.colW[L.nc - 1] + GAP_H : PAD_X)) - GAP_H / 2;
}

function dedupe(pts){
  var out = [];
  pts.forEach(function(p){
    var q = out[out.length - 1];
    if (!q || Math.abs(q[0] - p[0]) > 0.01 || Math.abs(q[1] - p[1]) > 0.01) out.push(p);
  });
  return out;
}

// Downward route from (ox,oy) in row rs to (ux,ey) in row rt (rt may be one
// past the last row: a panel's exit). Straight down the source column when
// that is clear of the rows in between, else across just below the source
// row and down the target column, else down the nearest gutter.
function routeDown(L, rs, rt, ox, oy, ux, ey, yb, fan){
  var margin = fan ? 26 : 8;
  if (colFree(L, rs + 1, rt - 1, ox, margin)) return dedupe([[ox, oy], [ox, yb], [ux, yb], [ux, ey]]);
  var y1 = Math.max(L.rowY[rs] + L.rowH[rs] + 24, oy + 10);
  if (colFree(L, rs + 1, rt - 1, ux, margin)) return dedupe([[ox, oy], [ox, y1], [ux, y1], [ux, ey]]);
  var gx = gutterX(L, ox, ux, fan);
  return dedupe([[ox, oy], [ox, y1], [gx, y1], [gx, yb], [ux, yb], [ux, ey]]);
}

// Route of edge i of the laid-out grid: { pts, back, lx, ly } or null.
function edgeRoute(L, e, i){
  var s = L.pos[rc(e.source[0], e.source[1])], t = L.pos[rc(e.target[0], e.target[1])];
  if (!s || !t) return null;
  var type = e.type !== undefined ? e.type : ETYPE.CALL;
  var ox = s.cx, oy = tailY(s, e, L.matchSrc);
  var tx = t.in ? t.in.x : t.cx, ty = t.in ? t.in.y : t.y;
  if (isBackEdge(e) && hasOwn(L.rails, i)){
    var rail = L.rails[i], yB = L.backBot[i], yT = L.backTop[i];
    return { back: true, pts: dedupe([[ox, oy], [ox, yB], [rail, yB], [rail, yT], [tx, yT], [tx, ty]]),
             lx: rail, ly: (yB + yT) / 2 };
  }
  var yb = Math.max(L.rowY[e.target[0]] - T_AIR, oy + 8);
  var pts = routeDown(L, e.source[0], e.target[0], ox, oy, tx, ty, yb, isFan(type));
  return { back: false, pts: pts, lx: tx, ly: t.y - 11 };
}

// Exit arrows of a panel's grid: sinks point down out of the panel.
function exitRoutes(L){
  var hasSrc = {}, out = [], R = (L.grid.rows || []).length;
  (L.grid.edges || []).forEach(function(e){ if (e.source) hasSrc[rc(e.source[0], e.source[1])] = true; });
  (L.grid.rows || []).forEach(function(row, r){
    (row.nodes || []).forEach(function(n, c){
      var k = rc(r, c), q = L.pos[k];
      if (hasSrc[k] || !q) return;
      out.push(routeDown(L, r, R, q.cx, q.y + q.h, q.cx, L.h, L.h - 14, false));
    });
  });
  return out;
}
/* LAYOUT-END */

/* ---------- edge types (document.EdgeType) ---------- */
var EDGE_META = {
  0: { cls: 'e-call',    color: '#64748b' },
  1: { cls: 'e-match',   color: '#c026d3' },
  2: { cls: 'e-expand',  color: '#00897b' },
  3: { cls: 'e-cont',    color: '#7e57c2' },
  4: { cls: 'e-collect', color: '#00838f' }
};
var EDGE_NAME = { 0: 'call', 1: 'match', 2: 'expand', 3: 'continue', 4: 'collect' };
function edgeType(v){ return EDGE_META[v] || EDGE_META[0]; }

/* ---------- rendering ---------- */
function renderDoc(doc, proc){
  DOC = doc || { grids: {} };
  if (!DOC.grids) DOC.grids = {};
  RESOLVED = {}; COLS = {};
  buildProcMenu();
  var names = Object.keys(DOC.grids).sort();
  if (!names.length){
    stageEl.innerHTML = '<div class="notice">Compiled, but the document has no procedure grids.</div>';
    procSel.value = '';
    rendered = false;
    return;
  }
  var want = null;
  if (proc){
    if (getGrid(proc)) want = proc; else pendingProc = proc;
  }
  if (!want && pendingProc && getGrid(pendingProc)){ want = pendingProc; }
  if (want === pendingProc) pendingProc = null;
  if (!want) want = getGrid(currentProc) ? currentProc : names[0];
  // Same proc as on screen (a recompile): keep pan/zoom, expansion and selection.
  if (want === currentProc && rendered) rerenderProc();
  else renderProc(want);
}

function buildProcMenu(){
  procMenu.innerHTML = '';
  Object.keys(DOC.grids || {}).sort().forEach(function(n){
    var li = document.createElement('li');
    li.textContent = n;
    li.setAttribute('data-g', n);
    procMenu.appendChild(li);
  });
}

function selectProc(name){
  if (!getGrid(name)) return;
  procSel.value = name;
  closeMenu();
  if (name === currentProc && rendered) return;
  renderProc(name);
}

function renderProc(name){
  if (!getGrid(name)) return;
  currentProc = name;
  procSel.value = name;
  expanded = loadExpanded(name);
  selected = null;
  draw();
  rendered = true;
  centerView();
}

function rerenderProc(){
  if (!DOC || !getGrid(currentProc)) return;
  draw();
  applyView();
}

function draw(){
  INFO = {};
  stageEl.innerHTML = renderSvg(currentProc);
  applySelection();
}

/* -------- svg drawing -------- */
var EDGE_R = 6;                          // corner radius of rounded-rectilinear arrow routes
var MK = 'vmk';                          // marker id prefix (markers are defined once, in the root svg)
var INFO = {};                           // data-sel id -> what a click on it reports
var selected = null;                     // data-sel id of the selected element

// Orthogonal polyline turned into a rounded-rectilinear path: straight runs
// joined by quadratic fillet corners of radius r (clamped to half of either
// segment). Points are [x,y] pairs.
function roundPath(pts, r){
  var d = 'M' + pts[0][0] + ' ' + pts[0][1];
  for (var i = 1; i < pts.length - 1; i++){
    var a = pts[i - 1], b = pts[i], c = pts[i + 1];
    var dx1 = b[0] - a[0], dy1 = b[1] - a[1];
    var dx2 = c[0] - b[0], dy2 = c[1] - b[1];
    var n1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
    var n2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
    if (dx1 * dx2 + dy1 * dy2 === 0 && n1 > 0 && n2 > 0){
      var rr = Math.min(r, n1 / 2, n2 / 2);
      d += ' L' + (b[0] - dx1 / n1 * rr) + ' ' + (b[1] - dy1 / n1 * rr) +
           ' Q' + b[0] + ' ' + b[1] + ' ' + (b[0] + dx2 / n2 * rr) + ' ' + (b[1] + dy2 / n2 * rr);
    } else {
      d += ' L' + b[0] + ' ' + b[1];
    }
  }
  var z = pts[pts.length - 1];
  d += ' L' + z[0] + ' ' + z[1];
  return d;
}

function defs(){
  var s = '<defs>';
  for (var t in EDGE_META){
    s += '<marker id="' + MK + '-' + EDGE_NAME[t] + '" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
         '<path d="M0 0L10 5L0 10z" fill="' + EDGE_META[t].color + '" stroke="' + EDGE_META[t].color + '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></marker>';
  }
  return s + '</defs>';
}

// What a click on a node reports: the value and call of an edge into it.
function nodeInfo(L, k, n){
  var inE = null;
  (L.grid.edges || []).forEach(function(e){
    if (!inE && e.target && rc(e.target[0], e.target[1]) === k) inE = e;
  });
  return {
    kind: n.type === 1 ? 'proc' : 'func', label: n.label || '', sublabel: n.sublabel || null,
    grid: n.type === 1 ? resolveProc(n, L.name) : null, owner: L.name,
    valueType: inE ? (inE.valueType || null) : null, call: inE ? (inE.call || null) : null, edgeLabel: null
  };
}

function nodeSVG(L, k, n){
  var p = L.pos[k], isMatchSrc = L.matchSrc[k];
  if (p.lay) return panelSVG(L, k, n);
  var cls = n.type === 1 ? 'node-proc' : (n.type === 2 ? 'node-ell' : 'node-func');
  if (n.type === 1 && !p.grid) cls += ' nogrid';
  var id = 'n:' + p.path, attr = '';
  if (n.type !== 2){
    INFO[id] = nodeInfo(L, k, n);
    INFO[id].path = p.path;
    INFO[id].canExpand = !!(p.grid && L.depth < MAXDEPTH);
    attr = ' data-sel="' + esc(id) + '"';
  }
  var s = '<g class="node ' + cls + '"' + attr + '>';
  s += '<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="10"></rect>';
  var full = (n.type === 2 ? 'ellipsis' : (n.type === 1 ? 'procedure: ' : 'function: ') + (n.label || ''));
  if (n.sublabel) full += ' \u2014 ' + n.sublabel;
  if (n.type === 1) full += p.grid ? '\nclick: expand \u00b7 ctrl/\u2318-click: open' : '\n(no grid found)';
  s += '<title>' + esc(full) + '</title>';
  if (n.type === 2){
    s += '<text class="sub ell" x="' + p.cx + '" y="' + (p.y + p.h / 2 + 6) + '" text-anchor="middle">\u2026\u2026\u2026</text>';
  } else if (n.sublabel){
    s += '<text class="lab" x="' + p.cx + '" y="' + (p.y + 21) + '" text-anchor="middle">' + esc(truncate(n.label, 12.5, NODE_W - 44, 1000)) + '</text>';
    s += '<text class="sub" x="' + p.cx + '" y="' + (p.y + 36) + '" text-anchor="middle">' + esc(truncate(n.sublabel, 10.5, NODE_W - 28, 1000)) + '</text>';
  } else {
    s += '<text class="lab" x="' + p.cx + '" y="' + (p.y + p.h / 2 + 5) + '" text-anchor="middle">' + esc(truncate(n.label, 12.5, NODE_W - 28, 1000)) + '</text>';
  }
  if (n.type === 1){
    s += '<g class="proc-chip"><rect x="' + (p.x + p.w - 34) + '" y="' + (p.y + 5) + '" width="29" height="13" rx="6.5"/>' +
         '<text x="' + (p.x + p.w - 19) + '" y="' + (p.y + 14) + '" text-anchor="middle">proc</text></g>';
  }
  if (isMatchSrc) s += '<path class="hdiam" d="' + halfDiamondPath(p.cx, p.y + p.h + 1, diamondH(p)) + '"></path>';
  return s + '</g>';
}

// Drill-in panel: replaces a compact proc node with the proc's own grid
// rendered as a nested SVG, headed by a bar with a minimize handle. Incoming
// arrows land on the proc's topmost node; nodes with no outgoing edge get an
// exit arrow down to the bottom of the window.
function panelSVG(L, k, n){
  var p = L.pos[k], CL = p.lay, name = p.grid, id = 'n:' + p.path;
  INFO[id] = nodeInfo(L, k, n);
  INFO[id].path = p.path;
  INFO[id].expanded = true;
  var s = '<g class="node node-proc" data-selbox="' + esc(id) + '">';
  s += '<rect class="wpanel" x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="14"></rect>';
  var b = 2, hw = p.w - 2 * b, ht = PANEL_HD - b;
  var title = n.label === name ? name : (n.label + ' \u2014 ' + name);
  s += '<g class="panel-hd" data-sel="' + esc(id) + '">' +
       '<title>' + esc('procedure: ' + title + '\nctrl/\u2318-click: open') + '</title>' +
       '<path class="panel-bg" d="M' + (p.x + b + 12) + ' ' + (p.y + b) + ' L' + (p.x + b + hw - 12) + ' ' + (p.y + b) + ' A12 12 0 0 1 ' + (p.x + b + hw) + ' ' + (p.y + b + 12) + ' L' + (p.x + b + hw) + ' ' + (p.y + ht) + ' L' + (p.x + b) + ' ' + (p.y + ht) + ' L' + (p.x + b) + ' ' + (p.y + b + 12) + ' A12 12 0 0 1 ' + (p.x + b + 12) + ' ' + (p.y + b) + ' Z"></path>' +
       '<text class="pt" x="' + (p.x + 16) + '" y="' + (p.y + PANEL_HD / 2 + 5) + '">' + esc(truncate(title, 12, Math.max(40, p.w - 80), 700)) + '</text>' +
       '<g class="pn-min" data-min="' + esc(p.path) + '" transform="translate(' + (p.x + p.w - 46) + ' ' + (p.y + 5) + ')">' +
         '<title>collapse</title><rect width="36" height="20" rx="10"></rect>' +
         '<text x="18" y="14" text-anchor="middle">\u2013</text>' +
       '</g></g>';
  var body = renderLayout(CL);
  exitRoutes(CL).forEach(function(pts){
    body += '<path class="e e-call" d="' + roundPath(pts, EDGE_R) + '" marker-end="url(#' + MK + '-call)"></path>';
  });
  s += '<svg data-gname="' + esc(name) + '" x="' + p.x + '" y="' + (p.y + PANEL_HD) + '" width="' + CL.w + '" height="' + CL.h + '" viewBox="0 0 ' + CL.w + ' ' + CL.h + '" style="overflow:visible">' + body + '</svg>';
  if (L.matchSrc[k]) s += '<path class="hdiam" d="' + halfDiamondPath(p.cx, p.y + p.h + 1, diamondH(p)) + '"></path>';
  return s + '</g>';
}

// Rounded lower half of a diamond: flat top edge, two rounded upper corners,
// a gently rounded bottom point. Width = 2*dh, height = dh.
function halfDiamondPath(cx, ytop, dh){
  var r = Math.max(2, dh * 0.35);
  var x1 = cx - dh, x2 = cx + dh;
  return 'M' + (x1 + r) + ' ' + ytop +
         ' L' + (x2 - r) + ' ' + ytop +
         ' A' + r + ' ' + r + ' 0 0 1 ' + x2 + ' ' + (ytop + r) +
         ' L' + cx + ' ' + (ytop + dh) +
         ' L' + x1 + ' ' + (ytop + r) +
         ' A' + r + ' ' + r + ' 0 0 1 ' + (x1 + r) + ' ' + ytop + ' Z';
}

function edgeSVG(L, e, i, labelCount){
  var R = edgeRoute(L, e, i);
  if (!R) return '';
  var type = e.type !== undefined ? e.type : ETYPE.CALL;
  var cls = edgeType(type).cls;
  var ah = MK + '-' + EDGE_NAME[type];
  var d = roundPath(R.pts, EDGE_R);
  var id = 'e:' + L.prefix + i;
  var t = (L.grid.rows[e.target[0]].nodes || [])[e.target[1]] || {};
  INFO[id] = {
    kind: 'edge', label: t.label || '', sublabel: t.sublabel || null,
    grid: t.type === 1 ? resolveProc(t, L.name) : null, owner: L.name,
    valueType: e.valueType || null, call: e.call || null, edgeLabel: e.label || null
  };
  // The group carries what the edge passes (valueType and call) for the
  // hover tooltip.
  var out = '<g class="eg" data-sel="' + esc(id) + '" data-vt="' + esc(e.valueType || '') + '" data-call="' + esc(e.call || '') + '" data-lab="' + esc(e.label || '') + '">' +
    '<path class="e ' + cls + '" d="' + d + '" marker-end="url(#' + ah + ')" data-type="' + type + '"></path>';
  if (!R.back){
    if (type === ETYPE.EXPAND) out += fanTail(R.pts, FAN_OFF, cls, ah, 2);
    else if (type === ETYPE.CONTINUE) out += fanTail(R.pts, FAN_OFF, cls, ah, 1) + fanHead(R.pts, FAN_OFF, cls, 1);
    else if (type === ETYPE.COLLECT) out += fanHead(R.pts, FAN_OFF, cls, 2);
  }
  if (e.label){
    var lx = R.lx, ly = R.ly, maxW = 200;
    if (!R.back){
      // Arm labels sit on the drop into the target; several arms into one
      // target stack upward.
      var tk = rc(e.target[0], e.target[1]);
      var nth = labelCount[tk] = (labelCount[tk] || 0) + 1;
      ly -= 20 * (nth - 1);
      var tp = L.pos[tk];
      maxW = Math.max(80, L.colW[tp.col] + GAP_H - 12);
    }
    var txt = truncate(e.label, 11, maxW - 16);
    var tw = measure(txt, 11, 600) + 16;
    out += '<g class="elabel">' +
      '<rect x="' + (lx - tw / 2) + '" y="' + (ly - 11) + '" width="' + tw + '" height="18" rx="9"/>' +
      '<text x="' + lx + '" y="' + (ly + 4) + '">' + esc(txt) + '</text></g>';
  }
  out += '<path class="ehit" d="' + d + '"></path></g>';
  return out;
}

// Fan leaves that land on the target with their own arrowheads: the "many"
// side of a one-to-many / many-to-many. Each leaf leaves the source center
// along the main stem, elbows out just below the source, then follows the
// main route shifted sideways and drops onto the target beside its center.
function fanTail(pts, off, cls, ah, pairs){
  var sx = pts[0][0], sy = pts[0][1];
  var y0 = Math.min(sy + 14, pts[1][1] - 6);
  var s = '';
  for (var k = 1; k <= pairs; k++){
    [-1, 1].forEach(function(sg){
      var o = sg * off * k;
      var pl = [[sx, sy], [sx, y0], [sx + o, y0]];
      for (var i = 1; i < pts.length; i++) pl.push([pts[i][0] + o, pts[i][1]]);
      s += '<path class="e ' + cls + '" d="' + roundPath(dedupe(pl), EDGE_R) + '" marker-end="url(#' + ah + ')"></path>';
    });
  }
  return s;
}

// Fan leaves leaving the source: the "many" side of a many-to-one /
// many-to-many. These tails originate spread across the source's bottom
// edge and merge into the main stem at its first lane.
function fanHead(pts, off, cls, pairs){
  var sx = pts[0][0], sy = pts[0][1], ym = pts[1][1], mx = pts.length > 2 ? pts[2][0] : sx;
  var s = '';
  for (var k = 1; k <= pairs; k++){
    [-1, 1].forEach(function(sg){
      var o = sg * off * k;
      s += '<path class="e ' + cls + '" d="' + roundPath(dedupe([[sx + o, sy], [sx + o, ym], [mx, ym]]), EDGE_R) + '"></path>';
    });
  }
  return s;
}

function renderLayout(L){
  var s = '', labelCount = {};
  (L.grid.edges || []).forEach(function(e, i){ s += edgeSVG(L, e, i, labelCount); });
  (L.grid.rows || []).forEach(function(row, r){
    (row.nodes || []).forEach(function(n, c){ s += nodeSVG(L, rc(r, c), n); });
  });
  return s;
}

function renderSvg(name){
  var L = layoutGrid(name, '', 0);
  return '<svg data-gname="' + esc(name) + '" width="' + L.w + '" height="' + L.h + '" viewBox="0 0 ' + L.w + ' ' + L.h + '">' + defs() + renderLayout(L) + '</svg>';
}

/* ---------- selection ---------- */
function applySelection(){
  Array.prototype.forEach.call(stageEl.querySelectorAll('.sel, .selbox'), function(el){
    el.classList.remove('sel'); el.classList.remove('selbox');
  });
  if (!selected) return;
  var q = '"' + selected.replace(/["\\]/g, '\\$&') + '"';
  Array.prototype.forEach.call(stageEl.querySelectorAll('[data-sel=' + q + ']'), function(el){
    // A panel header highlights its whole panel instead.
    if (!el.classList.contains('panel-hd')) el.classList.add('sel');
  });
  Array.prototype.forEach.call(stageEl.querySelectorAll('[data-selbox=' + q + ']'), function(el){ el.classList.add('selbox'); });
}
function select(id){
  selected = id && INFO[id] ? id : null;
  applySelection();
  var i = selected ? INFO[selected] : null;
  if (!i){ post({ type: 'vandorf-select', kind: null }); return; }
  post({ type: 'vandorf-select', kind: i.kind, label: i.label, sublabel: i.sublabel, grid: i.grid,
         owner: i.owner, valueType: i.valueType, call: i.call, edgeLabel: i.edgeLabel });
}

/* ---------- proc selector (searchable) ---------- */
function closestEl(el, attr){
  while (el && el !== document && el !== main){
    if (el.getAttribute && el.getAttribute(attr) !== null) return el;
    el = el.parentNode;
  }
  return null;
}
function closestAttr(el, attr){
  var e = closestEl(el, attr);
  return e ? e.getAttribute(attr) : null;
}
function menuItems(){ return Array.prototype.slice.call(procMenu.children); }
function openMenu(){ menuItems().forEach(function(li){ li.classList.remove('hid'); }); procMenu.style.display = 'block'; }
function closeMenu(){ procMenu.style.display = 'none'; }
function highlight(li){
  menuItems().forEach(function(x){ x.classList.toggle('hl', x === li); });
}

procSel.addEventListener('focus', function(){ openMenu(); highlight(null); });
procSel.addEventListener('input', function(){
  var q = (procSel.value || '').toLowerCase();
  var m = menuItems(), first = null;
  m.forEach(function(li){
    var hit = li.textContent.toLowerCase().indexOf(q) >= 0;
    li.classList.toggle('hid', !hit);
    if (hit && !first) first = li;
  });
  openMenu();
  highlight(first);
});
procSel.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ closeMenu(); procSel.blur(); return; }
  if (e.key === 'Enter'){
    e.preventDefault();
    var m = menuItems().filter(function(li){ return !li.classList.contains('hid'); });
    var exact = getGrid(procSel.value);
    var pick = exact ? procSel.value : (m.length ? m[0].getAttribute('data-g') : null);
    if (pick) selectProc(pick);
    else closeMenu();
  }
});
procSel.addEventListener('blur', function(){ setTimeout(closeMenu, 150); });
procMenu.addEventListener('click', function(ev){
  var g = closestAttr(ev.target, 'data-g');
  if (g) selectProc(g);
});

/* ---------- settings panel ---------- */
function toggleSettings(show){
  var isOpen = !settingsEl.classList.contains('hidden');
  var open = show === undefined ? !isOpen : show;
  settingsEl.classList.toggle('hidden', !open);
  settingsBtn.classList.toggle('on', open);
}
settingsBtn.addEventListener('click', function(ev){
  ev.stopPropagation();
  toggleSettings();
});
document.addEventListener('click', function(ev){
  if (settingsEl.classList.contains('hidden')) return;
  if (settingsEl.contains(ev.target) || settingsBtn.contains(ev.target)) return;
  toggleSettings(false);
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && !settingsEl.classList.contains('hidden')) toggleSettings(false);
});

/* ---------- pan & zoom ---------- */
var view = { x: 0, y: 0, k: 1 };
function clampK(k){ return Math.max(0.05, Math.min(4, k)); }
function dotColor(){
  try {
    if (typeof getComputedStyle === 'function'){
      var c = getComputedStyle(document.documentElement).getPropertyValue('--dot').trim();
      if (c) return c;
    }
  } catch (e) {}
  return '#cbd5e1';
}
function applyGrid(){
  var tile = Math.max(8, 24 * view.k);
  var d = Math.max(0.6, 1.2 * view.k);
  var vs = viewport.style;
  vs.backgroundSize = tile + 'px ' + tile + 'px';
  vs.backgroundPosition = view.x + 'px ' + view.y + 'px';
  vs.backgroundImage = 'radial-gradient(' + dotColor() + ' ' + d + 'px, transparent ' + (d + 0.3) + 'px)';
}
function applyView(){
  stageEl.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')';
  zLevel.textContent = Math.round(view.k * 100) + '%';
  applyGrid();
}
function zoomAt(cx, cy, nk){
  nk = clampK(nk);
  view.x = cx - (cx - view.x) * (nk / view.k);
  view.y = cy - (cy - view.y) * (nk / view.k);
  view.k = nk;
  applyView();
}
function stageSize(){
  var svg = stageEl.querySelector('svg');
  return {
    w: svg ? (parseFloat(svg.getAttribute('width')) || 300) : 300,
    h: svg ? (parseFloat(svg.getAttribute('height')) || 200) : 200
  };
}
function centerView(){
  var vw = viewport.clientWidth || 900, vh = viewport.clientHeight || 700, s = stageSize();
  view = { x: Math.max(0, (vw - s.w) / 2), y: Math.max(0, (vh - s.h) / 2), k: 1 };
  applyView();
}
function fitView(){
  var vw = viewport.clientWidth || 900, vh = viewport.clientHeight || 700;
  if (!stageEl.querySelector('svg')){ view = { x: 0, y: 0, k: 1 }; applyView(); return; }
  var s = stageSize();
  var k = clampK(Math.min(vw / Math.max(1, s.w), vh / Math.max(1, s.h), 1));
  view = { x: Math.max(0, (vw - s.w * k) / 2), y: Math.max(0, (vh - s.h * k) / 2), k: k };
  applyView();
}

/* ---------- edge tooltip: the value along an edge and the call it feeds ---------- */
var etip = document.createElement('div');
etip.id = 'etip';
document.body.appendChild(etip);
var hotEdge = null;
function edgeGroup(el){
  while (el && el !== document){
    if (el.classList && el.classList.contains('eg')) return el;
    el = el.parentNode;
  }
  return null;
}
function hideTip(){
  etip.style.display = 'none';
  if (hotEdge){ hotEdge.classList.remove('hot'); hotEdge = null; }
}
viewport.addEventListener('pointermove', function(ev){
  var g = panning ? null : edgeGroup(ev.target);
  if (!g || !(g.dataset.lab || g.dataset.vt || g.dataset.call)){ hideTip(); return; }
  if (g !== hotEdge){
    if (hotEdge) hotEdge.classList.remove('hot');
    hotEdge = g; g.classList.add('hot');
    var rows = [];
    if (g.dataset.lab) rows.push('<div class="row"><span class="k">arm</span><code>' + esc(g.dataset.lab) + '</code></div>');
    if (g.dataset.vt) rows.push('<div class="row"><span class="k">this</span><code>' + esc(g.dataset.vt) + '</code></div>');
    if (g.dataset.call) rows.push('<div class="row"><span class="k">calls</span><code>' + esc(g.dataset.call) + '</code></div>');
    etip.innerHTML = rows.join('');
    etip.style.display = 'block';
  }
  // Keep the tooltip beside the pointer and inside the window.
  var x = ev.clientX + 14, y = ev.clientY + 14;
  var w = etip.offsetWidth, h = etip.offsetHeight;
  if (x + w > window.innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > window.innerHeight - 8) y = ev.clientY - h - 14;
  etip.style.left = Math.max(8, x) + 'px';
  etip.style.top = Math.max(8, y) + 'px';
});
viewport.addEventListener('pointerleave', hideTip);

var panning = false, panMoved = false, panX = 0, panY = 0, panOX = 0, panOY = 0;
viewport.addEventListener('pointerdown', function(ev){
  if (ev.button !== 0) return;
  hideTip();
  panning = true; panMoved = false;
  panX = ev.clientX; panY = ev.clientY;
  panOX = view.x; panOY = view.y;
  viewport.classList.add('panning');
  ev.preventDefault();
});
window.addEventListener('pointermove', function(ev){
  if (!panning) return;
  var dx = ev.clientX - panX, dy = ev.clientY - panY;
  if (Math.abs(dx) + Math.abs(dy) > 3) panMoved = true;
  if (!panMoved) return;
  view.x = panOX + dx; view.y = panOY + dy;
  applyView();
});
window.addEventListener('pointerup', function(){ panning = false; viewport.classList.remove('panning'); });
window.addEventListener('pointercancel', function(){ panning = false; viewport.classList.remove('panning'); });
viewport.addEventListener('wheel', function(ev){
  ev.preventDefault();
  var r = viewport.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, view.k * Math.exp(-ev.deltaY * 0.0012));
}, { passive: false });
zPlus.addEventListener('click', function(){ var r = viewport.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, view.k * 1.25); });
zMinus.addEventListener('click', function(){ var r = viewport.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, view.k / 1.25); });
zFit.addEventListener('click', fitView);

/* ---------- clicks: expand, collapse, open, select ---------- */
function openProc(key){
  if (!key || !getGrid(key)) return;
  if (EMBEDDED) post({ type: 'vandorf-open-proc', proc: key });
  else selectProc(key);
}
main.addEventListener('click', function(ev){
  if (zoomctl.contains(ev.target)) return;
  if (panMoved){ panMoved = false; return; }
  if (!DOC || !rendered) return;
  var min = closestAttr(ev.target, 'data-min');
  if (min !== null){
    // Collapse the panel and everything expanded inside it.
    Object.keys(expanded).forEach(function(p){
      if (p === min || p.indexOf(min + '/') === 0) delete expanded[p];
    });
    saveExpanded();
    if (selected && selected.indexOf('n:' + min + '/') === 0 || selected && selected.indexOf('e:' + min + '/') === 0) selected = null;
    rerenderProc();
    return;
  }
  var id = closestAttr(ev.target, 'data-sel');
  var info = id ? INFO[id] : null;
  if (!info){ select(null); return; }
  if (info.kind === 'proc' && (ev.ctrlKey || ev.metaKey)){ openProc(info.grid); return; }
  if (info.kind === 'proc' && !info.expanded && info.canExpand){
    expanded[info.path] = true;
    saveExpanded();
    rerenderProc();
  }
  select(id);
});

/* ---------- localStorage persistence: expanded panels per root proc ---------- */
function expKey(root){ return 'vandorf.expanded.' + root; }
function saveExpanded(){
  if (!currentProc) return;
  var keys = Object.keys(expanded);
  if (keys.length) storeSet(expKey(currentProc), JSON.stringify(expanded));
  else { try { if (typeof localStorage !== 'undefined') localStorage.removeItem(expKey(currentProc)); } catch (e) {} }
}
function loadExpanded(root){
  var raw = storeGet(expKey(root));
  if (!raw) return {};
  try {
    var o = JSON.parse(raw), out = {};
    if (o && typeof o === 'object') for (var k in o) if (hasOwn(o, k) && o[k] === true) out[k] = true;
    return out;
  } catch (e) { return {}; }
}

/* ---------- embedding: the IDE (same origin) drives this page ---------- */
window.addEventListener('message', function(e){
  if (e.origin !== location.origin || !e.data || typeof e.data !== 'object') return;
  var m = e.data;
  if (m.type === 'vandorf-document'){
    setErr(null);
    setStatus('compiled ' + (m.name || 'editor') + ' \u2014 from workbench');
    renderDoc(m.document, m.proc);
  } else if (m.type === 'vandorf-show-proc'){
    if (getGrid(m.proc)) selectProc(m.proc);
    else pendingProc = m.proc || null;
  } else if (m.type === 'vandorf-theme'){
    applyTheme(m.theme === 'dark' ? 'dark' : 'light', false);
  } else if (m.type === 'vandorf-fit'){
    fitView();
  }
});
if (EMBEDDED) window.parent.postMessage({ type: 'vandorf-viz-ready' }, location.origin);

applyView();
applyTheme(storeGet('vandorf.theme') === 'dark' ? 'dark' : 'light', false);
</script>
</body>
