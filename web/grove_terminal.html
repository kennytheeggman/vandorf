<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<link rel="stylesheet" href="/ui.css">
<style>
/* grove's built-in interior: one terminal in an idea's worktree, in one of
   its sections. /terminal?idea=<id>&term=<n> reattaches to terminal n if it
   still runs, else starts one and tells grove its id. */
body{ font-size:12px; display:flex; flex-direction:column }
#term{ flex:1; position:relative; min-height:0; padding:4px 0 0 8px }
.msg{ padding:14px; color:var(--mut) } .msg.bad{ color:var(--err) }
.xterm .xterm-viewport{ scrollbar-width:thin }
</style>
</head>
<body>
<div id="term"></div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
(function(){
'use strict';
var TOKEN = '__VANDORF_TOKEN__';
var q = new URLSearchParams(location.search);
var idea = q.get('idea') || '', want = +(q.get('term') || 0);
var el = document.getElementById('term');
/* To grove, versioned: { grove: 1, type, .. }. */
function tell(m){ if (window.parent !== window){ m.grove = 1; window.parent.postMessage(m, location.origin); } }
function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ 'X-Vandorf-Token': TOKEN }, opts.headers || {});
  return fetch(path, opts);
}
var dark = false, t = null, xt = null, fit = null;

function palette(){
  return dark
    ? { background: '#0b111c', foreground: '#dbe6f4', cursor: '#dbe6f4', selectionBackground: 'rgba(59,130,246,.35)' }
    : { background: '#ffffff', foreground: '#0f172a', cursor: '#0f172a', selectionBackground: 'rgba(31,111,235,.25)',
        black: '#0f172a', red: '#c62828', green: '#1b7f3b', yellow: '#a16207', blue: '#1d4ed8', magenta: '#a21caf', cyan: '#0e7490', white: '#64748b',
        brightBlack: '#475569', brightRed: '#dc2626', brightGreen: '#16a34a', brightYellow: '#ca8a04', brightBlue: '#2563eb', brightMagenta: '#c026d3', brightCyan: '#0891b2', brightWhite: '#334155' };
}
function setTheme(theme){
  dark = theme === 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  if (xt) xt.options.theme = palette();
}
function fail(msg){
  el.innerHTML = ''; var d = document.createElement('div'); d.className = 'msg bad'; d.textContent = msg; el.appendChild(d);
}

function attach(id){
  t = { id: id, from: 0, alive: true };
  tell({ type: 'term', id: id });
  if (!window.Terminal){ fail('xterm.js did not load (offline?). The terminal needs cdn.jsdelivr.net.'); return; }
  xt = new Terminal({ fontFamily: 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace', fontSize: 12.5, cursorBlink: true,
                      scrollback: 5000, theme: palette() });
  if (window.FitAddon){ fit = new FitAddon.FitAddon(); xt.loadAddon(fit); }
  xt.open(el);
  xt.onData(send); xt.onBinary(send);
  xt.onResize(function(sz){ if (t.alive) api('/api/term/resize?id=' + t.id + '&cols=' + sz.cols + '&rows=' + sz.rows, { method: 'POST' }); });
  xt.onTitleChange(function(title){ tell({ type: 'title', title: title }); });
  /* Shortcuts the terminal doesn't use go to grove: its chords are Alt+Shift. */
  xt.attachCustomKeyEventHandler(function(e){
    if (e.type === 'keydown' && e.altKey && e.shiftKey && !e.ctrlKey && !e.metaKey){
      tell({ type: 'keys', key: e.key, code: e.code, alt: true, shift: true, ctrl: false, meta: false });
      return false;
    }
    return true;
  });
  refit(); pump(); xt.focus();
}
/* Keystrokes go out in order, one request at a time; whatever piles up
   meanwhile is sent together. */
function send(d){
  if (!t || !t.alive) return;
  t.pending = (t.pending || '') + d;
  if (t.sending) return;
  t.sending = true;
  (function flush(){
    var body = t.pending; t.pending = '';
    api('/api/term/input?id=' + t.id, { method: 'POST', body: body })
      .catch(function(){})
      .then(function(){ if (t.pending) flush(); else t.sending = false; });
  })();
}
/* Long polling: each read waits on the server until there's output. */
function pump(){
  if (!t.alive) return;
  api('/api/term/read?id=' + t.id + '&from=' + t.from).then(function(r){
    if (!r.ok) throw new Error('gone');
    var next = +r.headers.get('X-Next'), closed = r.headers.get('X-Closed') === '1';
    return r.arrayBuffer().then(function(b){
      if (b.byteLength) xt.write(new Uint8Array(b));
      t.from = next;
      if (closed && !b.byteLength){ dead('process exited'); return; }
      pump();
    });
  }).catch(function(){
    if (!t.alive) return;
    api('/api/term/list').then(function(r){ return r.json(); }).then(function(l){
      if (l.ids && l.ids.indexOf(t.id) >= 0) setTimeout(pump, 500); else dead('disconnected');
    }).catch(function(){ setTimeout(pump, 2000); });
  });
}
function dead(why){
  t.alive = false;
  if (xt) xt.write('\r\n\x1b[2m[' + why + ']\x1b[0m\r\n');
  tell({ type: 'exit' });
}
function refit(){ if (fit && el.offsetWidth){ try { fit.fit(); } catch (e) {} } }
window.addEventListener('resize', refit);
if (window.ResizeObserver) new ResizeObserver(refit).observe(el);

function create(){
  return api('/api/term?idea=' + encodeURIComponent(idea), { method: 'POST' }).then(function(r){ return r.json(); }).then(function(res){
    if (!res.ok){ fail(res.error); return; }
    attach(res.id);
  }).catch(function(e){ fail(String(e)); });
}

window.addEventListener('message', function(e){
  if (e.origin !== location.origin || e.source !== window.parent || !e.data || e.data.grove !== 1) return;
  var m = e.data;
  if (m.type === 'context' && m.theme) setTheme(m.theme);
  if (m.type === 'visible' && m.visible) setTimeout(refit, 0);
  if (m.type === 'focus'){ refit(); if (xt) xt.focus(); }
  if (m.type === 'run' && m.cmd){ if (t && t.alive){ send(m.cmd + '\r'); if (xt) xt.focus(); } }
});

/* Reattach to the section's terminal if it still runs (a reload keeps it),
   else start one. */
api('/api/term/list').then(function(r){ return r.json(); }).then(function(l){
  if (!l.ok){ fail(l.error); return; }
  if (want && l.ids.indexOf(want) >= 0) attach(want); else create();
}).catch(function(e){ fail('Terminal unavailable: ' + e); });
tell({ type: 'ready' });
})();
</script>
</body>
</html>
