<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorer</title>
<link rel="stylesheet" href="/ui.css">
<style>
body{ background:var(--bar); display:flex; flex-direction:column; user-select:none; overflow:hidden }
/* Two toolbars: the title row matches the tab strip, the filter row the
   viewer's toolbar beside it, so both line up across the panels. */
#q{ width:100%; flex:1 1 auto; min-width:0 }
#tree{ flex:1; overflow:auto; padding-bottom:16px }
.row{ display:flex; align-items:center; gap:5px; height:22px; padding-right:8px; cursor:pointer; white-space:nowrap }
.row:hover{ background:var(--hover) }
.row.sel{ background:var(--sel); color:var(--sel-ink) }
.row .tw{ width:12px; flex:none; text-align:center; color:var(--mut); font-size:9px; transition:transform .1s }
.row.open > .tw{ transform:rotate(90deg) }
.badge.dir{ background:none; color:var(--mut); font-size:12px }
.row .nm{ overflow:hidden; text-overflow:ellipsis }
.row .er{ color:var(--err); margin-left:auto; font-weight:700 }
.row .pj{ margin-left:auto; padding-left:8px; font-size:11px; color:var(--mut) }
.row.project .nm{ font-weight:600 }
.row.minor .nm{ color:var(--mut) }
.empty{ color:var(--mut); padding:12px }
mark{ background:rgba(250,204,21,.45); color:inherit; border-radius:0}
</style>
</head>
<body>
<div class="bar"><span class="ttl">Explorer</span><span class="sp"></span>
  <button class="icon letter" id="bAll" title="Also list funcs, types and interfaces">ƒ</button>
  <button class="icon" id="bCollapse" title="Collapse all"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11"/><path d="M5.5 8h5"/></svg></button>
  <button class="icon" id="bRefresh" title="Refresh"><svg viewBox="0 0 16 16"><path d="M13.2 8A5.2 5.2 0 1 1 11.7 4.3M13.2 2.3v3.4H9.8"/></svg></button>
</div>
<div class="bar"><input id="q" placeholder="Filter procs…" spellcheck="false" autocomplete="off"></div>
<div id="tree"><div class="empty">Loading…</div></div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function post(m){ if (window.parent !== window) window.parent.postMessage(m, location.origin); }

var data = null, active = { path: null, proc: null, project: null };
/* Directories holding a vandorf.toml, by path: their project info. */
function projects(){
  var out = {};
  (data ? data.files : []).forEach(function(f){ if (f.project) out[f.project.dir] = f.project; });
  return out;
}
var open = (function(){ try { return JSON.parse(store('vandorf.ex.open')) || null; } catch (e) { return null; } })();
var showAll = store('vandorf.ex.all') === '1';
$('bAll').classList.toggle('on', showAll);

function isOpen(key, dflt){ return open && key in open ? open[key] : dflt; }
function setOpen(key, v){ open = open || {}; open[key] = v; store('vandorf.ex.open', JSON.stringify(open)); }

function load(){
  fetch('/api/tree').then(function(r){ return r.json(); }).then(function(t){ data = t; render(); })
    .catch(function(e){ $('tree').innerHTML = '<div class="empty">Could not load the file list: ' + esc(e) + '</div>'; });
}

/* Files nest under their directories; a file is a directory of its procs. */
function build(){
  var root = { dirs: {}, files: [] };
  data.files.forEach(function(f){
    var parts = f.path.split('/'), d = root;
    for (var i = 0; i < parts.length - 1; i++){
      d = d.dirs[parts[i]] = d.dirs[parts[i]] || { dirs: {}, files: [], name: parts[i], path: parts.slice(0, i + 1).join('/') };
    }
    d.files.push(f);
  });
  // Collapse chains of single-child directories (examples/demo), but not
  // past a project's directory: it gets its own row.
  var pj = projects();
  (function squash(d){
    Object.keys(d.dirs).forEach(function(k){
      var c = d.dirs[k];
      while (!pj[c.path] && Object.keys(c.dirs).length === 1 && !c.files.length){
        var only = c.dirs[Object.keys(c.dirs)[0]];
        only.name = c.name + '/' + only.name;
        c = only;
      }
      d.dirs[k] = c; squash(c);
    });
  })(root);
  // The working directory is the top row, so a manifest there (a project
  // opened from its own directory) has its project row too.
  root.name = (data.root || '').replace(/\/+$/, '').split('/').pop() || '/';
  root.path = '';
  return { dirs: { '': root }, files: [] };
}

function hl(s, q){
  if (!q) return esc(s);
  var i = s.toLowerCase().indexOf(q);
  return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
}

function itemMatches(it, q){
  if (!q) return true;
  if (it.qual.toLowerCase().indexOf(q) >= 0) return true;
  return (it.children || []).some(function(c){ return visible(c) && itemMatches(c, q); });
}
function visible(it){ return showAll || it.kind === 'proc' || (it.children || []).some(function(c){ return c.kind === 'proc'; }); }

function render(){
  if (!data) return;
  var q = $('q').value.trim().toLowerCase();
  var h = [], depth = 0, pj = projects();
  function pad(d){ return ' style="padding-left:' + (6 + d * 12) + 'px"'; }
  // An interface's funcs carry the interface badge.
  function items(list, file, d, inIface){
    list.forEach(function(it){
      if (!visible(it) || !itemMatches(it, q)) return;
      var kids = (it.children || []).filter(function(c){ return visible(c); });
      var key = 'i:' + file.path + '#' + it.qual, op = q ? true : isOpen(key, false);
      var sel = it.kind === 'proc' && active.path === file.path && active.proc === it.qual;
      var entry = it.kind === 'proc' && it.entry, badge = inIface ? 'interface' : it.kind;
      h.push('<div class="row' + (kids.length && op ? ' open' : '') + (sel ? ' sel' : '') + (it.kind !== 'proc' ? ' minor' : '') + '"' + pad(d) +
        ' data-k="' + esc(key) + '" data-kind="' + it.kind + '" data-path="' + esc(file.path) + '" data-qual="' + esc(it.qual) + '" data-line="' + it.line + '"' +
        (kids.length ? ' data-tw="1"' : '') + ' title="' + esc((inIface ? 'interface func' : it.kind) + ' ' + it.qual + ' — ' + file.path + ':' + (it.line + 1) + (entry ? '\nentry point: ' + entry.join(', ') : '') + (it.doc ? '\n\n' + it.doc : '')) + '">' +
        '<span class="tw">' + (kids.length ? '▶' : '') + '</span>' +
        '<span class="badge ' + badge + (entry ? ' entry' : '') + '">' + { proc: 'P', func: 'ƒ', type: 'T', interface: 'I' }[badge] + '</span>' +
        '<span class="nm">' + hl(it.name, q) + '</span></div>');
      if (kids.length && op) items(kids, file, d + 1, it.kind === 'interface');
    });
  }
  function dir(dd, d){
    Object.keys(dd.dirs).sort().forEach(function(k){
      var c = dd.dirs[k], key = 'd:' + c.path, op = q ? true : isOpen(key, true);
      var inner = [];
      var save = h; h = inner; dir(c, d + 1); h = save;
      if (q && !inner.length) return;
      var proj = pj[c.path];
      if (proj){
        h.push('<div class="row project' + (op ? ' open' : '') + (active.project === c.path ? ' sel' : '') + '"' + pad(d) + ' data-k="' + esc(key) + '" data-tw="1" data-project="' + esc(c.path) + '"' +
          ' title="' + esc('project ' + proj.name + ' — click for its overview') + '">' +
          '<span class="tw">▶</span><span class="badge project"></span><span class="nm">' + esc(c.name) + '</span><span class="pj">' + esc(proj.name) + '</span></div>');
      } else {
        h.push('<div class="row' + (op ? ' open' : '') + '"' + pad(d) + ' data-k="' + esc(key) + '" data-tw="1">' +
          '<span class="tw">▶</span><span class="badge dir">▣</span><span class="nm">' + esc(c.name) + '</span></div>');
      }
      if (op) h.push.apply(h, inner);
    });
    dd.files.forEach(function(f){
      var key = 'f:' + f.path, kids = f.items.filter(visible);
      var matching = kids.filter(function(it){ return itemMatches(it, q); });
      var nameHit = q && f.path.toLowerCase().indexOf(q) >= 0;
      if (q && !matching.length && !nameHit) return;
      var op = q ? true : isOpen(key, active.path === f.path);
      var sel = active.path === f.path && !active.proc;
      h.push('<div class="row' + (op ? ' open' : '') + (sel ? ' sel' : '') + '"' + pad(d) + ' data-k="' + esc(key) + '" data-tw="1" data-file="' + esc(f.path) + '"' +
        ' title="' + esc(f.path + (f.project ? ' — project ' + f.project.name : '') + (f.error ? '\n' + f.error : '')) + '">' +
        '<span class="tw">▶</span><span class="badge file">S</span><span class="nm">' + hl(f.path.split('/').pop(), q) + '</span>' +
        (f.error ? '<span class="er" title="' + esc(f.error) + '">!</span>' : '') + '</div>');
      if (op) items(nameHit && !matching.length ? kids : kids, f, d + 1);
    });
  }
  dir(build(), 0);
  $('tree').innerHTML = h.join('') || '<div class="empty">' + (q ? 'No procs match.' : 'No .sys files under the source directory.') + '</div>';
  var s = $('tree').querySelector('.row.sel');
  if (s) s.scrollIntoView({ block: 'nearest' });
}

$('tree').addEventListener('click', function(e){
  var r = e.target.closest('.row'); if (!r) return;
  var kind = r.dataset.kind, onTwisty = e.target.closest('.tw');
  if (kind === 'proc' && !onTwisty){
    post({ type: 'ide-open', path: r.dataset.path, proc: r.dataset.qual, newTab: e.ctrlKey || e.metaKey, mode: 'diagram' });
    return;
  }
  if (r.dataset.project != null && !onTwisty){
    post({ type: 'ide-open', project: r.dataset.project });
    if (!r.classList.contains('open')){ setOpen(r.dataset.k, true); render(); }
    return;
  }
  if (kind && kind !== 'proc' && !onTwisty){
    post({ type: 'ide-open', path: r.dataset.path, proc: null, line: +r.dataset.line, mode: 'text', newTab: e.ctrlKey || e.metaKey });
    return;
  }
  if (r.dataset.tw){ setOpen(r.dataset.k, !r.classList.contains('open')); render(); }
});
$('tree').addEventListener('dblclick', function(e){
  var r = e.target.closest('.row');
  if (r && r.dataset.file) post({ type: 'ide-open', path: r.dataset.file, proc: null, mode: 'text' });
});
$('q').addEventListener('input', render);
$('q').addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ $('q').value = ''; render(); }
  if (e.key === 'Enter'){
    var r = $('tree').querySelector('.row[data-kind="proc"]');
    if (r) post({ type: 'ide-open', path: r.dataset.path, proc: r.dataset.qual, newTab: e.ctrlKey || e.metaKey, mode: 'diagram' });
  }
});
$('bRefresh').onclick = load;
$('bCollapse').onclick = function(){
  open = {}; (data ? data.files : []).forEach(function(f){ open['f:' + f.path] = false; });
  store('vandorf.ex.open', JSON.stringify(open)); render();
};
$('bAll').onclick = function(){ showAll = !showAll; store('vandorf.ex.all', showAll ? '1' : '0'); this.classList.toggle('on', showAll); render(); };

window.addEventListener('message', function(e){
  if (e.origin !== location.origin || !e.data) return;
  var m = e.data;
  if (m.type === 'vandorf-theme') document.documentElement.setAttribute('data-theme', m.theme);
  if (m.type === 'ide-refresh') load();
  if (m.type === 'ide-active'){
    active = { path: m.path || null, proc: m.proc || null, project: m.project != null ? m.project : null };
    if (m.path && !(open && ('f:' + m.path) in open)) setOpen('f:' + m.path, true);
    render();
  }
});
post({ type: 'explorer-ready' });
load();
})();
</script>
</body>
</html>
