<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="/ui.css">
<style>
body{ display:flex; flex-direction:column }
.crumb{ color:var(--mut); overflow:hidden; text-overflow:ellipsis; font-size:12px; padding:0 4px; min-width:0 }
.crumb .dot{ color:var(--dirty); margin-left:6px; display:none } .crumb.dirty .dot{ display:inline }
#main{ flex:1; position:relative; min-height:0 }
#diagram, #text{ position:absolute; inset:0; display:none }
#diagram.on, #text.on{ display:flex; flex-direction:column }
#viz{ flex:1; border:0; width:100%; background:var(--bg) }
#banner{ position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:5; background:var(--err-bg); color:var(--err);
  border:1px solid var(--err); border-radius:0; padding:3px 12px; font-size:12px; cursor:pointer; display:none; box-shadow:0 4px 14px var(--shadow) }
#banner.on{ display:block }
body.text-mode #bFit, body.text-mode #bIface{ display:none }

/* text mode */
#editorWrap{ flex:1; min-height:0; position:relative }
#editorWrap textarea{ width:100%; height:100%; border:0; resize:none; padding:10px; font:13px/1.5 var(--mono); background:var(--code-bg); color:var(--ink) }
.CodeMirror{ height:100%; font:13px/1.5 var(--mono); background:var(--code-bg); color:var(--ink) }
.CodeMirror-gutters{ background:var(--bar); border-right:1px solid var(--line) }
.CodeMirror-linenumber{ color:var(--mut) }
.CodeMirror-cursor{ border-left-color:var(--ink) }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected{ background:rgba(59,130,246,.22) }
/* Scoped under .CodeMirror to win over its default theme (.cm-s-default). */
.CodeMirror .cm-keyword{ color:var(--kw); font-weight:600 } .CodeMirror .cm-string, .CodeMirror .cm-number{ color:var(--str) }
.CodeMirror .cm-comment{ color:var(--com); font-style:italic } .CodeMirror .cm-type{ color:var(--tyc) }
.cm-errmark{ text-decoration:wavy underline var(--err); background:var(--err-bg) }
.cm-flash{ background:rgba(250,204,21,.35) }
#diags{ max-height:30%; overflow:auto; border-top:1px solid var(--line); background:var(--bar); display:none; flex:none }
#diags.on{ display:block }
#diags .d{ padding:5px 12px; border-bottom:1px solid var(--line); cursor:pointer; color:var(--err); font-size:12.5px }
#diags .d:hover{ background:var(--err-bg) }
#diags .d b{ font-family:var(--mono); font-weight:600; margin-right:8px }

/* details panel: slides over the diagram from the right (the default),
   the left or the bottom, as the IDE's settings say */
#drawer{ position:absolute; top:0; right:0; bottom:0; width:var(--dw,460px); max-width:calc(100% - 60px); z-index:8;
  background:var(--bar); border-left:1px solid var(--line); box-shadow:-8px 0 26px var(--shadow);
  display:flex; flex-direction:column; transform:translateX(105%); transition:transform .16s ease-out; visibility:hidden }
body.drawer-left #drawer{ right:auto; left:0; border-left:0; border-right:1px solid var(--line); box-shadow:8px 0 26px var(--shadow); transform:translateX(-105%) }
body.drawer-bottom #drawer{ top:auto; left:0; width:auto; max-width:none; height:var(--dh,40%); max-height:calc(100% - 60px);
  border-left:0; border-top:1px solid var(--line); box-shadow:0 -8px 26px var(--shadow); transform:translateY(105%) }
#drawer.on{ transform:none; visibility:visible }
body.text-mode #drawer{ display:none }
#drawer .grip{ position:absolute; left:-3px; top:0; bottom:0; width:7px; cursor:col-resize; z-index:1 }
body.drawer-left #drawer .grip{ left:auto; right:-3px }
body.drawer-bottom #drawer .grip{ left:0; right:0; top:-3px; bottom:auto; width:auto; height:7px; cursor:row-resize }
#drawer .grip:hover, #drawer .grip.drag{ background:var(--accent); opacity:.5 }
#drawer .dh{ display:flex; align-items:center; gap:6px; height:var(--bar-h); padding:0 6px 0 12px; margin-bottom:6px; flex:none; min-width:0; border-bottom:1px solid var(--line) }
#drawer .dh .name{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
#drawer .dh .loc{ font-size:12px; color:var(--accent); cursor:pointer; white-space:nowrap }
#drawer .dh .loc:hover{ text-decoration:underline }
#drawer .body{ flex:1; overflow:auto; padding:0 12px 12px; min-height:0; display:flex; flex-direction:column; gap:8px }
#drawer h4{ margin:4px 0 0; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut) }
#drawer pre{ margin:0; padding:8px 10px; background:var(--code-bg); border:1px solid var(--line); border-radius:0; overflow:auto;
  font:12px/1.5 var(--mono); tab-size:4; white-space:pre; flex:none }
#drawer .sig{ font:12.5px/1.5 var(--mono); word-break:break-word; padding:8px 10px; background:var(--code-bg); border:1px solid var(--line); border-radius:0}
#drawer a[data-type], #drawer a[data-node]{ color:var(--tyc); text-decoration:none; border-bottom:1px dotted currentColor; cursor:pointer }
#drawer a[data-node]{ color:var(--fn) }
#drawer .impl{ display:flex; flex-direction:column; gap:0 }
#drawer .tabs{ display:flex; flex-wrap:wrap; gap:2px; align-items:flex-end }
#drawer .tabs button{ font-size:12px; height:22px; border-radius:0; color:var(--mut) }
#drawer .tabs button.on{ color:var(--ink); background:none; box-shadow:inset 0 -2px var(--accent) }
#drawer .tabs .src{ margin-left:auto; font-size:11.5px; color:var(--mut); padding:0 4px 3px }
#drawer .note{ color:var(--mut); font-size:12px; margin:0 }
#drawer .doc{ margin:0; white-space:pre-wrap; font-size:13px; line-height:1.5 }
#drawer table{ border-collapse:collapse; width:100%; font-size:12.5px }
#drawer td{ padding:4px 8px; border-top:1px solid var(--line); vertical-align:top }
#drawer td.k{ color:var(--mut); width:1%; white-space:nowrap; font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding-top:6px }
#drawer td code, #drawer .arm code{ font:12px/1.5 var(--mono); word-break:break-word }
#drawer .arms{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:0; overflow:hidden; background:var(--bg) }
#drawer .arm{ display:flex; flex-direction:column; gap:3px; padding:6px 10px; cursor:pointer; border-top:1px solid var(--line) }
#drawer .arm:first-child{ border-top:0 }
#drawer .arm:hover{ background:var(--sel); color:var(--sel-ink) }
#drawer .arm .to{ display:flex; align-items:center; gap:6px; min-width:0; padding-left:12px; color:var(--mut) }
#drawer .arm .to code{ color:var(--ink) }
#drawer .arm .to code.args{ color:var(--fn); margin-left:-4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0 }
#drawer .arm .ty{ color:var(--mut); margin-left:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.tk-fn{ color:var(--fn) } .tk-op{ color:var(--com) }
.tk-kw{ color:var(--kw); font-weight:600 } .tk-str{ color:var(--str) } .tk-com{ color:var(--com); font-style:italic } .tk-num{ color:var(--str) } .tk-ty{ color:var(--tyc) }
</style>
</head>
<body>
<div class="bar">
  <div class="seg"><button id="mDiagram" class="on" title="Diagram view">Diagram</button><button id="mText" title="Source text">Text</button></div>
  <span class="crumb" id="crumb"><span id="crumbT"></span><span class="dot" title="Unsaved (Ctrl/&#8984;+S saves)">&#9679;</span></span>
  <span class="sp"></span>
  <button class="icon letter" id="bIface" title="Show the interface funcs each proc calls">I</button>
  <button class="icon" id="bFit" title="Fit diagram to window"><svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
</div>
<div id="main">
  <section id="diagram" class="on">
    <div id="banner"></div>
    <iframe id="viz" src="/viz?embed=1" title="Diagram"></iframe>
  </section>
  <section id="text">
    <div id="editorWrap"><textarea id="src" spellcheck="false"></textarea></div>
    <div id="diags"></div>
  </section>
  <div id="drawer">
    <div class="grip" id="grip"></div>
    <div class="dh"><span class="badge" id="dKind"></span><span class="name" id="dName"></span><span class="loc" id="dLoc"></span>
      <span class="sp" style="flex:1"></span>
      <button class="icon" id="dOpen" title="Open in new tab"><svg viewBox="0 0 16 16"><path d="M6 3H3.5v9.5H13V10M9 3h4v4M13 3L7.5 8.5"/></svg></button>
      <button class="icon" id="dBack" title="Back"><svg viewBox="0 0 16 16"><path d="M13 8H3M7 4L3 8l4 4"/></svg></button><button class="icon" id="dClose" title="Close (Esc)"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="body" id="dBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<script>
(function(){
'use strict';
var TOKEN = '__VANDORF_TOKEN__';
var $ = function(id){ return document.getElementById(id); };
var embedded = window.parent !== window;
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function up(m){ if (embedded) window.parent.postMessage(m, location.origin); }
function toViz(m){ try { $('viz').contentWindow.postMessage(m, location.origin); } catch (e) {} }

var S = {
  path: null, proc: null, mode: 'diagram', theme: null, active: true,
  saved: '', dirty: false, res: null, good: null, vizReady: false, pendingLine: null,
};

/* ---------- editor ---------- */
var cm = null, marks = [], quiet = false;
if (window.CodeMirror && CodeMirror.defineSimpleMode){
  CodeMirror.defineSimpleMode('vandorf', { start: [
    { regex: /\/\/.*/, token: 'comment' },
    { regex: /"(?:[^\\"]|\\.)*"/, token: 'string' },
    { regex: /\b(?:interface|func|proc|enum|switch|collect|for|each|as|type|else|map|in|id|this)\b/, token: 'keyword' },
    { regex: /\b(?:true|false)\b|-?\b\d+(?:\.\d+)?\b/, token: 'number' },
    { regex: /\b(?:int|float|bool|string|void)\b/, token: 'type' },
  ]});
  cm = CodeMirror.fromTextArea($('src'), {
    mode: 'vandorf', lineNumbers: true, indentWithTabs: true, tabSize: 4, indentUnit: 4,
    extraKeys: { 'Ctrl-S': save, 'Cmd-S': save },
  });
}
var editor = {
  get: function(){ return cm ? cm.getValue() : $('src').value; },
  set: function(s){
    quiet = true;
    if (cm){ var c = cm.getCursor(), sc = cm.getScrollInfo(); cm.setValue(s); cm.setCursor(c); cm.scrollTo(sc.left, sc.top); cm.clearHistory(); }
    else $('src').value = s;
    quiet = false;
  },
  onChange: function(f){ if (cm) cm.on('change', function(){ if (!quiet) f(); }); else $('src').addEventListener('input', f); },
  clearMarks: function(){ marks.forEach(function(m){ m.clear(); }); marks = []; },
  mark: function(from, to){
    if (!cm) return;
    if (from.line === to.line && from.ch === to.ch) to = { line: to.line, ch: to.ch + 1 };
    marks.push(cm.markText(from, to, { className: 'cm-errmark' }));
  },
  jump: function(line, ch){
    if (!cm){ return; }
    cm.refresh(); cm.focus();
    var pos = { line: line, ch: ch || 0 };
    cm.setCursor(pos);
    cm.scrollIntoView({ from: pos, to: { line: Math.min(line + 12, cm.lineCount() - 1), ch: 0 } }, 60);
    var m = cm.markText({ line: line, ch: 0 }, { line: line + 1, ch: 0 }, { className: 'cm-flash' });
    setTimeout(function(){ m.clear(); }, 900);
  },
};

/* ---------- modes ---------- */
function setMode(m, quietly){
  S.mode = m;
  $('mDiagram').classList.toggle('on', m === 'diagram'); $('mText').classList.toggle('on', m === 'text');
  $('diagram').classList.toggle('on', m === 'diagram'); $('text').classList.toggle('on', m === 'text');
  document.body.classList.toggle('text-mode', m === 'text');
  if (m === 'text' && cm) setTimeout(function(){ cm.refresh(); if (S.pendingLine != null){ editor.jump(S.pendingLine); S.pendingLine = null; } }, 0);
  if (!quietly) up({ type: 'ide-tab-state', mode: m });
}
$('mDiagram').onclick = function(){ setMode('diagram'); };
$('mText').onclick = function(){
  // Jump to the shown proc, the first time and whenever it changed.
  var sym = S.proc && sym_(S.proc);
  if (sym && sym.loc && sym.loc.file === S.path && S.pendingLine == null && S.lastJump !== S.proc){ S.pendingLine = sym.loc.line; S.lastJump = S.proc; }
  setMode('text');
};
$('bFit').onclick = function(){ toViz({ type: 'vandorf-fit' }); };
/* Interface visibility: shared by every diagram, like the explorer's ƒ. */
var showIfaces = store('vandorf.viz.ifaces') === '1';
$('bIface').classList.toggle('on', showIfaces);
$('bIface').onclick = function(){
  showIfaces = !showIfaces; store('vandorf.viz.ifaces', showIfaces ? '1' : '0');
  this.classList.toggle('on', showIfaces);
  toViz({ type: 'vandorf-ifaces', on: showIfaces });
  up({ type: 'ide-ifaces', on: showIfaces });
};
/* From the IDE: the settings, or another tab's button. */
function setIfaces(on){
  showIfaces = on; $('bIface').classList.toggle('on', on);
  toViz({ type: 'vandorf-ifaces', on: on });
}

/* ---------- status ---------- */
/* The IDE's status bar shows the active tab's status. */
var lastStatus = { text: '', cls: '' };
function status(text, cls){
  lastStatus = { text: text, cls: cls || '' };
  up({ type: 'ide-status', text: text, cls: cls });
}
$('banner').onclick = function(){ setMode('text'); };

/* ---------- compile ---------- */
var seq = 0, timer = null;
/* The diagram first, without the generated code; then, in the
   background, the code too, only for the status line's "codegen failed". */
function compile(){
  var my = ++seq, source = editor.get();
  status('Compiling…');
  var req = function(previews){
    return fetch('/api/compile', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: S.path, source: source, previews: previews }) }).then(function(r){ return r.json(); });
  };
  req(false).then(function(res){
    if (my !== seq) return;
    show(res);
    if (res.ok) return req(true).then(function(full){ if (my === seq && full.ok) codegenStatus(full); });
  }).catch(function(e){ if (my === seq) status('Network error: ' + e, 'bad'); });
}
function codegenStatus(res){
  var failed = [res.go && res.go.ok === false && res.go.error !== 'not configured in vandorf.toml' ? 'Go' : null,
                res.rust && res.rust.ok === false && res.rust.error !== 'not configured in vandorf.toml' ? 'Rust' : null,
                res.python && res.python.ok === false && res.python.error !== 'not configured in vandorf.toml' ? 'Python' : null].filter(Boolean);
  status('OK' + (failed.length ? ' · ' + failed.join(', ') + ' codegen failed' : ''), failed.length ? 'bad' : 'ok');
}
function show(res){
  S.res = res;
  editor.clearMarks();
  var d = $('diags');
  if (!res.ok){
    var list = res.diagnostics || [];
    var n = list.length || 1;
    status(n + ' error' + (n === 1 ? '' : 's'), 'bad');
    d.innerHTML = list.map(function(x, i){
      var where = (x.here ? '' : x.file + ' ') + (x.from.line + 1) + ':' + (x.from.ch + 1);
      return '<div class="d" data-i="' + i + '"><b>' + esc(where) + '</b>' + esc(x.msg) + '</div>';
    }).join('') || '<div class="d">' + esc(res.error || 'error') + '</div>';
    d.classList.add('on');
    list.forEach(function(x){ if (x.here) editor.mark(x.from, x.to); });
    d.onclick = function(e){
      var el = e.target.closest('.d'); if (!el || el.dataset.i == null) return;
      var x = list[+el.dataset.i];
      if (x.here) editor.jump(x.from.line, x.from.ch);
      else up({ type: 'ide-open', path: x.file, line: x.from.line, mode: 'text' });
    };
    var b = $('banner');
    b.textContent = n + ' error' + (n === 1 ? '' : 's') + (S.good ? ' — showing the last good diagram' : '') + ' · open text';
    b.classList.add('on');
    return;
  }
  d.classList.remove('on'); d.innerHTML = ''; $('banner').classList.remove('on');
  S.good = res;
  codegenStatus(res);
  if (!S.proc || !res.document.grids[S.proc]){
    var mine = procsHere();
    if (S.proc && !res.document.grids[S.proc]) status('proc ' + S.proc + ' is gone', 'bad');
    if (!S.proc && mine.length) setProc(mine[0], true);
  }
  pushDoc();
  if (drawerSel) renderDrawer();
}
function pushDoc(){
  if (!S.good || !S.vizReady) return;
  toViz({ type: 'vandorf-document', document: S.good.document, name: S.path, proc: S.proc });
}

/* ---------- procs of this file ---------- */
function syms(){ return S.good && S.good.symbols ? S.good.symbols : { nodes: {}, types: {} }; }
function sym_(q){ return syms().nodes[q]; }
function procsHere(){
  var n = syms().nodes, out = [];
  Object.keys(n).forEach(function(q){ if (n[q].kind === 'proc' && n[q].loc && n[q].loc.file === S.path) out.push(q); });
  out.sort(function(a, b){ return n[a].loc.line - n[b].loc.line; });
  return out;
}
function setProc(q, quietly){
  S.proc = q;
  crumb();
  if (!quietly) toViz({ type: 'vandorf-show-proc', proc: q });
  up({ type: 'ide-tab-state', proc: q });
}
function crumb(){ $('crumbT').textContent = S.path || ''; $('crumb').title = S.path || ''; }

/* ---------- saving ---------- */
function setDirty(d){
  S.dirty = d; $('crumb').classList.toggle('dirty', d);
}
function save(){
  if (!S.path) return;
  var text = editor.get();
  status('Saving…');
  fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vandorf-Token': TOKEN },
    body: JSON.stringify({ path: S.path, source: text }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok){ status('Save failed: ' + res.error, 'bad'); return; }
      S.saved = text; setDirty(false);
      status('Saved ' + S.path, 'ok');
      up({ type: 'ide-saved', path: S.path, text: text });
    })
    .catch(function(e){ status('Save failed: ' + e, 'bad'); });
}
document.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); save(); }
  if (e.key === 'Escape' && $('drawer').classList.contains('on')) closeDrawer();
});
editor.onChange(function(){
  var text = editor.get(), dirty = text !== S.saved;
  setDirty(dirty);
  up({ type: 'ide-buffer', path: S.path, text: text, dirty: dirty });
  clearTimeout(timer); timer = setTimeout(compile, 450);
});

/* ---------- preview drawer ---------- */
var drawerSel = null, history_ = [];
var dw = +store('vandorf.viewer.drawerW') || 460, dh = +store('vandorf.viewer.drawerH') || 0, drawerSide = 'right';
$('drawer').style.setProperty('--dw', dw + 'px');
if (dh) $('drawer').style.setProperty('--dh', dh + 'px');
/* The side it slides from: the IDE's setting, shared by every tab. */
function setDrawerSide(side){
  drawerSide = side === 'left' || side === 'bottom' ? side : 'right';
  document.body.classList.toggle('drawer-left', drawerSide === 'left');
  document.body.classList.toggle('drawer-bottom', drawerSide === 'bottom');
}
setDrawerSide(store('vandorf.ide.drawerSide'));
(function(){
  var g = $('grip');
  g.addEventListener('pointerdown', function(e){
    e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add('drag');
    // The diagram iframe would swallow the drag.
    $('viz').style.pointerEvents = 'none';
    var x0 = e.clientX, y0 = e.clientY, w0 = $('drawer').offsetWidth, h0 = $('drawer').offsetHeight;
    // Its inner edge follows the pointer: its width at a side, its height at the bottom.
    function mv(ev){
      if (drawerSide === 'bottom'){ dh = Math.max(120, h0 + (y0 - ev.clientY)); $('drawer').style.setProperty('--dh', dh + 'px'); return; }
      dw = Math.max(280, w0 + (drawerSide === 'left' ? ev.clientX - x0 : x0 - ev.clientX)); $('drawer').style.setProperty('--dw', dw + 'px');
    }
    function done(){ g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', done); g.classList.remove('drag');
      $('viz').style.pointerEvents = ''; store('vandorf.viewer.drawerW', dw); if (dh) store('vandorf.viewer.drawerH', dh); }
    g.addEventListener('pointermove', mv); g.addEventListener('pointerup', done);
  });
})();
function openDrawer(sel, push){
  if (push && drawerSel) history_.push(drawerSel);
  drawerSel = sel; renderDrawer();
  $('drawer').classList.add('on');
}
/* fromViz: the diagram already dropped its selection. */
function closeDrawer(fromViz){
  $('drawer').classList.remove('on');
  toViz({ type: 'vandorf-highlight', id: null });
  if (!fromViz) toViz({ type: 'vandorf-clear-selection' });
  drawerSel = null; history_ = [];
}
$('dClose').onclick = function(){ closeDrawer(); };
$('dBack').onclick = function(){ if (history_.length){ drawerSel = history_.pop(); renderDrawer(); } };

/* Resolves a name as written inside grid `owner` to a symbol: a local of the
   owner or of an enclosing proc, else a global (interface funcs are qualified). */
function resolveNode(name, owner){
  var n = syms().nodes;
  if (!name) return null;
  var parts = owner ? owner.split('.') : [];
  for (var i = parts.length; i >= 0; i--){
    var q = parts.slice(0, i).concat([name]).join('.');
    if (n[q]) return q;
  }
  return null;
}
function instanceOf(sub){ var m = /^instance of (.+)$/.exec(sub || ''); return m ? m[1] : null; }

/* Typedef names appearing in a type expression, longest first so `R<int>` wins over `R`. */
function typesIn(s){
  var t = syms().types, found = [];
  if (!s) return found;
  Object.keys(t).sort(function(a, b){ return b.length - a.length; }).forEach(function(name){
    var re = new RegExp('(^|[^\\w<])' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\w<])');
    if (re.test(s) && found.indexOf(name) < 0) found.push(name);
  });
  return found;
}
/* Type text with typedef names as links. */
function linkTypes(s){
  var names = typesIn(s);
  if (!names.length) return esc(s);
  var re = new RegExp('(' + names.map(function(n){ return n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')(?![\\w<])', 'g');
  var out = '', last = 0, m;
  while ((m = re.exec(s))){
    var before = s[m.index - 1];
    if (before && /[\w<]/.test(before) && before !== '<'){ continue; }
    out += esc(s.slice(last, m.index)) + '<a data-type="' + esc(m[1]) + '">' + esc(m[1]) + '</a>';
    last = m.index + m[1].length;
  }
  return out + esc(s.slice(last));
}
/* `{ a: int, b: X }` / `enum { A, B(int) }` laid out one member per line. */
function prettyType(def){
  var m = /^(enum )?\{ (.*) \}$/.exec(def);
  if (!m) return def;
  var body = m[2], parts = [], depth = 0, cur = '';
  for (var i = 0; i < body.length; i++){
    var c = body[i];
    if (c === '{' || c === '(' || c === '[' || c === '<') depth++;
    if (c === '}' || c === ')' || c === ']' || c === '>') depth--;
    if (c === ',' && depth === 0){ parts.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  if (cur.trim()) parts.push(cur.trim());
  return (m[1] || '') + '{\n' + parts.map(function(p){ return '\t' + p + ','; }).join('\n') + '\n}';
}

function locLink(loc){
  if (!loc || !loc.file) return '';
  return (loc.file === S.path ? '' : loc.file.split('/').pop() + ':') + 'line ' + (loc.line + 1);
}
var BADGE = { proc: 'P', func: 'ƒ', type: 'T', interface: 'I', edge: 'E', switch: '◇', builtin: 'B', none: 'i' };
var EDGE_KIND = { call: 'calls', match: 'match arm', expand: 'expands', continue: 'continues', collect: 'collects', spawn: 'spawns', join: 'joins', pass: 'passes on' };
function nodeRef(n){
  if (!n) return '';
  var k = n.kind === 'proc' ? 'proc' : n.kind === 'func' ? (n.iface ? 'interface' : 'func') : null;
  return (k ? '<span class="badge ' + k + '">' + BADGE[k] + '</span>' : '') + '<code>' + esc(n.label || '?') + '</code>';
}
/* A declaration's doc comment, as written (its line breaks kept). */
function docP(doc){ return doc ? '<p class="doc">' + esc(doc) + '</p>' : ''; }
function row(k, v){ return v ? '<tr><td class="k">' + esc(k) + '</td><td>' + v + '</td></tr>' : ''; }

function renderDrawer(){
  var sel = drawerSel || { kind: 'none' };
  var body = '', kind = sel.kind, name = '', loc = null, n = syms().nodes, openQ = null;
  $('dBack').style.display = history_.length ? '' : 'none';
  if (kind === 'type'){
    var t = syms().types[sel.name];
    name = sel.name;
    body = t ? '<pre><span class="tk-kw">type</span> ' + esc(sel.name) + ' = ' + linkTypes(prettyType(t.def)) + ';</pre>' + docP(t.doc) +
      (t.recursive ? '<p class="note">Recursive: fields that contain it are boxed in generated code.</p>' : '')
      : '<p class="note">Unknown type.</p>';
  } else if (kind === 'func' || kind === 'proc'){
    var label = sel.label;
    var q = kind === 'proc' && sel.grid && n[sel.grid] ? sel.grid : (resolveNode(label, sel.owner) || resolveNode(instanceOf(sel.sublabel), sel.owner));
    if (!q && label === 'id'){
      kind = 'builtin'; name = 'id';
      body = '<div class="sig"><span class="tk-kw">id</span>(value)</div><p class="note">Built in: ends the proc with <code>value</code>, checked against the proc’s return type.</p>' +
        (sel.call ? '<h4>Receives</h4><div class="sig">' + linkTypes(sel.call) + '</div>' : '');
    } else if (!q){
      name = label || '?';
      body = '<p class="note">No symbol found for <b>' + esc(label) + '</b>' + (sel.owner ? ' in ' + esc(sel.owner) : '') + '.</p>';
    } else {
      var s = n[q]; kind = s.kind; name = q; loc = s.loc;
      var inst = instanceOf(sel.sublabel);
      body = '<div class="sig"><span class="tk-kw">' + s.kind + '</span> ' + esc(q) + '(' + linkTypes(s.params) + '): ' + linkTypes(s.ret) + '</div>' +
        docP(s.doc || sel.doc) +
        (inst && sel.label ? '<p class="note">Shown as <b>' + esc(sel.label) + '</b>: a separate instance (<code>as ' + esc(sel.label) + '</code>).</p>' : '');
      if (s.kind === 'func'){
        if (!s.imps.length) body += '<p class="note">No implementation named (an interface func, or stubbed).</p>';
        else {
          body += '<div class="impl"><div class="tabs">' + s.imps.map(function(im, i){
            return '<button data-imp="' + i + '" class="' + (i === (sel.imp || 0) ? 'on' : '') + '">' + esc(im.written + ':' + im.function) + '</button>';
          }).join('') + '<span class="src" id="impSrc"></span></div><pre id="impCode">Loading…</pre></div>';
          setTimeout(function(){ loadImpl(s.imps[sel.imp || 0]); }, 0);
        }
      } else {
        openQ = q;
        body += '<pre id="sysCode">Loading…</pre>';
        setTimeout(function(){ loadSys(s.loc); }, 0);
      }
    }
  } else if (kind === 'edge'){
    name = (sel.from && sel.from.label || '?') + ' → ' + (sel.to && sel.to.label || '?');
    body = (sel.edgeLabel ? '<h4>When</h4><div class="sig">' + hlSys(sel.edgeLabel) + '</div>' : '') +
      '<h4>Call</h4><div class="sig">' + hlSys(sel.callText || sel.call || '') + '</div>';
  } else if (kind === 'switch'){
    var arms = sel.arms || [];
    name = 'switch on ' + (sel.from && sel.from.label || '?');
    body = (sel.valueType ? '<div class="sig">' + linkTypes(sel.valueType) + '</div>' : '') +
      '<h4>' + arms.length + ' arm' + (arms.length === 1 ? '' : 's') + '</h4>' +
      '<div class="arms">' + arms.map(function(a, i){
        return '<div class="arm" data-arm="' + i + '"><code>' + hlSys(a.edgeLabel || '_') + '</code>' +
          '<span class="to"><span class="tk-op">\u2192</span> <code>' + hlSys(a.callText || (a.to && a.to.label) || '?') + '</code></span></div>';
      }).join('') + '</div>';
  } else {
    kind = 'none'; name = 'Preview';
    body = '<p class="note">Click a func, proc, edge or switch in the diagram to preview it. Shift+click a proc to select it without expanding; Ctrl/⌘+click to open it in a new tab.</p>';
  }
  if (kind === 'func' && sel.iface) kind = 'interface';
  $('dKind').className = 'badge ' + kind; $('dKind').textContent = BADGE[kind] || '?';
  $('dName').textContent = name;
  $('dLoc').textContent = locLink(loc); $('dLoc').onclick = function(){ goLoc(loc); };
  $('dOpen').style.display = openQ ? '' : 'none';
  $('dOpen').onclick = function(){ up({ type: 'ide-open', proc: openQ, newTab: true, mode: 'diagram' }); };
  $('dBody').innerHTML = body;
}
$('dBody').addEventListener('click', function(e){
  var a = e.target.closest('a[data-type]');
  if (a){ openDrawer({ kind: 'type', name: a.dataset.type }, true); return; }
  var nd = e.target.closest('a[data-node]');
  if (nd){ var s = sym_(nd.dataset.node); openDrawer({ kind: s ? s.kind : 'func', label: nd.dataset.node, grid: nd.dataset.node }, true); return; }
  var b = e.target.closest('button[data-imp]');
  if (b){ drawerSel.imp = +b.dataset.imp; renderDrawer(); return; }
  var arm = e.target.closest('.arm');
  if (arm && drawerSel && drawerSel.arms){
    var x = drawerSel.arms[+arm.dataset.arm];
    toViz({ type: 'vandorf-highlight', id: null });
    openDrawer({ kind: 'edge', id: x.id, edgeType: 'match', edgeLabel: x.edgeLabel, args: x.args, callText: x.callText, valueType: x.valueType, call: x.call,
                 owner: drawerSel.owner, from: drawerSel.from, to: x.to }, true);
  }
});
/* Hovering an arm lights it up in the diagram, with its tooltip. */
$('dBody').addEventListener('mouseover', function(e){
  var arm = e.target.closest('.arm');
  if (!arm || !drawerSel || !drawerSel.arms || arm === hotArm) return;
  hotArm = arm;
  toViz({ type: 'vandorf-highlight', id: drawerSel.arms[+arm.dataset.arm].id });
});
$('dBody').addEventListener('mouseout', function(e){
  if (!hotArm || (e.relatedTarget && hotArm.contains(e.relatedTarget))) return;
  hotArm = null; toViz({ type: 'vandorf-highlight', id: null });
});
var hotArm = null;
function goLoc(loc){
  if (!loc || !loc.file) return;
  if (loc.file === S.path){ S.pendingLine = loc.line; setMode('text'); }
  else up({ type: 'ide-open', path: loc.file, line: loc.line, mode: 'text' });
}

/* A proc's .sys source, from its declaration line to its closing brace. */
function loadSys(loc){
  var el = $('sysCode'); if (!el) return;
  if (!loc || !loc.file){ el.textContent = 'Source location unknown.'; return; }
  var got = loc.file === S.path ? Promise.resolve({ ok: true, source: editor.get() })
    : fetch('/api/source?path=' + encodeURIComponent(loc.file)).then(function(r){ return r.json(); });
  got.then(function(res){
    var el2 = $('sysCode'); if (!el2) return;
    if (!res.ok){ el2.textContent = res.error; return; }
    var text = sysBlock(res.source, loc.line);
    el2.innerHTML = text ? highlight(text, 'sys') : esc('// not found at line ' + (loc.line + 1));
  });
}
function sysBlock(src, line){
  var lines = src.split('\n');
  if (line >= lines.length) return null;
  var start = 0;
  for (var i = 0; i < line; i++) start += lines[i].length + 1;
  var i = src.indexOf('{', start), depth = 0;
  if (i < 0) return null;
  for (; i < src.length; i++){
    var c = src[i];
    if (c === '"'){ i++; while (i < src.length && src[i] !== '"'){ if (src[i] === '\\') i++; i++; } continue; }
    if (c === '/' && src[i + 1] === '/'){ i = src.indexOf('\n', i); if (i < 0) break; continue; }
    if (c === '{') depth++;
    if (c === '}' && --depth === 0) break;
  }
  // Leading tabs of the declaration come off every line.
  var block = src.slice(start, i + 1), ind = /^[\t ]*/.exec(block)[0];
  return ind ? block.split('\n').map(function(l){ return l.indexOf(ind) === 0 ? l.slice(ind.length) : l; }).join('\n') : block;
}

/* Implementation snippets: the function out of its file, by brace matching. */
var fileCache = {};
function loadImpl(im){
  var el = $('impCode'); if (!el) return;
  if (!im.path){ el.textContent = 'The implementation file is outside the source directory: ' + im.written; return; }
  var p = fileCache[im.path] || (fileCache[im.path] = fetch('/api/source?path=' + encodeURIComponent(im.path)).then(function(r){ return r.json(); }));
  p.then(function(res){
    var el2 = $('impCode'); if (!el2) return;
    if (!res.ok){ delete fileCache[im.path]; el2.textContent = res.error; return; }
    var snip = extract(res.source, im.function, im.lang);
    el2.innerHTML = snip ? highlight(snip.text, im.lang) : esc('// ' + im.function + ' not found in ' + im.path);
    var src = $('impSrc'); if (src) src.textContent = snip ? im.path + ':' + (snip.line + 1) : '';
  });
}
function extract(src, fn, lang){
  var name = fn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  var re = lang === 'go'
    ? new RegExp('^func\\s+(?:\\([^)]*\\)\\s*)?' + name + '\\s*[\\[(]', 'm')
    : new RegExp('^[ \\t]*(?:pub(?:\\([^)]*\\))?\\s+)?(?:const\\s+|async\\s+|unsafe\\s+)*fn\\s+' + name + '\\b', 'm');
  var m = re.exec(src);
  if (!m) return null;
  var start = m.index;
  // Pull in the doc comments and attributes right above it.
  var lines = src.slice(0, start).split('\n'); lines.pop();
  var pre = 0;
  for (var i = lines.length - 1; i >= 0; i--){
    if (/^\s*(\/\/|#\[)/.test(lines[i])) pre += lines[i].length + 1; else break;
  }
  start -= pre;
  var i = src.indexOf('{', m.index), depth = 0;
  if (i < 0) return null;
  for (; i < src.length; i++){
    var c = src[i];
    if (c === '"'){ i++; while (i < src.length && src[i] !== '"'){ if (src[i] === '\\') i++; i++; } continue; }
    if (c === '`' && lang === 'go'){ i = src.indexOf('`', i + 1); if (i < 0) break; continue; }
    if (c === "'" && src[i + 2] === "'"){ i += 2; continue; }
    if (c === "'" && src[i + 1] === '\\'){ i = src.indexOf("'", i + 2); if (i < 0) break; continue; }
    if (c === '/' && src[i + 1] === '/'){ i = src.indexOf('\n', i); if (i < 0) break; continue; }
    if (c === '/' && src[i + 1] === '*'){ i = src.indexOf('*/', i + 2); if (i < 0) break; i++; continue; }
    if (c === '{') depth++;
    if (c === '}' && --depth === 0) break;
  }
  return { text: src.slice(start, i + 1), line: src.slice(0, start).split('\n').length - 1 };
}
// Tokens of a .sys expression for highlighting: [[text, class|null], ..].
function sysTokens(s){
  var re = /("(?:[^"\\]|\\.)*")|\b(else|in|id|this|true|false|as|switch)\b|\b(\d+(?:\.\d+)?)\b|\b([A-Z]\w*)(?=\s*\()|\b([A-Z]\w*)\b|(→|⇒|==|!=|<=|>=|&&|\|\||[=!<>+\-*\/|])/g;
  var out = [], last = 0, m;
  while ((m = re.exec(s))){
    if (m.index > last) out.push([s.slice(last, m.index), null]);
    out.push([m[0], m[1] ? 'str' : m[2] ? 'kw' : m[3] ? 'num' : m[4] ? 'fn' : m[5] ? 'ty' : 'op']);
    last = m.index + m[0].length;
  }
  if (last < s.length) out.push([s.slice(last), null]);
  return out;
}
// A .sys expression with syntax colors.
function hlSys(s){
  return sysTokens(s).map(function(t){ return t[1] ? '<span class="tk-' + t[1] + '">' + esc(t[0]) + '</span>' : esc(t[0]); }).join('');
}
function highlight(s, lang){
  var kw = lang === 'sys'
    ? 'interface|func|proc|enum|switch|collect|for|each|as|type|else|map|in|id|this|true|false'
    : lang === 'go'
    ? 'func|return|if|else|for|range|var|const|type|struct|interface|map|switch|case|default|break|continue|nil|true|false|package|import|go|defer|chan|select'
    : 'fn|let|mut|return|if|else|for|in|while|loop|match|impl|pub|struct|enum|use|mod|crate|self|Self|super|as|ref|move|where|true|false|const|static|break|continue|dyn|unsafe';
  var re = new RegExp('(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:[^"\\\\]|\\\\.)*"|`[^`]*`)|\\b(' + kw + ')\\b|\\b(\\d+(?:\\.\\d+)?)\\b|\\b([A-Z]\\w*)\\b', 'g');
  var out = '', last = 0, m;
  while ((m = re.exec(s))){
    out += esc(s.slice(last, m.index));
    var cls = m[1] ? 'tk-com' : m[2] ? 'tk-str' : m[3] ? 'tk-kw' : m[4] ? 'tk-num' : 'tk-ty';
    out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

/* ---------- messages ---------- */
window.addEventListener('message', function(e){
  if (e.origin !== location.origin || !e.data || typeof e.data.type !== 'string') return;
  var m = e.data;
  if (e.source === $('viz').contentWindow){
    if (m.type === 'vandorf-viz-ready'){ S.vizReady = true; if (S.theme) toViz({ type: 'vandorf-theme', theme: S.theme }); toViz({ type: 'vandorf-ifaces', on: showIfaces }); pushDoc(); }
    if (m.type === 'vandorf-open-proc') up({ type: 'ide-open', proc: m.proc, newTab: true, mode: 'diagram' });
    if (m.type === 'vandorf-select'){
      // Clicking off everything deselects, and the panel goes with it.
      if (!m.kind){ closeDrawer(true); return; }
      history_ = [];
      openDrawer(m, false);
    }
    if (m.type === 'vandorf-proc-shown' && m.proc && m.proc !== S.proc){ S.proc = m.proc; up({ type: 'ide-tab-state', proc: m.proc }); }
    return;
  }
  switch (m.type){
  case 'ide-init':
    init(m.path, m.proc, m.mode, m.line, m.buffer);
    if (m.theme) theme(m.theme);
    break;
  case 'vandorf-theme': theme(m.theme); break;
  case 'ide-ifaces': if (!!m.on !== showIfaces) setIfaces(!!m.on); break;
  case 'ide-drawer-side': setDrawerSide(m.side); break;
  case 'ide-goto':
    if (m.mode) setMode(m.mode, false);
    if (m.line != null){ S.pendingLine = m.line; if (S.mode === 'text') { editor.jump(m.line); S.pendingLine = null; } else setMode('text'); }
    break;
  case 'ide-buffer':
    if (m.text !== editor.get()){ editor.set(m.text); clearTimeout(timer); timer = setTimeout(compile, 300); }
    if (!m.dirty) S.saved = m.text;
    setDirty(m.dirty);
    break;
  case 'ide-activate':
    S.active = true;
    // Re-announce the status: the IDE shows only the active tab's.
    up({ type: 'ide-status', text: lastStatus.text, cls: lastStatus.cls });
    if (S.mode === 'text' && cm) setTimeout(function(){ cm.refresh(); }, 0);
    break;
  }
});
function theme(t){
  S.theme = t; document.documentElement.setAttribute('data-theme', t);
  toViz({ type: 'vandorf-theme', theme: t });
}

function init(path, proc, mode, line, buffer){
  S.path = path; S.proc = proc || null; crumb();
  setMode(mode || (proc ? 'diagram' : 'text'), true);
  if (line != null) S.pendingLine = line;
  fetch('/api/source?path=' + encodeURIComponent(path)).then(function(r){ return r.json(); }).then(function(res){
    if (!res.ok){ status(res.error, 'bad'); return; }
    S.saved = res.source;
    editor.set(buffer != null ? buffer : res.source);
    setDirty(buffer != null && buffer !== res.source);
    if (S.mode === 'text' && S.pendingLine != null){ setTimeout(function(){ editor.jump(S.pendingLine); S.pendingLine = null; }, 0); }
    compile();
  }).catch(function(e){ status('Cannot load ' + path + ': ' + e, 'bad'); });
}

/* The renderer may have announced itself before this script ran (it loads
   while the CDN scripts above block), so its load event counts as ready too. */
function vizLoaded(){
  if (S.vizReady) return;
  S.vizReady = true;
  if (S.theme) toViz({ type: 'vandorf-theme', theme: S.theme });
  toViz({ type: 'vandorf-ifaces', on: showIfaces });
  pushDoc();
}
$('viz').addEventListener('load', vizLoaded);
try { if ($('viz').contentDocument.readyState === 'complete' && $('viz').contentWindow.location.pathname === '/viz') vizLoaded(); } catch (e) {}

if (embedded){
  up({ type: 'viewer-ready' });
} else {
  var q = new URLSearchParams(location.search);
  if (q.get('path')) init(q.get('path'), q.get('proc'), q.get('mode'), null, null);
  else status('Open /viewer?path=<file.sys>&proc=<Proc>', 'bad');
}
})();
</script>
</body>
