<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
:root{
  --bg:#ffffff; --bar:#f6f8fb; --ink:#0f172a; --mut:#64748b; --line:#dde3ec; --hover:#e8eef7;
  --accent:#1f6feb; --accent-ink:#fff; --err:#c62828; --err-bg:#fdecec; --ok:#1b7f3b; --dirty:#e07b00;
  --code-bg:#fbfcfe; --kw:#7c3aed; --str:#b45309; --com:#94a3b8; --type:#0e7490; --fn:#1d4ed8; --shadow:rgba(15,23,42,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1420; --bar:#0e1624; --ink:#dbe6f4; --mut:#8aa2bf; --line:#22324a; --hover:#172640;
    --accent:#3b82f6; --accent-ink:#fff; --err:#ff8a80; --err-bg:#3a1618; --ok:#5fd38d; --dirty:#fbbf24;
    --code-bg:#0e1624; --kw:#c4b5fd; --str:#fbbf24; --com:#5b6f8a; --type:#67e8f9; --fn:#93c5fd; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1420; --bar:#0e1624; --ink:#dbe6f4; --mut:#8aa2bf; --line:#22324a; --hover:#172640;
  --accent:#3b82f6; --accent-ink:#fff; --err:#ff8a80; --err-bg:#3a1618; --ok:#5fd38d; --dirty:#fbbf24;
  --code-bg:#0e1624; --kw:#c4b5fd; --str:#fbbf24; --com:#5b6f8a; --type:#67e8f9; --fn:#93c5fd; --shadow:rgba(0,0,0,.5);
}
*{ box-sizing:border-box }
html,body{ height:100%; margin:0; overflow:hidden }
body{ background:var(--bg); color:var(--ink); font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column }
button,select{ font:inherit; color:var(--ink); background:none; border:1px solid transparent; border-radius:6px; padding:3px 9px; cursor:pointer }
button:hover{ background:var(--hover) }
select{ border-color:var(--line); background:var(--bg); max-width:260px }
.bar{ display:flex; align-items:center; gap:6px; height:34px; padding:0 8px; border-bottom:1px solid var(--line); background:var(--bar); flex:none; white-space:nowrap; overflow-x:auto; overflow-y:hidden }
.seg{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; flex:none }
.seg button{ border:0; border-radius:0; padding:3px 12px }
.seg button.on{ background:var(--accent); color:var(--accent-ink) }
.crumb{ color:var(--mut); overflow:hidden; text-overflow:ellipsis; font-size:12px }
.sp{ flex:1 }
#status{ font-size:12px; color:var(--mut) } #status.ok{ color:var(--ok) } #status.bad{ color:var(--err); cursor:pointer }
#bSave{ color:var(--dirty); font-weight:600; display:none } #bSave.on{ display:inline-block }
#main{ flex:1; position:relative; min-height:0 }
#diagram, #text{ position:absolute; inset:0; display:none }
#diagram.on, #text.on{ display:flex; flex-direction:column }
#viz{ flex:1; border:0; width:100%; background:var(--bg) }
#banner{ position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:5; background:var(--err-bg); color:var(--err);
  border:1px solid var(--err); border-radius:8px; padding:4px 12px; font-size:12px; cursor:pointer; display:none; box-shadow:0 4px 14px var(--shadow) }
#banner.on{ display:block }

/* text mode */
#editorWrap{ flex:1; min-height:0; position:relative }
#editorWrap textarea{ width:100%; height:100%; border:0; resize:none; padding:10px; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--code-bg); color:var(--ink) }
.CodeMirror{ height:100%; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--code-bg); color:var(--ink) }
.CodeMirror-gutters{ background:var(--bar); border-right:1px solid var(--line) }
.CodeMirror-linenumber{ color:var(--mut) }
.CodeMirror-cursor{ border-left-color:var(--ink) }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected{ background:rgba(59,130,246,.22) }
.cm-keyword{ color:var(--kw); font-weight:600 } .cm-string, .cm-number{ color:var(--str) }
.cm-comment{ color:var(--com); font-style:italic } .cm-type{ color:var(--type) }
.cm-errmark{ text-decoration:wavy underline var(--err); background:var(--err-bg) }
.cm-flash{ background:rgba(250,204,21,.35) }
#diags{ max-height:30%; overflow:auto; border-top:1px solid var(--line); background:var(--bar); display:none; flex:none }
#diags.on{ display:block }
#diags .d{ padding:5px 12px; border-bottom:1px solid var(--line); cursor:pointer; color:var(--err); font-size:12.5px }
#diags .d:hover{ background:var(--err-bg) }
#diags .d b{ font-family:ui-monospace,monospace; font-weight:600; margin-right:8px }

/* preview drawer: pops up over the bottom of the diagram */
#drawer{ position:absolute; left:10px; right:10px; bottom:0; height:var(--dh,240px); max-height:calc(100% - 40px); z-index:8;
  background:var(--bar); border:1px solid var(--line); border-bottom:0; border-radius:10px 10px 0 0; box-shadow:0 -8px 26px var(--shadow);
  display:flex; flex-direction:column; transform:translateY(105%); transition:transform .16s ease-out; visibility:hidden }
#drawer.on{ transform:none; visibility:visible }
body.text-mode #drawer{ display:none }
body.text-mode #bPrev{ display:none }
#drawer .grip{ height:7px; cursor:row-resize; flex:none; display:flex; justify-content:center; align-items:center }
#drawer .grip::before{ content:""; width:40px; height:3px; border-radius:2px; background:var(--line) }
#drawer .dh{ display:flex; align-items:center; gap:8px; padding:0 8px 6px 12px; flex:none; min-width:0 }
#drawer .dh .k{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:#fff; border-radius:4px; padding:1px 5px; flex:none }
.k.func{ background:#1d6fd8 } .k.proc{ background:#e07b00 } .k.type{ background:#0e7490 } .k.edge{ background:#64748b } .k.builtin{ background:#7c3aed }
#drawer .dh .name{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
#drawer .dh .loc{ font-size:12px; color:var(--accent); cursor:pointer; white-space:nowrap }
#drawer .dh .loc:hover{ text-decoration:underline }
#drawer .body{ flex:1; overflow:auto; padding:0 12px 12px; min-height:0 }
#drawer h4{ margin:10px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut) }
#drawer pre{ margin:0; padding:8px 10px; background:var(--code-bg); border:1px solid var(--line); border-radius:7px; overflow:auto;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; tab-size:4; white-space:pre }
#drawer .sig{ font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-word }
#drawer a[data-type], #drawer a[data-node]{ color:var(--type); text-decoration:none; border-bottom:1px dotted currentColor; cursor:pointer }
#drawer a[data-node]{ color:var(--fn) }
#drawer .tabs{ display:flex; gap:2px; margin:10px 0 4px }
#drawer .tabs button{ font-size:12px; padding:2px 9px; border-radius:5px 5px 0 0; color:var(--mut) }
#drawer .tabs button.on{ color:var(--ink); box-shadow:inset 0 -2px var(--accent) }
#drawer .cols{ display:grid; grid-template-columns:minmax(260px,1fr) minmax(260px,1.4fr); gap:14px }
#drawer .note{ color:var(--mut); font-size:12px }
#drawer .acts{ display:flex; gap:6px; margin-top:10px }
#drawer .acts button{ border-color:var(--line); font-size:12px }
.tk-kw{ color:var(--kw); font-weight:600 } .tk-str{ color:var(--str) } .tk-com{ color:var(--com); font-style:italic } .tk-num{ color:var(--str) } .tk-ty{ color:var(--type) }
@media (max-width: 760px){ #drawer .cols{ grid-template-columns:1fr } }
</style>
</head>
<body>
<div class="bar">
  <div class="seg"><button id="mDiagram" class="on" title="Diagram view">Diagram</button><button id="mText" title="Source text">Text</button></div>
  <select id="procSel" title="Proc shown in the diagram"></select>
  <span class="crumb" id="crumb"></span>
  <span class="sp"></span>
  <span id="status"></span>
  <button id="bSave" title="Save (Ctrl/⌘+S)">● Save</button>
  <button id="bPrev" title="Preview drawer (types and implementations)">Preview</button>
  <button id="bFit" title="Fit diagram to window">⤢</button>
</div>
<div id="main">
  <section id="diagram" class="on">
    <div id="banner"></div>
    <iframe id="viz" src="/viz?embed=1" title="Diagram"></iframe>
  </section>
  <section id="text">
    <div id="editorWrap"><textarea id="src" spellcheck="false"></textarea></div>
    <div id="diags"></div>
  </section>
  <div id="drawer">
    <div class="grip" id="grip"></div>
    <div class="dh"><span class="k" id="dKind"></span><span class="name" id="dName"></span><span class="loc" id="dLoc"></span>
      <span class="sp"></span><button id="dBack" title="Back">←</button><button id="dClose" title="Close (Esc)">✕</button></div>
    <div class="body" id="dBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<script>
(function(){
'use strict';
var TOKEN = '__VANDORF_TOKEN__';
var $ = function(id){ return document.getElementById(id); };
var embedded = window.parent !== window;
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function up(m){ if (embedded) window.parent.postMessage(m, location.origin); }
function toViz(m){ try { $('viz').contentWindow.postMessage(m, location.origin); } catch (e) {} }

var S = {
  path: null, proc: null, mode: 'diagram', theme: null, active: true,
  saved: '', dirty: false, res: null, good: null, vizReady: false, pendingLine: null,
};

/* ---------- editor ---------- */
var cm = null, marks = [], quiet = false;
if (window.CodeMirror && CodeMirror.defineSimpleMode){
  CodeMirror.defineSimpleMode('vandorf', { start: [
    { regex: /\/\/.*/, token: 'comment' },
    { regex: /"(?:[^\\"]|\\.)*"/, token: 'string' },
    { regex: /\b(?:interface|func|proc|enum|switch|collect|for|each|as|type|else|map|in|id|this)\b/, token: 'keyword' },
    { regex: /\b(?:true|false)\b|-?\b\d+(?:\.\d+)?\b/, token: 'number' },
    { regex: /\b(?:int|float|bool|string|void)\b/, token: 'type' },
  ]});
  cm = CodeMirror.fromTextArea($('src'), {
    mode: 'vandorf', lineNumbers: true, indentWithTabs: true, tabSize: 4, indentUnit: 4,
    extraKeys: { 'Ctrl-S': save, 'Cmd-S': save },
  });
}
var editor = {
  get: function(){ return cm ? cm.getValue() : $('src').value; },
  set: function(s){
    quiet = true;
    if (cm){ var c = cm.getCursor(), sc = cm.getScrollInfo(); cm.setValue(s); cm.setCursor(c); cm.scrollTo(sc.left, sc.top); cm.clearHistory(); }
    else $('src').value = s;
    quiet = false;
  },
  onChange: function(f){ if (cm) cm.on('change', function(){ if (!quiet) f(); }); else $('src').addEventListener('input', f); },
  clearMarks: function(){ marks.forEach(function(m){ m.clear(); }); marks = []; },
  mark: function(from, to){
    if (!cm) return;
    if (from.line === to.line && from.ch === to.ch) to = { line: to.line, ch: to.ch + 1 };
    marks.push(cm.markText(from, to, { className: 'cm-errmark' }));
  },
  jump: function(line, ch){
    if (!cm){ return; }
    cm.refresh(); cm.focus();
    var pos = { line: line, ch: ch || 0 };
    cm.setCursor(pos);
    cm.scrollIntoView({ from: pos, to: { line: Math.min(line + 12, cm.lineCount() - 1), ch: 0 } }, 60);
    var m = cm.markText({ line: line, ch: 0 }, { line: line + 1, ch: 0 }, { className: 'cm-flash' });
    setTimeout(function(){ m.clear(); }, 900);
  },
};

/* ---------- modes ---------- */
function setMode(m, quietly){
  S.mode = m;
  $('mDiagram').classList.toggle('on', m === 'diagram'); $('mText').classList.toggle('on', m === 'text');
  $('diagram').classList.toggle('on', m === 'diagram'); $('text').classList.toggle('on', m === 'text');
  document.body.classList.toggle('text-mode', m === 'text');
  $('bFit').style.display = m === 'diagram' ? '' : 'none';
  $('procSel').style.display = m === 'diagram' ? '' : 'none';
  if (m === 'text' && cm) setTimeout(function(){ cm.refresh(); if (S.pendingLine != null){ editor.jump(S.pendingLine); S.pendingLine = null; } }, 0);
  if (!quietly) up({ type: 'ide-tab-state', mode: m });
}
$('mDiagram').onclick = function(){ setMode('diagram'); };
$('mText').onclick = function(){
  // Jump to the shown proc, the first time and whenever it changed.
  var sym = S.proc && sym_(S.proc);
  if (sym && sym.loc && sym.loc.file === S.path && S.pendingLine == null && S.lastJump !== S.proc){ S.pendingLine = sym.loc.line; S.lastJump = S.proc; }
  setMode('text');
};
$('bFit').onclick = function(){ toViz({ type: 'vandorf-fit' }); };

/* ---------- status ---------- */
function status(text, cls){
  var s = $('status'); s.textContent = text; s.className = cls || '';
  up({ type: 'ide-status', text: text, cls: cls });
}
$('status').onclick = function(){ if (this.classList.contains('bad')) setMode('text'); };
$('banner').onclick = function(){ setMode('text'); };

/* ---------- compile ---------- */
var seq = 0, timer = null;
function compile(){
  var my = ++seq;
  status('Compiling…');
  fetch('/api/compile', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: S.path, source: editor.get() }) })
    .then(function(r){ return r.json(); })
    .then(function(res){ if (my === seq) show(res); })
    .catch(function(e){ if (my === seq) status('Network error: ' + e, 'bad'); });
}
function show(res){
  S.res = res;
  editor.clearMarks();
  var d = $('diags');
  if (!res.ok){
    var list = res.diagnostics || [];
    var n = list.length || 1;
    status(n + ' error' + (n === 1 ? '' : 's'), 'bad');
    d.innerHTML = list.map(function(x, i){
      var where = (x.here ? '' : x.file + ' ') + (x.from.line + 1) + ':' + (x.from.ch + 1);
      return '<div class="d" data-i="' + i + '"><b>' + esc(where) + '</b>' + esc(x.msg) + '</div>';
    }).join('') || '<div class="d">' + esc(res.error || 'error') + '</div>';
    d.classList.add('on');
    list.forEach(function(x){ if (x.here) editor.mark(x.from, x.to); });
    d.onclick = function(e){
      var el = e.target.closest('.d'); if (!el || el.dataset.i == null) return;
      var x = list[+el.dataset.i];
      if (x.here) editor.jump(x.from.line, x.from.ch);
      else up({ type: 'ide-open', path: x.file, line: x.from.line, mode: 'text' });
    };
    var b = $('banner');
    b.textContent = n + ' error' + (n === 1 ? '' : 's') + (S.good ? ' — showing the last good diagram' : '') + ' · open text';
    b.classList.add('on');
    return;
  }
  d.classList.remove('on'); d.innerHTML = ''; $('banner').classList.remove('on');
  S.good = res;
  var failed = [res.go && res.go.ok === false && res.go.error !== 'not configured in vandorf.toml' ? 'Go' : null,
                res.rust && res.rust.ok === false && res.rust.error !== 'not configured in vandorf.toml' ? 'Rust' : null].filter(Boolean);
  status('OK' + (res.project ? ' · ' + res.project : '') + (failed.length ? ' · ' + failed.join(', ') + ' codegen failed' : ''), failed.length ? 'bad' : 'ok');
  fillProcs();
  if (!S.proc || !res.document.grids[S.proc]){
    var mine = procsHere();
    if (S.proc && !res.document.grids[S.proc]) status('proc ' + S.proc + ' is gone', 'bad');
    if (!S.proc && mine.length) setProc(mine[0], true);
  }
  pushDoc();
  if (drawerSel) renderDrawer();
}
function pushDoc(){
  if (!S.good || !S.vizReady) return;
  toViz({ type: 'vandorf-document', document: S.good.document, name: S.path, proc: S.proc });
}

/* ---------- procs of this file ---------- */
function syms(){ return S.good && S.good.symbols ? S.good.symbols : { nodes: {}, types: {} }; }
function sym_(q){ return syms().nodes[q]; }
function procsHere(){
  var n = syms().nodes, out = [];
  Object.keys(n).forEach(function(q){ if (n[q].kind === 'proc' && n[q].loc && n[q].loc.file === S.path) out.push(q); });
  out.sort(function(a, b){ return n[a].loc.line - n[b].loc.line; });
  return out;
}
function fillProcs(){
  var sel = $('procSel'), mine = procsHere(), all = S.good ? Object.keys(S.good.document.grids) : [];
  var opts = mine.slice();
  if (S.proc && opts.indexOf(S.proc) < 0 && all.indexOf(S.proc) >= 0) opts.unshift(S.proc);
  sel.innerHTML = opts.map(function(q){ return '<option value="' + esc(q) + '">' + esc(q) + '</option>'; }).join('') ||
    '<option value="">(no procs in this file)</option>';
  if (S.proc) sel.value = S.proc;
}
function setProc(q, quietly){
  S.proc = q; $('procSel').value = q || '';
  crumb();
  if (!quietly) toViz({ type: 'vandorf-show-proc', proc: q });
  up({ type: 'ide-tab-state', proc: q });
}
$('procSel').onchange = function(){ setProc(this.value); };
function crumb(){ $('crumb').textContent = S.path || ''; }

/* ---------- saving ---------- */
function setDirty(d){
  S.dirty = d; $('bSave').classList.toggle('on', d);
}
function save(){
  if (!S.path) return;
  var text = editor.get();
  status('Saving…');
  fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vandorf-Token': TOKEN },
    body: JSON.stringify({ path: S.path, source: text }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok){ status('Save failed: ' + res.error, 'bad'); return; }
      S.saved = text; setDirty(false);
      status('Saved ' + S.path, 'ok');
      up({ type: 'ide-saved', path: S.path, text: text });
    })
    .catch(function(e){ status('Save failed: ' + e, 'bad'); });
}
$('bSave').onclick = save;
document.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); save(); }
  if (e.key === 'Escape' && $('drawer').classList.contains('on')) closeDrawer();
});
editor.onChange(function(){
  var text = editor.get(), dirty = text !== S.saved;
  setDirty(dirty);
  up({ type: 'ide-buffer', path: S.path, text: text, dirty: dirty });
  clearTimeout(timer); timer = setTimeout(compile, 450);
});

/* ---------- preview drawer ---------- */
var drawerSel = null, history_ = [];
var dh = +store('vandorf.viewer.drawer') || 240;
$('drawer').style.setProperty('--dh', dh + 'px');
(function(){
  var g = $('grip');
  g.addEventListener('pointerdown', function(e){
    e.preventDefault(); g.setPointerCapture(e.pointerId);
    var y0 = e.clientY, h0 = $('drawer').offsetHeight;
    function mv(ev){ dh = Math.max(90, h0 + (y0 - ev.clientY)); $('drawer').style.setProperty('--dh', dh + 'px'); }
    function done(){ g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', done); store('vandorf.viewer.drawer', dh); }
    g.addEventListener('pointermove', mv); g.addEventListener('pointerup', done);
  });
})();
function openDrawer(sel, push){
  if (push && drawerSel) history_.push(drawerSel);
  drawerSel = sel; renderDrawer();
  $('drawer').classList.add('on'); $('bPrev').classList.add('on');
}
function closeDrawer(){ $('drawer').classList.remove('on'); $('bPrev').classList.remove('on'); }
$('dClose').onclick = closeDrawer;
$('dBack').onclick = function(){ if (history_.length){ drawerSel = history_.pop(); renderDrawer(); } };
$('bPrev').onclick = function(){
  if ($('drawer').classList.contains('on')) closeDrawer();
  else openDrawer(drawerSel || (S.proc ? { kind: 'proc', grid: S.proc, label: S.proc } : { kind: 'none' }));
};

/* Resolves a name as written inside grid `owner` to a symbol: a local of the
   owner or of an enclosing proc, else a global (interface funcs are qualified). */
function resolveNode(name, owner){
  var n = syms().nodes;
  if (!name) return null;
  var parts = owner ? owner.split('.') : [];
  for (var i = parts.length; i >= 0; i--){
    var q = parts.slice(0, i).concat([name]).join('.');
    if (n[q]) return q;
  }
  return null;
}
function instanceOf(sub){ var m = /^instance of (.+)$/.exec(sub || ''); return m ? m[1] : null; }

/* Typedef names appearing in a type expression, longest first so `R<int>` wins over `R`. */
function typesIn(s){
  var t = syms().types, found = [];
  if (!s) return found;
  Object.keys(t).sort(function(a, b){ return b.length - a.length; }).forEach(function(name){
    var re = new RegExp('(^|[^\\w<])' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\w<])');
    if (re.test(s) && found.indexOf(name) < 0) found.push(name);
  });
  return found;
}
/* Type text with typedef names as links. */
function linkTypes(s){
  var names = typesIn(s);
  if (!names.length) return esc(s);
  var re = new RegExp('(' + names.map(function(n){ return n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')(?![\\w<])', 'g');
  var out = '', last = 0, m;
  while ((m = re.exec(s))){
    var before = s[m.index - 1];
    if (before && /[\w<]/.test(before) && before !== '<'){ continue; }
    out += esc(s.slice(last, m.index)) + '<a data-type="' + esc(m[1]) + '">' + esc(m[1]) + '</a>';
    last = m.index + m[1].length;
  }
  return out + esc(s.slice(last));
}
/* `{ a: int, b: X }` / `enum { A, B(int) }` laid out one member per line. */
function prettyType(def){
  var m = /^(enum )?\{ (.*) \}$/.exec(def);
  if (!m) return def;
  var body = m[2], parts = [], depth = 0, cur = '';
  for (var i = 0; i < body.length; i++){
    var c = body[i];
    if (c === '{' || c === '(' || c === '[' || c === '<') depth++;
    if (c === '}' || c === ')' || c === ']' || c === '>') depth--;
    if (c === ',' && depth === 0){ parts.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  if (cur.trim()) parts.push(cur.trim());
  return (m[1] || '') + '{\n' + parts.map(function(p){ return '\t' + p + ','; }).join('\n') + '\n}';
}

function locLink(loc){
  if (!loc || !loc.file) return '';
  return (loc.file === S.path ? '' : loc.file.split('/').pop() + ':') + 'line ' + (loc.line + 1);
}
function typeBlock(names){
  var t = syms().types;
  if (!names.length) return '';
  return '<h4>Types</h4>' + names.map(function(n){
    return '<pre>' + '<span class="tk-kw">type</span> ' + esc(n) + ' = ' + linkTypes(prettyType(t[n].def)) + ';</pre>';
  }).join('<div style="height:6px"></div>');
}

function renderDrawer(){
  var sel = drawerSel || { kind: 'none' };
  var body = '', kind = sel.kind, name = '', loc = null, n = syms().nodes;
  $('dBack').style.visibility = history_.length ? 'visible' : 'hidden';
  if (kind === 'type'){
    var t = syms().types[sel.name];
    name = sel.name;
    body = t ? '<pre><span class="tk-kw">type</span> ' + esc(sel.name) + ' = ' + linkTypes(prettyType(t.def)) + ';</pre>' +
      (t.recursive ? '<p class="note">Recursive: fields that contain it are boxed in generated code.</p>' : '') +
      typeBlock(typesIn(t.def).filter(function(x){ return x !== sel.name; }))
      : '<p class="note">Unknown type.</p>';
  } else if (kind === 'func' || kind === 'proc'){
    var label = sel.label;
    var q = kind === 'proc' && sel.grid && n[sel.grid] ? sel.grid : (resolveNode(label, sel.owner) || resolveNode(instanceOf(sel.sublabel), sel.owner));
    if (!q && label === 'id'){
      kind = 'builtin'; name = 'id';
      body = '<div class="sig"><span class="tk-kw">id</span>(value)</div><p class="note">Built in: ends the proc with <code>value</code>, checked against the proc’s return type.</p>' +
        (sel.call ? '<h4>Receives</h4><div class="sig">' + linkTypes(sel.call) + '</div>' : '');
    } else if (!q){
      name = label || '?';
      body = '<p class="note">No symbol found for <b>' + esc(label) + '</b>' + (sel.owner ? ' in ' + esc(sel.owner) : '') + '.</p>';
    } else {
      var s = n[q]; kind = s.kind; name = q; loc = s.loc;
      var inst = instanceOf(sel.sublabel);
      var sig = '<span class="tk-kw">' + s.kind + '</span> ' + esc(q) + '(' + linkTypes(s.params) + '): ' + linkTypes(s.ret);
      var left = '<div class="sig">' + sig + '</div>' +
        (inst && sel.label ? '<p class="note">Shown as <b>' + esc(sel.label) + '</b>: a separate instance (<code>as ' + esc(sel.label) + '</code>).</p>' : '') +
        (s.kind === 'proc' ? '<p class="note">Entry: <a data-node="' + esc(q + '.' + s.entry) + '">' + esc(s.entry) + '</a></p>' : '') +
        typeBlock(typesIn(s.params + ' ' + s.ret));
      var right = '';
      if (s.kind === 'func'){
        if (!s.imps.length) right = '<h4>Implementation</h4><p class="note">No implementation named (an interface func, or stubbed).</p>';
        else {
          right = '<div class="tabs">' + s.imps.map(function(im, i){
            return '<button data-imp="' + i + '" class="' + (i === (sel.imp || 0) ? 'on' : '') + '">' + esc(im.written + ':' + im.function) + '</button>';
          }).join('') + '</div><pre id="impCode" class="impl">Loading…</pre>';
        }
      } else {
        right = '<div class="acts"><button id="aOpen">Open in new tab</button><button id="aShow">Show here</button></div>';
      }
      body = '<div class="cols"><div>' + left + '</div><div>' + right + '</div></div>';
      if (s.kind === 'func' && s.imps.length) setTimeout(function(){ loadImpl(s.imps[sel.imp || 0]); }, 0);
    }
  } else if (kind === 'edge'){
    name = sel.call || 'edge';
    body = (sel.edgeLabel ? '<h4>Arm</h4><div class="sig">' + esc(sel.edgeLabel) + '</div>' : '') +
      (sel.valueType ? '<h4>this</h4><div class="sig">' + linkTypes(sel.valueType) + '</div>' : '') +
      (sel.call ? '<h4>Calls</h4><div class="sig">' + linkTypes(sel.call) + '</div>' : '') +
      typeBlock(typesIn((sel.valueType || '') + ' ' + (sel.call || '')));
  } else {
    name = 'Preview';
    body = '<p class="note">Click a func, proc or edge in the diagram to preview its signature, types and implementation. Ctrl/⌘+click a proc to open it in a new tab.</p>';
  }
  $('dKind').className = 'k ' + kind; $('dKind').textContent = kind === 'none' ? 'info' : kind;
  $('dName').textContent = name;
  $('dLoc').textContent = locLink(loc); $('dLoc').onclick = function(){ goLoc(loc); };
  $('dBody').innerHTML = body;
  var ao = $('aOpen'), as = $('aShow');
  if (ao) ao.onclick = function(){ up({ type: 'ide-open', proc: name, newTab: true, mode: 'diagram' }); };
  if (as) as.onclick = function(){ setProc(name); };
}
$('dBody').addEventListener('click', function(e){
  var a = e.target.closest('a[data-type]');
  if (a){ openDrawer({ kind: 'type', name: a.dataset.type }, true); return; }
  var nd = e.target.closest('a[data-node]');
  if (nd){ var s = sym_(nd.dataset.node); openDrawer({ kind: s ? s.kind : 'func', label: nd.dataset.node, grid: nd.dataset.node }, true); return; }
  var b = e.target.closest('button[data-imp]');
  if (b){ drawerSel.imp = +b.dataset.imp; renderDrawer(); }
});
function goLoc(loc){
  if (!loc || !loc.file) return;
  if (loc.file === S.path){ S.pendingLine = loc.line; setMode('text'); }
  else up({ type: 'ide-open', path: loc.file, line: loc.line, mode: 'text' });
}

/* Implementation snippets: the function out of its file, by brace matching. */
var fileCache = {};
function loadImpl(im){
  var el = $('impCode'); if (!el) return;
  if (!im.path){ el.textContent = 'The implementation file is outside the source directory: ' + im.written; return; }
  var p = fileCache[im.path] || (fileCache[im.path] = fetch('/api/source?path=' + encodeURIComponent(im.path)).then(function(r){ return r.json(); }));
  p.then(function(res){
    var el2 = $('impCode'); if (!el2) return;
    if (!res.ok){ delete fileCache[im.path]; el2.textContent = res.error; return; }
    var snip = extract(res.source, im.function, im.lang);
    el2.innerHTML = snip ? highlight(snip.text, im.lang) : esc('// ' + im.function + ' not found in ' + im.path);
    if (snip){
      var link = document.createElement('div'); link.className = 'note'; link.style.marginTop = '4px';
      link.textContent = im.path + ':' + (snip.line + 1); el2.after(link);
    }
  });
}
function extract(src, fn, lang){
  var name = fn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  var re = lang === 'go'
    ? new RegExp('^func\\s+(?:\\([^)]*\\)\\s*)?' + name + '\\s*[\\[(]', 'm')
    : new RegExp('^[ \\t]*(?:pub(?:\\([^)]*\\))?\\s+)?(?:const\\s+|async\\s+|unsafe\\s+)*fn\\s+' + name + '\\b', 'm');
  var m = re.exec(src);
  if (!m) return null;
  var start = m.index;
  // Pull in the doc comments and attributes right above it.
  var lines = src.slice(0, start).split('\n'); lines.pop();
  var pre = 0;
  for (var i = lines.length - 1; i >= 0; i--){
    if (/^\s*(\/\/|#\[)/.test(lines[i])) pre += lines[i].length + 1; else break;
  }
  start -= pre;
  var i = src.indexOf('{', m.index), depth = 0;
  if (i < 0) return null;
  for (; i < src.length; i++){
    var c = src[i];
    if (c === '"'){ i++; while (i < src.length && src[i] !== '"'){ if (src[i] === '\\') i++; i++; } continue; }
    if (c === '`' && lang === 'go'){ i = src.indexOf('`', i + 1); if (i < 0) break; continue; }
    if (c === "'" && src[i + 2] === "'"){ i += 2; continue; }
    if (c === "'" && src[i + 1] === '\\'){ i = src.indexOf("'", i + 2); if (i < 0) break; continue; }
    if (c === '/' && src[i + 1] === '/'){ i = src.indexOf('\n', i); if (i < 0) break; continue; }
    if (c === '/' && src[i + 1] === '*'){ i = src.indexOf('*/', i + 2); if (i < 0) break; i++; continue; }
    if (c === '{') depth++;
    if (c === '}' && --depth === 0) break;
  }
  return { text: src.slice(start, i + 1), line: src.slice(0, start).split('\n').length - 1 };
}
function highlight(s, lang){
  var kw = lang === 'go'
    ? 'func|return|if|else|for|range|var|const|type|struct|interface|map|switch|case|default|break|continue|nil|true|false|package|import|go|defer|chan|select'
    : 'fn|let|mut|return|if|else|for|in|while|loop|match|impl|pub|struct|enum|use|mod|crate|self|Self|super|as|ref|move|where|true|false|const|static|break|continue|dyn|unsafe';
  var re = new RegExp('(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:[^"\\\\]|\\\\.)*"|`[^`]*`)|\\b(' + kw + ')\\b|\\b(\\d+(?:\\.\\d+)?)\\b|\\b([A-Z]\\w*)\\b', 'g');
  var out = '', last = 0, m;
  while ((m = re.exec(s))){
    out += esc(s.slice(last, m.index));
    var cls = m[1] ? 'tk-com' : m[2] ? 'tk-str' : m[3] ? 'tk-kw' : m[4] ? 'tk-num' : 'tk-ty';
    out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

/* ---------- messages ---------- */
window.addEventListener('message', function(e){
  if (e.origin !== location.origin || !e.data || typeof e.data.type !== 'string') return;
  var m = e.data;
  if (e.source === $('viz').contentWindow){
    if (m.type === 'vandorf-viz-ready'){ S.vizReady = true; if (S.theme) toViz({ type: 'vandorf-theme', theme: S.theme }); pushDoc(); }
    if (m.type === 'vandorf-open-proc') up({ type: 'ide-open', proc: m.proc, newTab: true, mode: 'diagram' });
    if (m.type === 'vandorf-select'){
      if (!m.kind){ return; }
      history_ = [];
      openDrawer(m, false);
    }
    if (m.type === 'vandorf-proc-shown' && m.proc && m.proc !== S.proc){ S.proc = m.proc; $('procSel').value = m.proc; up({ type: 'ide-tab-state', proc: m.proc }); }
    return;
  }
  switch (m.type){
  case 'ide-init':
    init(m.path, m.proc, m.mode, m.line, m.buffer);
    if (m.theme) theme(m.theme);
    break;
  case 'vandorf-theme': theme(m.theme); break;
  case 'ide-goto':
    if (m.mode) setMode(m.mode, false);
    if (m.line != null){ S.pendingLine = m.line; if (S.mode === 'text') { editor.jump(m.line); S.pendingLine = null; } else setMode('text'); }
    break;
  case 'ide-buffer':
    if (m.text !== editor.get()){ editor.set(m.text); clearTimeout(timer); timer = setTimeout(compile, 300); }
    if (!m.dirty) S.saved = m.text;
    setDirty(m.dirty);
    break;
  case 'ide-activate':
    S.active = true;
    // Re-announce the status: the IDE shows only the active tab's.
    up({ type: 'ide-status', text: $('status').textContent, cls: $('status').className });
    if (S.mode === 'text' && cm) setTimeout(function(){ cm.refresh(); }, 0);
    break;
  }
});
function theme(t){
  S.theme = t; document.documentElement.setAttribute('data-theme', t);
  toViz({ type: 'vandorf-theme', theme: t });
}

function init(path, proc, mode, line, buffer){
  S.path = path; S.proc = proc || null; crumb();
  setMode(mode || (proc ? 'diagram' : 'text'), true);
  if (line != null) S.pendingLine = line;
  fetch('/api/source?path=' + encodeURIComponent(path)).then(function(r){ return r.json(); }).then(function(res){
    if (!res.ok){ status(res.error, 'bad'); return; }
    S.saved = res.source;
    editor.set(buffer != null ? buffer : res.source);
    setDirty(buffer != null && buffer !== res.source);
    if (S.mode === 'text' && S.pendingLine != null){ setTimeout(function(){ editor.jump(S.pendingLine); S.pendingLine = null; }, 0); }
    compile();
  }).catch(function(e){ status('Cannot load ' + path + ': ' + e, 'bad'); });
}

/* The renderer may have announced itself before this script ran (it loads
   while the CDN scripts above block), so its load event counts as ready too. */
function vizLoaded(){
  if (S.vizReady) return;
  S.vizReady = true;
  if (S.theme) toViz({ type: 'vandorf-theme', theme: S.theme });
  pushDoc();
}
$('viz').addEventListener('load', vizLoaded);
try { if ($('viz').contentDocument.readyState === 'complete' && $('viz').contentWindow.location.pathname === '/viz') vizLoaded(); } catch (e) {}

if (embedded){
  up({ type: 'viewer-ready' });
} else {
  var q = new URLSearchParams(location.search);
  if (q.get('path')) init(q.get('path'), q.get('proc'), q.get('mode'), null, null);
  else status('Open /viewer?path=<file.sys>&proc=<Proc>', 'bad');
}
})();
</script>
