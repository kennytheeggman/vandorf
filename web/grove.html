<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grove</title>
<link rel="stylesheet" href="/ui.css">
<style>
/* grove: the idea tree (the exterior, left) and the shown idea's interiors
   as stacked sections (the interior, right). */
body{ background:var(--app) }
:root{ --seen:color-mix(in srgb, var(--accent) 55%, var(--mut)) }
#app{ display:flex; height:100% }

/* ---- The exterior: the idea tree ---- */
#side{ width:var(--side-w, 320px); min-width:200px; max-width:60vw; display:flex; flex-direction:column; background:var(--bar); border-right:1px solid var(--line); flex:none }
#side.hidden{ display:none }
#sash{ width:4px; margin-left:-2px; margin-right:-2px; cursor:col-resize; z-index:2; flex:none }
#sash:hover, #sash.drag{ background:var(--accent) }
#side.hidden + #sash{ display:none }
/* The tree is a map: the root in the middle, ideas on rings around it,
   no labels (every node has a tooltip). Drag or scroll to pan, pinch or
   Ctrl+scroll to zoom, double-click to come back to the root. */
#tree{ flex:1; position:relative; overflow:hidden; cursor:grab; touch-action:none; user-select:none }
#tree.panning{ cursor:grabbing }
#map{ position:absolute; inset:0; width:100%; height:100%; display:block }
.e{ fill:none; stroke:var(--mut); stroke-opacity:.42; stroke-width:1.4; stroke-linecap:round }
.e.path{ stroke:var(--accent); stroke-opacity:.9; stroke-width:2 }
.e.behind{ stroke-dasharray:2 4 }
.e.gone{ stroke-opacity:.18 }
.n{ cursor:pointer }
.n .hit{ fill:transparent }
.n .dot{ fill:var(--bar); stroke:var(--mut); stroke-width:1.6; transition:fill .25s, stroke .25s, opacity .25s }
.n .halo, .n .spin, .n .crown{ transform-box:fill-box; transform-origin:center }
.n .halo{ fill:var(--accent); opacity:0; transition:opacity .25s }
.n .spin{ fill:none; stroke:var(--accent); stroke-width:1.8; stroke-linecap:round; stroke-dasharray:13 44; opacity:0; transition:opacity .25s }
.n .crown{ fill:none; stroke:var(--ink); stroke-width:1; opacity:.55; transition:transform .25s cubic-bezier(.2,.8,.2,1), stroke .25s, opacity .25s }
.n:hover .dot{ stroke:var(--ink) }
.n.on .dot{ fill:var(--accent); stroke:var(--accent) }
.n.on .halo{ opacity:.18 }
.n.root .dot{ fill:var(--accent); stroke:var(--accent) }
.n.root:hover .crown, .n.root.on .crown{ stroke:var(--accent); opacity:1; transform:scale(1.25) }
.n.done .dot{ fill:var(--ok); stroke:var(--ok) }
/* Done, and someone has shown it since: a quieter blue, so the done ideas
   no one has looked at yet stay green. */
.n.seen .dot{ fill:var(--seen); stroke:var(--seen) }
.n.att .dot{ fill:var(--dirty); stroke:var(--dirty) }
.n.att .halo{ fill:var(--dirty); animation:pulse 1.8s cubic-bezier(.2,.6,.3,1) infinite }
.n.working .spin{ opacity:1; animation:spin 1.1s linear infinite }
.n.gone .dot{ fill:var(--bar); stroke-dasharray:2 2; opacity:.45 }
.n.merged .dot{ fill:var(--bar); stroke:var(--ok); opacity:.7 }
@keyframes spin{ to{ transform:rotate(360deg) } }
@keyframes pulse{ 0%{ opacity:.5; transform:scale(.55) } 100%{ opacity:0; transform:scale(1.7) } }
@media (prefers-reduced-motion: reduce){ .n.working .spin{ animation-duration:4s } .n.att .halo{ animation:none; opacity:.25 } }
#foot{ border-top:1px solid var(--line); padding:6px 10px; font-size:12px; color:var(--mut); flex:none; overflow:hidden }
#foot b{ color:var(--ink); font-weight:600; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
#foot code{ font:11px var(--mono) }
#tip{ position:fixed; z-index:20; pointer-events:none; background:var(--bg); color:var(--ink); border:1px solid var(--line);
  box-shadow:0 8px 24px var(--shadow); padding:7px 10px; font-size:12px; max-width:300px; display:none; border-radius:6px;
  opacity:0; transform:translateY(2px); transition:opacity .12s, transform .12s }
#tip.on{ opacity:1; transform:none }
#tip .t-name{ font-weight:600; display:flex; align-items:center; gap:6px }
#tip .pill{ font:600 10px/1 var(--mono); letter-spacing:.06em; padding:3px 5px; border-radius:3px; background:var(--accent); color:var(--accent-ink) }
#tip .t-state{ margin-top:3px; display:flex; align-items:center; gap:6px }
#tip .t-state i{ width:7px; height:7px; border-radius:50%; flex:none; background:var(--mut) }
#tip .t-state.working i{ background:var(--accent) } #tip .t-state.att i{ background:var(--dirty) } #tip .t-state.done i{ background:var(--ok) } #tip .t-state.seen i{ background:var(--seen) }
#tip .t-state.merged i{ background:none; border:1.5px solid var(--ok) } #tip .t-state.gone i{ background:none; border:1.5px dashed var(--mut) }
#tip .t-msg{ color:var(--ink); margin-top:2px; white-space:pre-wrap }
#tip .t-git{ color:var(--mut); font:11px var(--mono); margin-top:4px }

/* ---- The interior: stacked sections ---- */
#main{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg) }
/* The shown idea's name, over its sections. */
#title{ flex:none; height:26px; line-height:25px; padding:0 10px; background:var(--bar); border-bottom:1px solid var(--line);
  font-size:12px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
#views{ flex:1; min-height:0; position:relative }
.idea{ position:absolute; inset:0; display:flex; flex-direction:column; visibility:hidden }
.idea.on{ visibility:visible }
.sec{ display:flex; flex-direction:column; min-height:0; flex:none; border-bottom:1px solid var(--line) }
.sec.open{ flex:1 1 0; min-height:60px }
.sec .hd{ display:flex; align-items:center; gap:6px; height:26px; padding:0 4px 0 6px; background:var(--bar); cursor:pointer; user-select:none; flex:none;
  font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mut) }
.sec .hd:hover{ color:var(--ink) }
.sec .hd .chev{ width:12px; height:12px; flex:none; display:flex; align-items:center; justify-content:center }
.sec .hd .chev svg{ width:10px; height:10px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transform:rotate(-90deg); transition:transform .1s }
.sec.open .hd .chev svg{ transform:none }
.sec .hd .sub{ text-transform:none; letter-spacing:0; font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0 }
.sec .hd .att{ width:7px; height:7px; border-radius:50%; background:var(--dirty); display:none; flex:none }
.sec.att .hd .att{ display:block }
.sec .hd .sp{ flex:1 }
.sec .hd .x{ width:20px; height:20px; padding:0; font-size:14px; color:var(--mut); visibility:hidden }
.sec .hd:hover .x{ visibility:visible }
.sec .hd .x:hover{ background:var(--line); color:var(--ink) }
.sec.over-top{ box-shadow:inset 0 2px var(--accent) }
.sec.over-bottom{ box-shadow:inset 0 -2px var(--accent) }
.sec.dragging{ opacity:.5 }
.sec .bd{ flex:1; min-height:0; display:none; position:relative }
.sec.open .bd{ display:block }
.sec iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg) }
.sec .msg{ padding:14px; color:var(--mut); white-space:pre-wrap; font:12px/1.5 var(--mono) }
.sec .msg.bad{ color:var(--err) }
body.dragging iframe{ pointer-events:none }
/* Opening one: collapse every section, then pick below them. */
.picker{ padding:8px 12px; color:var(--mut); font-size:12px; flex:none }
.picker a{ color:var(--accent); cursor:pointer; text-decoration:none }
.picker a:hover{ text-decoration:underline }
.picker .none{ font-style:italic }
.blank{ padding:24px; color:var(--mut) }
.blank button{ margin-top:8px }

/* ---- Menus and toasts ---- */
#menu{ position:fixed; z-index:30; background:var(--bg); border:1px solid var(--line); box-shadow:0 6px 18px var(--shadow); padding:4px 0; display:none; min-width:160px }
#menu div{ padding:4px 12px; cursor:pointer; white-space:nowrap }
#menu div:hover{ background:var(--hover) }
#menu div.bad{ color:var(--err) }
#menu div.off{ color:var(--mut); cursor:default }
#menu div.off:hover{ background:none }
#menu hr{ border:0; border-top:1px solid var(--line); margin:4px 0 }
#toasts{ position:fixed; right:12px; bottom:12px; z-index:40; display:flex; flex-direction:column; gap:6px; max-width:420px }
.toast{ background:var(--bg); border:1px solid var(--line); border-left:3px solid var(--err); box-shadow:0 4px 14px var(--shadow); padding:8px 10px; font-size:12px; white-space:pre-wrap }
.toast.info{ border-left-color:var(--accent) }
.toast.merge{ border-left-color:var(--ok) }
.toast.discard{ border-left-color:var(--mut) }
#confirmation{ box-sizing:border-box; width:min(440px, calc(100% - 32px)); padding:18px; color:var(--ink); background:var(--bg); border:1px solid var(--line); box-shadow:0 8px 30px var(--shadow) }
#confirmation::backdrop{ background:rgba(0,0,0,.48) }
#confirmation h2{ margin:0 0 8px; font-size:16px }
#confirmation p{ margin:0 0 16px; overflow-wrap:anywhere }
#confirmation .actions{ display:flex; justify-content:flex-end; gap:8px }
#confirmation .destructive{ color:var(--err); border-color:var(--err); background:var(--err-bg) }
#showSide{ position:fixed; left:0; top:50%; z-index:5; height:40px; width:14px; padding:0; background:var(--bar); border:1px solid var(--line); border-left:0; display:none }
#side.hidden ~ #showSide{ display:flex }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="bar">
      <span class="ttl" id="repoName">ideas</span>
      <span class="sp"></span>
      <button class="icon" id="bBranch" title="Branch a new idea from this one (Alt+Shift+N)"><svg viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.6"/><circle cx="4.5" cy="12.5" r="1.6"/><circle cx="11.5" cy="6.5" r="1.6"/><path d="M4.5 5.1v5.8M11.5 8.1c0 2.4-4.2 1.6-6.4 3.1"/></svg></button>
      <button class="icon" id="bHome" title="Back to the root (double-click the map)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><circle cx="8" cy="8" r="5.5"/></svg></button>
      <button class="icon" id="bGone" title="Show merged and discarded ideas"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg></button>
      <button class="icon" id="bHide" title="Hide the tree (Alt+Shift+B)"><svg viewBox="0 0 16 16"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
    </div>
    <div id="tree"></div>
    <div id="foot"></div>
  </aside>
  <div id="sash"></div>
  <main id="main"><div id="title"></div><div id="views"></div></main>
  <button id="showSide" title="Show the tree (Alt+Shift+B)">›</button>
</div>
<div id="tip"></div>
<div id="menu"></div>
<div id="toasts" aria-live="polite"></div>
<dialog id="confirmation" aria-labelledby="confirmationTitle" aria-describedby="confirmationText">
  <form method="dialog">
    <h2 id="confirmationTitle"></h2>
    <p id="confirmationText"></p>
    <div class="actions">
      <button type="submit" value="cancel" class="outline" autofocus>Cancel</button>
      <button type="submit" value="confirm" id="confirmAction"></button>
    </div>
  </form>
</dialog>
<script>
(function(){
'use strict';
var TOKEN = '__VANDORF_TOKEN__';
var $ = function(id){ return document.getElementById(id); };
/* Ideas' views kept alive, hidden, so switching back is instant. */
var KEEP = 4;

function api(path, body){
  var opts = { headers: { 'X-Vandorf-Token': TOKEN } };
  if (body !== undefined){ opts.method = 'POST'; opts.body = JSON.stringify(body); opts.headers['Content-Type'] = 'application/json'; }
  return fetch(path, opts).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) throw new Error(j.error || 'request failed');
    return j;
  });
}
function store(k, v){ try { if (v === undefined) return localStorage.getItem('grove.' + k); localStorage.setItem('grove.' + k, v); } catch (e) { return null; } }
function toast(msg, outcome){
  var d = el('div', 'toast' + (outcome ? ' ' + outcome : ''), msg);
  $('toasts').appendChild(d); setTimeout(function(){ d.remove(); }, outcome ? 3000 : 8000);
}
function ask(title, detail, action, destructive){
  var dialog = $('confirmation'), button = $('confirmAction');
  $('confirmationTitle').textContent = title;
  $('confirmationText').textContent = detail;
  button.textContent = action;
  button.className = destructive ? 'destructive' : 'primary';
  dialog.returnValue = 'cancel';
  return new Promise(function(resolve){
    dialog.addEventListener('close', function(){ resolve(dialog.returnValue === 'confirm'); }, { once: true });
    dialog.showModal();
  });
}
$('confirmation').addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.repeat){
    e.preventDefault();
    $('confirmation').close('confirm');
  }
});
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
var CHEV = '<svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>';

/* ---- Theme ---- */
var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function theme(){ return mq && mq.matches ? 'dark' : 'light'; }
if (mq && mq.addEventListener) mq.addEventListener('change', function(){ views.forEach(function(v){ v.secs.forEach(sendContext); }); });

/* ---- State ---- */
var repo = null, ideas = [], byId = {}, interiors = [];
var cur = null;                       // the id shown
var views = [];                       // { id, el, secs, saveT }, most recent first
var showGone = store('gone') === '1';
var attention = {};                   // idea id -> true

function refresh(){
  return api('/api/ideas').then(function(j){
    repo = j.repo; ideas = j.ideas; interiors = j.interiors;
    byId = {}; ideas.forEach(function(i){ byId[i.id] = i; });
    views.slice().forEach(function(v){ if (!(v.id in byId)){ v.dirty = false; drop(v); } });
    $('repoName').textContent = repo.name;
    document.title = repo.name + ' · grove';
    if (cur === null || !(cur in byId)){
      var want = decodeURIComponent((location.hash.match(/idea=([^&]*)/) || [])[1] || store('cur') || '');
      show(want in byId ? want : '');
    } else {
      // A report arriving while the idea is being viewed is seen too.
      if (document.hasFocus() && document.visibilityState === 'visible') see(cur);
      drawTree(); drawFoot(); if (!viewOf(cur)) show(cur);
    }
    adopt();
  }).catch(function(e){ toast(String(e.message || e)); });
}

/* ---- The tree: a map of ideas, the root in the middle ----
   Each idea sits on a ring by its depth, in a wedge as wide as the leaves
   under it. The shown idea's history (the root, its ancestors, it) is
   straightened onto one bearing and the map turned so it points up. */
var NS = 'http://www.w3.org/2000/svg';
var RING = 62;                        // px between rings, at zoom 1
var cam = { x: 0, y: 0, k: 1 };       // pan from the pane's center, and zoom
var rot = 0;                          // the map's turn, radians
var pos = {};                         // id -> { a, r }, as drawn
var goal = null;                      // the layout being moved to
var els = {};                         // id -> { g, e, kind }
var focused;                          // the idea the map last turned to
var hovered = null, tipPoint;
var anim = 0;
var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function svg(tag, attrs){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
var map = svg('svg', { id: 'map' }), world = svg('g', {}), gEdges = svg('g', {}), gNodes = svg('g', {});
world.appendChild(gEdges); world.appendChild(gNodes); map.appendChild(world); $('tree').appendChild(map);

function parentOf(i){ return i.parent === null ? null : (i.parent in byId ? i.parent : ''); }
function kids(){
  var k = {};
  ideas.forEach(function(i){ var p = parentOf(i); if (p !== null) (k[p] = k[p] || []).push(i); });
  return k;
}
/* The ideas drawn: the root and active ones; merged and discarded ones
   when asked for (or shown, or with a drawn idea under them). */
function treeOf(){
  var k = kids(), seen = {};
  function vis(i){ return i.status === 'active' || showGone || i.id === cur || (k[i.id] || []).some(vis); }
  function build(i, depth){
    seen[i.id] = 1;
    var n = { i: i, depth: depth, kids: [] };
    (k[i.id] || []).forEach(function(c){ if (!seen[c.id] && vis(c)) n.kids.push(build(c, depth + 1)); });
    n.leaves = n.kids.length ? n.kids.reduce(function(s, c){ return s + c.leaves; }, 0) : 1;
    return n;
  }
  return byId[''] ? build(byId[''], 0) : null;
}
function place(t){
  var out = {}, ring = Math.max(RING, t.leaves * 28 / (2 * Math.PI));
  (function go(n, a0, a1){
    out[n.i.id] = { a: (a0 + a1) / 2, r: n.depth * ring, n: n };
    var a = a0;
    n.kids.forEach(function(c){ var w = (a1 - a0) * c.leaves / n.leaves; go(c, a, a + w); a += w; });
  })(t, -Math.PI, Math.PI);
  /* The shown idea's ancestors take its bearing: it lies in each of their
     wedges, so nothing crosses. */
  var f = out[cur];
  if (f && cur !== '') for (var p = byId[cur]; p && p.id !== ''; p = byId[parentOf(p)]) if (out[p.id]) out[p.id].a = f.a;
  return out;
}
function onPath(id){ for (var p = byId[cur]; p; p = p.id === '' ? null : byId[parentOf(p)]) if (p.id === id) return true; return false; }
function stateOf(i){
  if (i.status === 'merged') return 'merged';
  if (i.status === 'discarded') return 'gone';
  if (i.rebasing || i.rebaseFailure || attention[i.id]) return 'att';
  if (i.agent && i.agent.state === 'working') return 'working';
  if (i.agent && i.agent.state === 'done') return i.agent.seen ? 'seen' : 'done';
  if (i.agent && i.agent.state === 'attention') return i.agent.seen ? 'seen' : 'att';
  return '';
}
function nodeEl(i){
  var root = i.id === '';
  var g = svg('g', { class: 'n' });
  g.appendChild(svg('circle', { class: 'halo', r: root ? 15 : 11 }));
  if (root) g.appendChild(svg('circle', { class: 'crown', r: 11 }));
  g.appendChild(svg('circle', { class: 'spin', r: 9 }));
  g.appendChild(svg('circle', { class: 'dot', r: root ? 7 : 5 }));
  g.appendChild(svg('circle', { class: 'hit', r: 14 }));
  g.addEventListener('click', function(e){ e.stopPropagation(); if (!moved) show(g.idea); });
  g.addEventListener('dblclick', function(e){ e.stopPropagation(); });
  g.addEventListener('contextmenu', function(e){ e.preventDefault(); e.stopPropagation(); menu(e.clientX, e.clientY, byId[g.idea]); });
  g.addEventListener('pointerenter', function(e){ tip(e, byId[g.idea]); });
  g.addEventListener('pointermove', moveTip);
  g.addEventListener('pointerleave', hideTip);
  return g;
}
function drawTree(){
  $('bGone').classList.toggle('on', showGone);
  var t = treeOf(); if (!t) return;
  var to = place(t);
  // Make, keep or drop each node's and edge's elements.
  Object.keys(els).forEach(function(id){ if (!to[id]){ els[id].g.remove(); if (els[id].e) els[id].e.remove(); delete els[id]; delete pos[id]; } });
  Object.keys(to).forEach(function(id){
    var i = to[id].n.i, x = els[id];
    if (!x){
      x = els[id] = { g: nodeEl(i) };
      if (id !== ''){ x.e = svg('path', { class: 'e' }); gEdges.appendChild(x.e); }
      gNodes.appendChild(x.g);
      // A new idea grows out of its parent.
      var p = pos[parentOf(i)] || { a: to[id].a, r: 0 };
      pos[id] = { a: to[id].a, r: p.r };
    }
    x.g.idea = id;
    var st = stateOf(i);
    x.g.setAttribute('class', 'n' + (id === '' ? ' root' : '') + (id === cur ? ' on' : '') + (st ? ' ' + st : ''));
    if (x.e) x.e.setAttribute('class', 'e' + (onPath(id) && cur !== '' ? ' path' : '') + (i.behind ? ' behind' : '') + (st === 'gone' || st === 'merged' ? ' gone' : ''));
    x.parent = parentOf(i);
  });
  if (hovered !== null){
    if (to[hovered]) tip(tipPoint, to[hovered].n.i);
    else hideTip();
  }
  // Turn the map to the shown idea's history, and frame it.
  var rot1 = rot, cam1 = null;
  if (focused !== cur){
    if (cur !== '' && to[cur]) rot1 = -Math.PI / 2 - to[cur].a;
    cam1 = frameFor(to, rot1);
    focused = cur;
  }
  move(to, rot1, cam1);
}
/* A camera that fits the whole map, or if that would make it too small,
   the shown idea's history from the root. */
function frameFor(to, rot1){
  var all = fit(to, rot1, Object.keys(to));
  if (all.k >= .7 || cur === '') return all;
  var path = Object.keys(to).filter(function(id){ return onPath(id); });
  return fit(to, rot1, path);
}
function fit(to, rot1, ids){
  var b = $('tree').getBoundingClientRect(), x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  ids.forEach(function(id){
    var p = to[id], x = p.r * Math.cos(p.a + rot1), y = p.r * Math.sin(p.a + rot1);
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  });
  if (x0 === Infinity) return { x: 0, y: 0, k: 1 };
  var pad = 36, k = Math.min((b.width - 2 * pad) / Math.max(1, x1 - x0), (b.height - 2 * pad) / Math.max(1, y1 - y0));
  k = Math.max(.3, Math.min(1.25, k));
  return { x: -(x0 + x1) / 2 * k, y: -(y0 + y1) / 2 * k, k: k };
}
function ease(u){ return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
function turn(a, b, e){ var d = ((b - a + 3 * Math.PI) % (2 * Math.PI)) - Math.PI; return a + d * e; }
/* Moves every node to its place in `to`, the map's turn to rot1 and the
   camera to cam1 (if given), in one smooth motion. */
function move(to, rot1, cam1){

      if (moved.indexOf(w.v) < 0) moved.push(w.v);
    });
    moved.forEach(function(v){ layout(v); save(v); });
  }).catch(function(){});
}
window.addEventListener('message', function(e){
  var m = e.data;
  if (!m || m.grove !== 1) return;
  var s = sectionOf(e.source, e.origin);
  if (!s) return;
  switch (m.type){
  case 'ready': sendContext(s); tell(s, { type: 'visible', visible: s.expanded }); break;
  case 'term':
    if (s.term !== m.id){ if (s.term) dropped[s.term] = true; s.term = m.id; save(s.v); }
    s.ready = true;
    s.queue.splice(0).forEach(function(c){ tell(s, { type: 'run', cmd: c }); });
    break;
  case 'title': s.title = String(m.title || ''); s.sub.textContent = s.title; break;
  case 'exit': s.sub.textContent = (s.title ? s.title + ' · ' : '') + 'exited'; s.ready = false; break;
  case 'attention':
    if (s.v.id === cur && s.expanded) break;
    s.el.classList.add('att'); s.el.title = String(m.message || '');
    attention[s.v.id] = String(m.message || s.interior + ' needs attention'); drawTree();
    break;
  case 'run': if (m.cmd) run(s.v, String(m.cmd)); break;
  case 'keys': key(m); break;
  }
});

/* ---- Shortcuts: Alt+Shift chords, which interiors pass on as `keys` ---- */
function key(e){
  if (!(e.altKey || e.alt) || !(e.shiftKey || e.shift) || e.ctrlKey || e.ctrl || e.metaKey || e.meta) return false;
  var code = e.code || '';
  if (code === 'KeyB'){ toggleSide(); return true; }
  if (code === 'KeyN'){ if (byId[cur] && byId[cur].status !== 'discarded') branch(cur); return true; }
  if (code === 'ArrowUp' || code === 'ArrowDown'){
    var o = order(), n = o.indexOf(cur) + (code === 'ArrowUp' ? -1 : 1);
    if (n >= 0 && n < o.length) show(o[n]);
    return true;
  }
  return false;
}
document.addEventListener('keydown', function(e){ if (key(e)) e.preventDefault(); });

/* ---- The sidebar ---- */
function toggleSide(){
  var hide = !$('side').classList.contains('hidden');
  $('side').classList.toggle('hidden', hide); store('side', hide ? 'hidden' : '');
}
$('bHide').onclick = toggleSide; $('showSide').onclick = toggleSide;
if (store('side') === 'hidden') $('side').classList.add('hidden');
var w = +store('sideW'); if (w) document.documentElement.style.setProperty('--side-w', w + 'px');
$('sash').addEventListener('mousedown', function(e){
  e.preventDefault(); $('sash').classList.add('drag'); document.body.classList.add('dragging');
  var move = function(ev){ var x = Math.max(200, Math.min(ev.clientX, innerWidth * .6)); document.documentElement.style.setProperty('--side-w', x + 'px'); store('sideW', String(Math.round(x))); };
  var up = function(){ $('sash').classList.remove('drag'); document.body.classList.remove('dragging'); removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});
$('bBranch').onclick = function(){ if (byId[cur] && byId[cur].status !== 'discarded') branch(cur); };
$('bGone').onclick = function(){ showGone = !showGone; store('gone', showGone ? '1' : '0'); drawTree(); };
$('bHome').onclick = home;

/* People and agents run git too: catch up with it now and then. */
refresh();
setInterval(function(){ if (!document.hidden) refresh(); }, 5000);
/* `grove branch` and the other commands tell grove of their changes: catch
   up at once, and say which ideas are new. */
function watch(v){
  fetch('/api/ideas/wait?v=' + v).then(function(r){ return r.json(); }).then(function(j){
    if (v < 0 || j.v === v) return watch(j.v);
    var had = byId;
    refresh().then(function(){
      if ('' in had) ideas.forEach(function(i){ if (!(i.id in had)) toast('New idea: ' + i.name + (byId[i.parent] ? ', from ' + byId[i.parent].name : ''), 'info'); });
    });
    watch(j.v);
  }).catch(function(){ setTimeout(function(){ watch(-1); }, 5000); });
}
watch(-1);
addEventListener('focus', refresh);
})();
</script>
