# The demo project: `vcc build` here generates all three backends and both bins.
# Impl paths in sys/*.sys are relative to sys/.
[project]
name = "demo"
sources = ["sys"]

[go]
out = "go/app"               # types in go/app/types
post = ["go build -C ./go ./cmd/demo", "go build -C ./go ./cmd/calc", "go build -C ./go ./cmd/api"]

[rust]
out = "rs/src/app"
post = ["cargo build --manifest-path rs/Cargo.toml"]

[python]
out = "py/app"
post = ["python3 -m compileall -q py/app"]
test = ["python3 -m unittest discover -s py"]

[bin.demo]                   # go/cmd/demo, rs/src/bin/demo.rs
entry = "Main"

[bin.calc]                   # calc <base: int>
entry = "Calc"


[http.api]                   # go/cmd/api, rs/src/bin/api.rs
addr = "127.0.0.1:8099"
routes = { "POST /api/measure" = "Measure", "GET /api/hello" = "Hello" }
static = { "/" = "web/index.html" }
